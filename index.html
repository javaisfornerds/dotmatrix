<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.matrix</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke="%231F51FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14 32 32 50 14 50 50"/></g><g fill="%231F51FF"><circle cx="14" cy="14" r="5"/><circle cx="14" cy="50" r="5"/><circle cx="32" cy="32" r="5"/><circle cx="50" cy="14" r="5"/><circle cx="50" cy="32" r="5"/><circle cx="50" cy="50" r="5"/></g></svg>'>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f7;
      --paper: #ffffff;
      --ink: #050505;
      --muted: #6d6d6d;
      --line-soft: rgba(5, 5, 5, 0.14);
      --line: #050505;
      --toolbar: rgba(255, 255, 255, 0.92);
      --border: #d7d7d7;
      --button: #ffffff;
      --button-hover: #efefef;
      --button-hover-ink: #ffffff;
      --shadow: rgba(0, 0, 0, 0.12);
      --selected: #000000;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #050505;
      --paper: #000000;
      --ink: #f6f6f6;
      --muted: #969696;
      --line-soft: rgba(246, 246, 246, 0.18);
      --line: #f6f6f6;
      --toolbar: rgba(0, 0, 0, 0.9);
      --border: #303030;
      --button: #090909;
      --button-hover: #171717;
      --button-hover-ink: #000000;
      --shadow: rgba(255, 255, 255, 0.06);
      --selected: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 36px 1fr;
      grid-template-rows: 54px 28px 1fr;
    }

    .toolbar {
      position: relative;
      z-index: 5;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--toolbar);
      box-shadow: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .toolbar-group.primary-actions {
      gap: 6px;
    }

    .spacer {
      flex: 1 1 auto;
      min-width: 8px;
    }

    button {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      height: 38px;
      border: 1px solid transparent;
      border-radius: 0;
      background: var(--button);
      color: var(--ink);
      font: inherit;
      line-height: 1;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--button-hover-ink);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.36;
      transform: none;
    }

    .text-button {
      width: auto;
      min-width: 78px;
      padding: 0 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .primary-actions .text-button,
    .primary-actions .brand-button {
      min-width: auto;
      height: 34px;
      border-color: transparent;
      background: transparent;
      padding: 0 9px;
    }

    .primary-actions .text-button:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--button-hover-ink);
    }

    .primary-actions .brand-button:hover {
      background: #1F51FF !important;
      border-color: #1F51FF !important;
      color: var(--paper) !important;
    }

    .primary-actions .text-button.is-active {
      border-color: transparent;
      box-shadow: none;
      color: #1F51FF;
    }

    #viewButton.is-active {
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    #viewButton.is-active:hover {
      color: var(--button-hover-ink);
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      pointer-events: none;
    }

    .bucket-icon {
      width: 22px;
      height: 22px;
    }

    .bucket-solid {
      fill: currentColor;
      stroke: none;
    }

    .bucket-handle {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 1.35;
    }

    .grid-icon {
      width: 20px;
      height: 20px;
    }

    .sound-icon {
      width: 22px;
      height: 22px;
    }

    .eraser-icon {
      width: 24px;
      height: 24px;
      stroke-width: 1.85;
    }

    .eraser-icon .eraser-upper {
      fill: currentColor;
      stroke: currentColor;
      transition: fill 140ms ease;
    }

    button:hover .eraser-icon .eraser-lower {
      fill: var(--ink);
    }

    .eraser-icon .eraser-lower {
      fill: var(--button);
      stroke: currentColor;
    }

    .pencil-icon {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke: currentColor;
    }

    .pencil-icon .pencil-upper {
      fill: var(--paper);
      stroke: currentColor;
    }

    .pencil-icon .pencil-lower {
      fill: #1F51FF;
      stroke: currentColor;
      transition: fill 140ms ease;
    }

    .pencil-icon .pencil-divide {
      stroke: currentColor;
    }

    /* when accent mode is OFF, body is ink color */
    .pencil-icon.pencil-mono .pencil-lower {
      fill: currentColor;
    }

    button:hover .pencil-icon .pencil-upper {
      fill: var(--ink) !important;
      stroke: var(--button-hover-ink) !important;
    }

    button:hover .pencil-icon .pencil-lower {
      fill: var(--button-hover-ink) !important;
    }

    button:hover #bucketFillPath {
      fill: var(--button-hover-ink) !important;
    }

    .zoom-readout {
      display: block;
      width: 50px;
      height: 100%;
      border: 0;
      border-radius: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
    }

    .zoom-readout:focus {
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .zoom-pill {
      position: fixed;
      bottom: 18px;
      left: 88px;
      z-index: 10;
      display: inline-grid;
      grid-template-columns: 28px 50px 28px;
      align-items: center;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--toolbar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 2px 8px var(--shadow);
      overflow: hidden;
    }

    .zoom-lock-circle {
      position: fixed;
      bottom: 18px;
      left: 54px;
      z-index: 10;
      width: 28px;
      height: 28px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--toolbar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 2px 8px var(--shadow);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .zoom-pill button {
      min-width: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: background 140ms ease, color 140ms ease;
    }

    .zoom-pill button:hover {
      background: var(--ink);
      color: var(--button-hover-ink);
    }

    .zoom-pill button:active {
      transform: translateY(1px);
    }

    .zoom-pill button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: -2px;
    }

    .zoom-pill button:disabled {
      opacity: 0.36;
      cursor: default;
      transform: none;
    }

    .zoom-pill .zoom-readout + button,
    .zoom-pill button + .zoom-readout {
      border-left: 1px solid var(--border);
    }

    #zoomInButton {
      padding-left: 0;
      padding-right: 0;
    }

    #zoomInButton svg {
      margin-right: 1px;
    }

    .zoom-lock-circle:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--button-hover-ink);
    }

    .zoom-lock-circle:active {
      transform: translateY(1px);
    }

    .zoom-lock-circle.is-active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--button-hover-ink);
    }

    .thickness-wrap {
      position: relative;
    }

    .tool-wrap {
      position: relative;
    }

    .popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 20;
      display: none;
      width: 200px;
      padding: 14px;
      border: 1px solid var(--border);
      background: var(--toolbar);
      box-shadow: 0 8px 24px var(--shadow);
      transform: translateX(-50%);
    }

    .palette-popover {
      width: 230px;
    }

    .popover.is-open {
      display: block;
    }

    button.is-active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .shade-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .shade {
      width: 24px;
      min-width: 24px;
      height: 24px;
      border-color: var(--border);
    }

    .shade.is-active {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #1f51ff;
      pointer-events: none;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
    }

    .ruler-corner {
      grid-column: 1;
      grid-row: 2;
      background: var(--button);
      pointer-events: none;
    }

    .ruler-corner::after {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 2D light */
    .ruler-corner::after { background: rgba(5,5,5,0.03); }

    /* 2D dark */
    [data-theme="dark"] .ruler-corner::after { background: rgba(246,246,246,0.04); }

    /* 3D light */
    [data-ruler-3d] .ruler-corner::after { background: rgba(31,81,255,0.04); }

    /* 3D dark */
    [data-theme="dark"][data-ruler-3d] .ruler-corner::after { background: rgba(31,81,255,0.06); }

    .top-ruler {
      grid-column: 2;
      grid-row: 2;
      border-bottom: 1px solid var(--border);
      background: var(--button);
    }

    .left-ruler {
      grid-column: 1;
      grid-row: 3;
      border-right: 1px solid var(--border);
      background: var(--button);
    }

    .stage {
      position: relative;
      grid-column: 2;
      grid-row: 3;
      min-height: 0;
      background: var(--paper);
      cursor: crosshair;
      touch-action: none;
    }

    .stage.is-panning {
      cursor: grabbing;
    }

    .measure {
      position: absolute;
      z-index: 12;
      display: none;
      min-width: 48px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      background: var(--toolbar);
      color: var(--ink);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      pointer-events: none;
      transform: translate(10px, -28px);
    }

    .measure.is-visible {
      display: block;
    }

    .coords {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 90;
      display: block;
      padding: 4px 6px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      pointer-events: none;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-popover {
      top: 100%;
      right: auto;
      left: 0;
      width: 180px;
      padding: 6px;
      background: var(--button);
      transform: none;
    }

    .brand-wrap.is-menu-open > .brand-popover,
    .menu-wrap.is-menu-open > .menu-popover {
      display: block;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 34px;
      border-color: transparent;
      background: transparent;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .menu-item:hover {
      background: var(--ink);
      border-color: transparent;
      color: var(--button-hover-ink);
    }

    .menu-item.is-active::after {
      content: "✓";
    }

    .menu-item.is-active {
      border-color: transparent;
      box-shadow: none;
    }

    .menu-label {
      padding: 8px 8px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .brand-wrap {
      position: relative;
    }

    .brand-button {
      min-width: auto;
      padding: 0 10px;
      border-color: transparent;
      background: transparent;
      color: #1F51FF;
      font-weight: 800;
    }

    .brand-button:hover {
      background: #1F51FF !important;
      border-color: #1F51FF !important;
      color: var(--paper) !important;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .brand-mark .mark-line {
      stroke-width: 3.2;
    }

    .brand-mark .mark-dot {
      fill: currentColor;
      stroke: none;
    }

    .brand-popover {
      left: 0;
      width: auto;
      min-width: 170px;
      background: var(--button);
      font-size: 13px;
      font-weight: 700;
      transform: none;
    }

    .brand-version {
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 12px;
      white-space: nowrap;
    }

    .brand-credit {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .view-overlay {
      position: fixed;
      top: 54px;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.18);
    }

    .view-overlay.is-open {
      display: grid;
    }

    .view-box {
      width: min(90vw, 1100px);
      height: min(80vh, 780px);
      border: 1px solid var(--border);
      outline: 0;
      background: var(--paper);
      box-shadow: 0 16px 48px var(--shadow);
    }

    #viewCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .confirm-overlay.is-open {
      display: grid;
    }

    .save-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .save-overlay.is-open {
      display: grid;
    }

    .confirm-box {
      min-width: 340px;
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--ink);
      padding: 24px;
      box-shadow: 0 16px 48px var(--shadow);
    }

    .save-box {
      min-width: 380px;
    }

    .confirm-message {
      margin-bottom: 16px;
      font-weight: 700;
    }

    .save-input {
      width: 100%;
      height: 38px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      padding: 0 10px;
      font: inherit;
      outline: none;
    }

    .save-input:focus {
      border-color: var(--ink);
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .confirm-actions .text-button {
      min-width: auto;
      height: 30px;
      border-color: transparent;
      background: transparent;
      padding: 0 8px;
      font-size: 12px;
    }

    .confirm-actions .text-button:hover {
      background: var(--ink);
      border-color: transparent;
      color: var(--button-hover-ink);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 620px) {
      body {
        grid-template-columns: 30px 1fr;
        grid-template-rows: 50px 24px 1fr;
      }

      .toolbar {
        gap: 5px;
        padding: 6px;
      }

      button {
        min-width: 36px;
        height: 36px;
      }

      .text-button {
        min-width: 64px;
        padding: 0 10px;
      }

      .zoom-readout {
        width: 50px;
        height: 100%;
        font-size: 12px;
      }

      .popover {
        right: 0;
        left: auto;
        transform: none;
      }
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.38);
      pointer-events: none;
    }

    .drop-overlay.is-active {
      display: grid;
    }

    .drop-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 36px 48px;
      border: 2px dashed var(--border);
      background: var(--toolbar);
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 16px 48px var(--shadow);
      pointer-events: none;
    }

    .drop-icon {
      width: 40px;
      height: 40px;
      stroke: #1F51FF;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    /* ── 3D mode ─────────────────────────────────────────────────────── */
    #toggleDimensionButton.is-active {
      border-color: transparent;
      color: var(--ink);
      box-shadow: none;
      background: transparent;
    }

    #toggleDimensionButton.is-active:hover {
      background: var(--ink);
      color: var(--button-hover-ink);
      border-color: var(--ink);
      box-shadow: none;
    }

    .threed-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: var(--paper);
      overflow: hidden;
    }

    #threedCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-group primary-actions">
      <div class="brand-wrap">
        <button class="brand-button" id="brandButton" type="button" aria-label=".matrix">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <path class="mark-line" d="M14 14 32 32 50 14 50 50"></path>
            <circle class="mark-dot" cx="14" cy="14" r="5"></circle>
            <circle class="mark-dot" cx="14" cy="50" r="5"></circle>
            <circle class="mark-dot" cx="32" cy="32" r="5"></circle>
            <circle class="mark-dot" cx="50" cy="14" r="5"></circle>
            <circle class="mark-dot" cx="50" cy="32" r="5"></circle>
            <circle class="mark-dot" cx="50" cy="50" r="5"></circle>
          </svg>
        </button>
        <div class="popover brand-popover" id="brandPopover">
          <div class="brand-version">.matrix v.8.3.1</div>
          <div class="brand-version">Created by <a href="mailto:brandon.wu.118@gmail.com?subject=Re%3A%20.matrix" style="color:inherit;text-decoration:underline;">Brandon Wu</a></div>
          <div class="brand-version" data-i18n="license">License: GPL 3.0</div>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="text-button" id="fileButton" type="button" aria-label="File" data-i18n="file">File</button>
        <div class="popover menu-popover" id="filePopover">
          <button class="menu-item" id="saveJsonButton" type="button" data-i18n="saveJson">Save as JSON</button>
          <button class="menu-item" id="saveSvgButton" type="button" data-i18n="saveSvg">Save as SVG</button>
          <button class="menu-item" id="savePngButton" type="button" data-i18n="savePng">Save as PNG</button>
          <button class="menu-item" id="save3dButton" type="button" data-i18n="save3d" style="display:none">Save as 3D</button>
          <button class="menu-item" id="loadButton" type="button" data-i18n="load">Load JSON/SVG</button>
          <button class="menu-item" id="load3dButton" type="button" data-i18n="load3d" style="display:none">Load 3D</button>
          <button class="menu-item" id="randomizeButton" type="button" data-i18n="randomize">Randomize</button>
          <button class="menu-item" id="randomize3dButton" type="button" data-i18n="randomize" style="display:none">Randomize</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="text-button" id="settingsButton" type="button" aria-label="Settings" data-i18n="settings">Settings</button>

          dim3dEnter: "Limpar a folha e criar um espaço 3D?",
          dim3dExit: "Limpar o espaço 3D e voltar ao 2D?",
          clear3dPrompt: "Limpar este espaço 3D?",
          dim3dFromZ: "Origem: Z",

          zoomIn: "Aumentar zoom",
          grid: "Grade",
          theme: "Tema",
          fullscreen: "Tela cheia",
          roundLine: "Linha curva"
        }
      };

      function t(key) {
        return (copy[state.lang] || copy.en)[key] || copy.en[key] || key;
      }

      function readCss(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function invalidateFillCache() {
        fillRevision += 1;
        fillCache = null;
      }


      function playSound(kind) {
        if (!state.soundEnabled) return;
        try {
          audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const settings = {
            button: [520, 0.018, 0.026],
            click: [300, 0.014, 0.034],
            drag: [170, 0.01, 0.05],
            connect: [680, 0.018, 0.055],
            layerUp: [420, 0.014, 0.04],
            layerDown: [280, 0.014, 0.04]
          }[kind] || [420, 0.012, 0.03];
          osc.type = kind === "drag" ? "sine" : "triangle";
          osc.frequency.setValueAtTime(settings[0], now);
          if (kind === "connect") osc.frequency.exponentialRampToValueAtTime(900, now + settings[2]);
          if (kind === "layerUp")   osc.frequency.exponentialRampToValueAtTime(560, now + settings[2]);
          if (kind === "layerDown") osc.frequency.exponentialRampToValueAtTime(210, now + settings[2]);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(settings[1], now + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + settings[2]);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + settings[2] + 0.02);
        } catch {
          // Sound is optional; drawing should never depend on audio availability.
        }
      }

      function playDragSound() {
        const now = performance.now();
        if (now - lastDragSound < 90) return;
        lastDragSound = now;
        playSound("drag");
      }

      function resizeCanvas() {
        refreshCssCache();
        const rect = stage.getBoundingClientRect();
        const topRect = topRulerCanvas.parentElement.getBoundingClientRect();
        const leftRect = leftRulerCanvas.parentElement.getBoundingClientRect();
        const dpr = livePixelRatio;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasRect.width = rect.width; canvasRect.height = rect.height;
        topRulerCanvas.width = Math.round(topRect.width * dpr);
        topRulerCanvas.height = Math.round(topRect.height * dpr);
        topRulerCanvas.style.width = `${topRect.width}px`;
        topRulerCanvas.style.height = `${topRect.height}px`;
        topRulerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        rulerCache.topW = topRect.width; rulerCache.topH = topRect.height;
        leftRulerCanvas.width = Math.round(leftRect.width * dpr);
        leftRulerCanvas.height = Math.round(leftRect.height * dpr);
        leftRulerCanvas.style.width = `${leftRect.width}px`;
        leftRulerCanvas.style.height = `${leftRect.height}px`;
        leftRulerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        rulerCache.leftW = leftRect.width; rulerCache.leftH = leftRect.height;
        draw();
      }

      function screenToWorld(x, y) {
        return {
          x: (x - state.offsetX) / state.scale,
          y: (y - state.offsetY) / state.scale
        };
      }

      function worldToScreen(x, y) {
        return {
          x: x * state.scale + state.offsetX,
          y: y * state.scale + state.offsetY
        };
      }

      // Hard boundary: the canvas world extends ±200 grid units from origin.
      const worldLimit = 200 * grid;
      function clampOffset() {
        const w = canvasRect.width || 800;
        const h = canvasRect.height || 600;
        const maxX = worldLimit * state.scale;
        const minX = w - worldLimit * state.scale;
        const maxY = worldLimit * state.scale;
        const minY = h - worldLimit * state.scale;
        state.offsetX = Math.max(Math.min(maxX, minX), Math.min(Math.max(maxX, minX), state.offsetX));
        state.offsetY = Math.max(Math.min(maxY, minY), Math.min(Math.max(maxY, minY), state.offsetY));
      }

      function activeGridStep() {
        let step = grid;
        let spacing = step * state.scale;
        while (spacing > 34 && step > grid / 128) {
          step /= 2;
          spacing = step * state.scale;
        }
        while (spacing < 10 && step < grid * 64) {
          step *= 2;
          spacing = step * state.scale;
        }
        return step;
      }

      function snapWorld(value, step) {
        return Math.round(value / step) * step;
      }

      function snappedDotFromClient(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const world = screenToWorld(clientX - rect.left, clientY - rect.top);
        const step = activeGridStep();
        const dot = {
          x: snapWorld(world.x, step),
          y: snapWorld(world.y, step)
        };
        const screen = worldToScreen(dot.x, dot.y);
        return {
          x: dot.x,
          y: dot.y,
          sx: screen.x,
          sy: screen.y
        };
      }

      function isBaseGridPoint(value) {
        return Math.abs(value / grid - Math.round(value / grid)) < 0.0001;
      }

      function niceUnitStep(targetUnits) {
        const exponent = Math.floor(Math.log10(Math.max(targetUnits, 0.001)));
        const base = 10 ** exponent;
        const fraction = targetUnits / base;
        const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
        return nice * base;
      }

      function rulerStep() {
        // Clamp so ruler labels are always whole numbers (never show decimals)
        const activeScale = is3D ? t3Scale : state.scale;
        return Math.max(grid, niceUnitStep(84 / (activeScale * grid)) * grid);
      }

      function formatUnits(worldDistance) {
        const units = worldDistance / grid;
        if (Math.abs(units) >= 100) return units.toFixed(1).replace(/\.0$/, "");
        return units.toFixed(2).replace(/0$/, "").replace(/\.0$/, "");
      }

      function dragLength() {
        if (!state.dragFrom || !state.hover) return 0;
        return Math.hypot(state.hover.x - state.dragFrom.x, state.hover.y - state.dragFrom.y);
      }

      function nearestDot(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const dot = snappedDotFromClient(clientX, clientY);
        const distance = Math.hypot(dot.sx - sx, dot.sy - sy);
        const step = activeGridStep();
        const threshold = Math.max(7, Math.min(18, step * state.scale * 0.46));
        if (distance > threshold) return null;
        return {
          x: dot.x,
          y: dot.y,
          sx: dot.sx,
          sy: dot.sy,
          distance
        };
      }

      function samePoint(a, b) {
        return a && b && a.x === b.x && a.y === b.y;
      }

      function sameLine(a, b) {
        return (samePoint(a.from, b.from) && samePoint(a.to, b.to)) ||
          (samePoint(a.from, b.to) && samePoint(a.to, b.from));
      }

      function cloneFill(fill) {
        // Only copy the tiny seed/kind/shade — never the bitmap (_regionCanvas etc.).
        // Bitmaps are re-frozen lazily on the next draw() call; storing them in every
        // undo entry was the main source of 300-600 MB memory usage.
        return { seed: { x: fill.seed.x, y: fill.seed.y }, kind: fill.kind, shade: fill.shade };
      }

      // Compute and freeze the fill's pixel region using the current lines as boundary.
      // Stores a pre-rendered canvas so compositing is a fast drawImage, not a pixel loop.
      // Always bake at maxScale (3×) so drawScale is always ≤1 — we only ever downscale,
      // which is crisp at every zoom level. Budget caps prevent OOM on large drawings.
      function freezeFillRegion(fill) {
        const bounds = drawingBounds([fill.seed]);
        const worldWidth = Math.max(1, bounds.maxX - bounds.minX);
        const worldHeight = Math.max(1, bounds.maxY - bounds.minY);
        // Bake at maxScale so the canvas is always high-enough resolution for any zoom level.
        const pixelBudget = 2000000;
        const budgetScale = Math.sqrt(pixelBudget / (worldWidth * worldHeight));
        const fillScale = Math.min(2, budgetScale); // cap at 2x — crisp enough, halves RAM vs 3x
        const safeScale = Number.isFinite(fillScale) && fillScale > 0 ? fillScale : 1;
        const fw = Math.max(1, Math.ceil(worldWidth * safeScale));
        const fh = Math.max(1, Math.ceil(worldHeight * safeScale));
        const toPixel = point => ({
          x: (point.x - bounds.minX) * safeScale,
          y: (point.y - bounds.minY) * safeScale
        });
        // Build boundary with a fat line so fill stops cleanly inside strokes
        const boundary = drawBoundaryMap(state.lines, fw, fh, toPixel,
          safeScale, seg => Math.max(2, segmentThickness(seg) * safeScale * 0.9));
        const seed = toPixel(fill.seed);
        const region = floodRegion(seed, boundary, fw, fh);
        if (!region) return false;

        // Bake the colored region into a canvas right now — rendering just does drawImage
        const color = colorParts(paintColor(fill.kind, fill.shade, 0.72));
        const regionCanvas = document.createElement("canvas");
        regionCanvas.width = fw;
        regionCanvas.height = fh;
        const rCtx = regionCanvas.getContext("2d");
        const imgData = rCtx.createImageData(fw, fh);
        for (let i = 0; i < region.length; i++) {
          if (!region[i]) continue;
          const off = i * 4;
          imgData.data[off]     = color[0];
          imgData.data[off + 1] = color[1];
          imgData.data[off + 2] = color[2];
          imgData.data[off + 3] = color[3];
        }
        rCtx.putImageData(imgData, 0, 0);

        fill._region = region;
        fill._regionCanvas = regionCanvas;
        fill._regionBounds = bounds;
        fill._regionScale = safeScale;
        return true;
      }

      function pointKey(point) {
        return `${point.x},${point.y}`;
      }

      function currentLineColorMode() {
        return state.accentMode ? "accent" : "mono";
      }

      function lineColor(segment) {
        return segment.colorMode === "accent" ? cobalt : cssCache.line;
      }

      function screenLineWidth(segment) {
        return Math.max(0.7, Math.min(18, segmentThickness(segment) * state.scale));
      }

      function maskLineWidth(segment) {
        return Math.max(0.5, screenLineWidth(segment) * 0.55);
      }

      function pushUndo(action) {
        state.undoStack.push(action);
        if (state.undoStack.length > 80) state.undoStack.shift();
        state.redoStack = [];
      }

      function findPathBetweenPoints(from, to, lines) {
        const targetKey = pointKey(to);
        const graph = new Map();
        const addEdge = (a, b, line) => {
          const key = pointKey(a);
          if (!graph.has(key)) graph.set(key, []);
          graph.get(key).push({ point: b, line });
        };
        for (const line of lines) {
          addEdge(line.from, line.to, line);
          addEdge(line.to, line.from, line);
        }
        const startKey = pointKey(from);
        const queue = [{ point: from, path: [] }];
        const seen = new Set([startKey]);
        while (queue.length) {
          const current = queue.shift();
          if (pointKey(current.point) === targetKey) return current.path;
          const edges = graph.get(pointKey(current.point)) || [];
          for (const edge of edges) {
            const key = pointKey(edge.point);
            if (seen.has(key)) continue;
            seen.add(key);
            queue.push({ point: edge.point, path: [...current.path, edge.line] });
          }
        }
        return null;
      }

      function flashClosedOutline(line, previousLines) {
        const path = findPathBetweenPoints(line.to, line.from, previousLines);
        if (!path || !path.length) return;
        state.closeHighlight = {
          lines: [...path, line],
          until: performance.now() + 1150,
          duration: 1150
        };
        window.setTimeout(() => {
          if (state.closeHighlight && performance.now() >= state.closeHighlight.until) {
            state.closeHighlight = null;
            draw();
          }
        }, 1180);
      }

      function splitBounds(lines, fills, addedLine) {
        let minX=addedLine.from.x, minY=addedLine.from.y, maxX=addedLine.from.x, maxY=addedLine.from.y;
        const chk = p => { if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; };
        chk(addedLine.to);
        for (const l of lines) { chk(l.from); chk(l.to); }
        for (const f of fills) chk(f.seed);
        const pad = grid * 3;
        return { minX: minX-pad, minY: minY-pad, maxX: maxX+pad, maxY: maxY+pad };
      }

      function drawBoundaryMap(lines, width, height, toPixel, scale, lineWidthFn) {
        const boundaryCanvas = document.createElement("canvas");
        boundaryCanvas.width = width;
        boundaryCanvas.height = height;
        const boundaryCtx = boundaryCanvas.getContext("2d");
        boundaryCtx.strokeStyle = "#000";
        boundaryCtx.lineCap = "round";
        boundaryCtx.lineJoin = "round";
        for (const line of lines) {
          const from = toPixel(line.from);
          const to = toPixel(line.to);
          boundaryCtx.lineWidth = lineWidthFn
            ? lineWidthFn(line)
            : Math.max(1, segmentThickness(line) * scale * 0.72);
          boundaryCtx.beginPath();
          boundaryCtx.moveTo(from.x, from.y);
          if (line.cp) {
            const cp = toPixel(line.cp);
            boundaryCtx.quadraticCurveTo(cp.x, cp.y, to.x, to.y);
          } else {
            boundaryCtx.lineTo(to.x, to.y);
          }
          boundaryCtx.stroke();
        }
        const data = boundaryCtx.getImageData(0, 0, width, height).data;
        const boundary = new Uint8Array(width * height);
        for (let index = 0; index < boundary.length; index += 1) {
          boundary[index] = data[index * 4 + 3] > 0 ? 1 : 0;
        }
        return boundary;
      }

      function floodRegion(seed, boundary, width, height) {
        const sx = Math.round(seed.x);
        const sy = Math.round(seed.y);
        if (sx < 0 || sy < 0 || sx >= width || sy >= height) return null;
        const startId = sy * width + sx;
        if (boundary[startId]) return null;
        // Flat index queue — avoids allocating [x,y] tuple objects per pixel
        const total = width * height;
        const queue = new Int32Array(total);
        const seen = new Uint8Array(total);
        let head = 0, tail = 0;
        queue[tail++] = startId;
        seen[startId] = 1;
        let reachedEdge = false;
        while (head < tail) {
          const id = queue[head++];
          const x = id % width;
          const y = (id - x) / width;
          if (x === 0 || y === 0 || x === width - 1 || y === height - 1) reachedEdge = true;
          // inline 4-neighbor expansion
          const r = id + 1; if (x < width-1  && !seen[r] && !boundary[r]) { seen[r]=1; queue[tail++]=r; }
          const l = id - 1; if (x > 0        && !seen[l] && !boundary[l]) { seen[l]=1; queue[tail++]=l; }
          const d = id + width; if (y < height-1 && !seen[d] && !boundary[d]) { seen[d]=1; queue[tail++]=d; }
          const u = id - width; if (y > 0       && !seen[u] && !boundary[u]) { seen[u]=1; queue[tail++]=u; }
        }
        return reachedEdge ? null : seen;
      }

      function drawingBounds(extraPoints = []) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const line of state.lines) {
          if (line.from.x < minX) minX = line.from.x; if (line.from.y < minY) minY = line.from.y;
          if (line.from.x > maxX) maxX = line.from.x; if (line.from.y > maxY) maxY = line.from.y;
          if (line.to.x < minX) minX = line.to.x; if (line.to.y < minY) minY = line.to.y;
          if (line.to.x > maxX) maxX = line.to.x; if (line.to.y > maxY) maxY = line.to.y;
        }
        for (const fill of state.fills) {
          if (fill.seed.x < minX) minX = fill.seed.x; if (fill.seed.y < minY) minY = fill.seed.y;
          if (fill.seed.x > maxX) maxX = fill.seed.x; if (fill.seed.y > maxY) maxY = fill.seed.y;
        }
        for (const pt of extraPoints) {
          if (pt.x < minX) minX = pt.x; if (pt.y < minY) minY = pt.y;
          if (pt.x > maxX) maxX = pt.x; if (pt.y > maxY) maxY = pt.y;
        }
        if (!isFinite(minX)) return { minX: -grid * 8, minY: -grid * 6, maxX: grid * 8, maxY: grid * 6 };
        const pad = grid * 3;
        return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
      }

      function layerGeometry(bounds, maxPixels = 1600000, maxScale = 2) {
        const worldWidth = Math.max(1, bounds.maxX - bounds.minX);
        const worldHeight = Math.max(1, bounds.maxY - bounds.minY);
        const scale = Math.min(maxScale, Math.sqrt(maxPixels / (worldWidth * worldHeight)));
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        return {
          scale: safeScale,
          width: Math.max(1, Math.ceil(worldWidth * safeScale)),
          height: Math.max(1, Math.ceil(worldHeight * safeScale)),
          worldWidth,
          worldHeight
        };
      }

      function toLayerPoint(bounds, scale, point) {
        return {
          x: (point.x - bounds.minX) * scale,
          y: (point.y - bounds.minY) * scale
        };
      }

      function splitExistingFills(previousFills, previousLines, newLine) {
        if (!previousFills.length || !previousLines.length) return previousFills.map(cloneFill);
        const bounds = splitBounds(previousLines, previousFills, newLine);
        const worldWidth = Math.max(1, bounds.maxX - bounds.minX);
        const worldHeight = Math.max(1, bounds.maxY - bounds.minY);
        const scale = Math.min(1, Math.sqrt(260000 / (worldWidth * worldHeight)));
        const width = Math.max(1, Math.ceil(worldWidth * scale));
        const height = Math.max(1, Math.ceil(worldHeight * scale));
        const toPixel = point => ({
          x: (point.x - bounds.minX) * scale,
          y: (point.y - bounds.minY) * scale
        });
        const toWorld = point => ({
          x: point.x / scale + bounds.minX,
          y: point.y / scale + bounds.minY
        });
        const oldBoundary = drawBoundaryMap(previousLines, width, height, toPixel, scale);
        const newBoundary = drawBoundaryMap([...previousLines, newLine], width, height, toPixel, scale);
        const nextFills = [];
        for (const fill of previousFills) {
          const oldRegion = floodRegion(toPixel(fill.seed), oldBoundary, width, height);
          if (!oldRegion) {
            nextFills.push(cloneFill(fill));
            continue;
          }
          const visited = new Uint8Array(width * height);
          const components = [];
          for (let start = 0; start < oldRegion.length; start += 1) {
            if (!oldRegion[start] || visited[start] || newBoundary[start]) continue;
            const queue = [start];
            visited[start] = 1;
            let count = 0;
            let sumX = 0;
            let sumY = 0;
            while (queue.length) {
              const id = queue.pop();
              const x = id % width;
              const y = Math.floor(id / width);
              count += 1;
              sumX += x;
              sumY += y;
              const neighbors = [id + 1, id - 1, id + width, id - width];
              for (const nextId of neighbors) {
                if (nextId < 0 || nextId >= oldRegion.length || visited[nextId]) continue;
                const nx = nextId % width;
                const ny = Math.floor(nextId / width);
                if (Math.abs(nx - x) + Math.abs(ny - y) !== 1) continue;
                if (!oldRegion[nextId] || newBoundary[nextId]) continue;
                visited[nextId] = 1;
                queue.push(nextId);
              }
            }
            if (count > 4) components.push({ x: sumX / count, y: sumY / count, count });
          }
          if (!components.length) {
            nextFills.push(cloneFill(fill));
            continue;
          }
          for (const component of components) {
            nextFills.push({
              seed: toWorld(component),
              kind: fill.kind,
              shade: fill.shade
            });
          }
        }
        return nextFills;
      }

      function addLine(from, to) {
        if (!from || !to || samePoint(from, to)) return false;
        const previousLines = state.lines.slice();
        const previousFills = state.fills.map(cloneFill);
        const next = {
          from: { x: from.x, y: from.y },
          to: { x: to.x, y: to.y },
          thickness: state.thickness,
          colorMode: currentLineColorMode()
        };
        if (state.lines.some(line => sameLine(line, next))) return false;
        // Fills are frozen bitmaps — no need to split them geometrically.
        // Just carry them forward as-is; their stored _region is unchanged.
        state.lines.push(next);
        invalidateFillCache();
        state.redo = [];
        pushUndo({ type: "addLine", line: next, previousFills, nextFills: previousFills });
        flashClosedOutline(next, previousLines);
        playSound("connect");
        persist(true);
        return true;
      }

      function connectClickedDot(dot) {
        if (!state.selected) {
          state.selected = { x: dot.x, y: dot.y };
          state.hover = { x: dot.x, y: dot.y };
        } else if (samePoint(state.selected, dot)) {
          state.selected = null;
        } else {
          addLine(state.selected, dot);
          state.selected = { x: dot.x, y: dot.y };
        }
      }

      function endCurrentConnect() {
        state.selected = null;
        state.hover = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        wasdDot = null;
        measure.classList.remove("is-visible");
        draw();
      }

      function undo() {
        const action = state.undoStack.pop();
        if (!action) return;
        if (action.type === "addLine") {
          state.lines.pop();
          if (action.previousFills) state.fills = action.previousFills.map(cloneFill);
          invalidateFillCache();
        } else if (action.type === "addFill") {
          state.fills.pop();
          invalidateFillCache();
        } else if (action.type === "removeFill") {
          state.fills.splice(action.index, 0, action.fill);
          invalidateFillCache();
        } else if (action.type === "addDot") {
          state.dots.pop();
        } else if (action.type === "removeDot") {
          state.dots.splice(action.index, 0, action.dot);
        } else if (action.type === "bendLine") {
          state.lines.splice(action.index, 2, action.original);
          invalidateFillCache();
        } else if (action.type === "removeLine") {
          state.lines.splice(action.index, 0, action.line);
          if (action.previousFills) state.fills = action.previousFills.map(cloneFill);
          invalidateFillCache();
        } else if (action.type === "roundLine") {
          state.lines = action.prevLines.slice();
          if (action.prevFills) state.fills = action.prevFills.map(cloneFill);
          invalidateFillCache();
        }
        state.redoStack.push(action);
        state.selected = null;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        persist(true);
        draw();
        updateControls();
      }

      function redo() {
        const action = state.redoStack.pop();
        if (!action) return;
        if (action.type === "addLine") {
          state.lines.push(action.line);
          if (action.nextFills) state.fills = action.nextFills.map(cloneFill);
          invalidateFillCache();
        } else if (action.type === "addFill") {
          state.fills.push(action.fill);
          invalidateFillCache();
        } else if (action.type === "removeFill") {
          state.fills.splice(action.index, 1);
          invalidateFillCache();
        } else if (action.type === "addDot") {
          state.dots.push(action.dot);
        } else if (action.type === "removeDot") {
          state.dots.splice(action.index, 1);
        } else if (action.type === "bendLine") {
          state.lines.splice(action.index, 1, ...action.replacement);
          invalidateFillCache();
        } else if (action.type === "removeLine") {
          state.lines.splice(action.index, 1);
          if (action.nextFills) state.fills = action.nextFills.map(cloneFill);
          invalidateFillCache();
        } else if (action.type === "roundLine") {
          state.lines = action.newLines.slice();
          invalidateFillCache();
        }
        state.undoStack.push(action);
        state.selected = null;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        persist(true);
        draw();
        updateControls();
      }

      function zoomAt(nextScale, sx, sy) {
        if (state.zoomLocked) return;
        // Snap to whole percentage steps (1%, 2%, ...) so zoom display is always a clean integer
        const rawPct = nextScale * 100;
        const snappedPct = Math.max(Math.round(minScale * 100), Math.min(Math.round(maxScale * 100), Math.round(rawPct)));
        const clamped = snappedPct / 100;
        if (clamped === state.scale) return;
        const world = screenToWorld(sx, sy);
        state.scale = clamped;
        state.offsetX = sx - world.x * state.scale;
        state.offsetY = sy - world.y * state.scale;
        clampOffset();
        persist();
        draw();
        updateControls();
        // No re-bake needed on zoom — fills are baked at maxScale, always crisp when downscaled.
        clearTimeout(zoomSettleTimer);
        zoomSettleTimer = null;
      }

      function zoomBy(factor) {
        if (is3D) {
          if (state.zoomLocked) return;
          const newScale = Math.max(minScale, Math.min(maxScale, t3Scale * factor));
          if (newScale === t3Scale) return;
          const cx = threedCanvas.offsetWidth / 2, cy = threedCanvas.offsetHeight / 2;
          const wx = (cx - t3OffX) / t3Scale, wy = (cy - t3OffY) / t3Scale;
          t3Scale = newScale; t3OffX = cx - wx * t3Scale; t3OffY = cy - wy * t3Scale;
          drawThreed(); updateControls();
          return;
        }
        zoomAt(state.scale * factor, canvasRect.width / 2, canvasRect.height / 2);
      }

      function commitZoomInput() {
        const raw = zoomReadout.value.replace(/[^\d]/g, "");
        const parsed = parseInt(raw, 10);
        if (is3D) {
          if (state.zoomLocked) return;
          const clamped = Math.max(8, Math.min(400, Number.isFinite(parsed) && parsed > 0 ? parsed : Math.round(t3Scale * 100)));
          const newScale = clamped / 100;
          if (newScale === t3Scale) { updateControls(); return; }
          const cx = threedCanvas.offsetWidth / 2, cy = threedCanvas.offsetHeight / 2;
          const wx = (cx - t3OffX) / t3Scale, wy = (cy - t3OffY) / t3Scale;
          t3Scale = newScale; t3OffX = cx - wx * t3Scale; t3OffY = cy - wy * t3Scale;
          drawThreed(); updateControls();
          return;
        }
        const clamped = Math.max(8, Math.min(400, Number.isFinite(parsed) && parsed > 0 ? parsed : Math.round(state.scale * 100)));
        zoomAt(clamped / 100, canvasRect.width / 2, canvasRect.height / 2);
        updateControls();
      }

      function cleanZoomInput() {}

        const rect = canvas.getBoundingClientRect();
        if (resetScale) state.scale = 1;
        state.offsetX = rect.width / 2;
        state.offsetY = rect.height / 2;

        refreshCssCache();

      // ── Round Line Tool ───────────────────────────────────────────────────
      // State: roundLineMode (bool), roundLinePts (array of {x,y} world points)
      // Flow: click button → active; click dots along existing line(s) → preview;
      //       click button again → apply rounding; Escape cancels.

      function toggleRoundLineMode() {
        if (state.roundLineMode) {
          applyRoundLine();
        } else {
          state.prevTool = state.paintMode ? "bucket" : (state.eraserMode ? "eraser" : "pencil");
          state.roundLineMode = true;
          state.roundLinePts = [];
          state.paintMode = false;
          state.eraserMode = false;
          state.selected = null;
          updateControls();
          draw();
        }
      }

      function cancelRoundLineMode() {
        state.roundLineMode = false;
        state.roundLinePts = [];
        updateControls();
        draw();
      }

      // Replace selected connected segments with smooth bezier curves.
      // Each interior corner at pts[i] is rounded by splitting the two adjacent
      // segments at their midpoints and inserting a quadratic bezier from
      // mid(pts[i-1],pts[i]) to mid(pts[i],pts[i+1]) with CP=pts[i].
      // This keeps all geometry exactly on the original dot positions.
      function applyRoundLine() {
        state.roundLineMode = false;
        const pts = state.roundLinePts;
        state.roundLinePts = [];
        if (pts.length < 3) { updateControls(); draw(); return; }

        // Find the lines that connect each consecutive pair of pts
        const affectedIndices = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const idx = state.lines.findIndex(l =>
            (samePoint(l.from, a) && samePoint(l.to, b)) ||
            (samePoint(l.from, b) && samePoint(l.to, a))
          );
          if (idx === -1) { updateControls(); draw(); return; } // path broken — abort
          affectedIndices.push(idx);
        }

        const newSegs = [];
        const n = pts.length;

        const orig = i => state.lines[affectedIndices[i]];

        const straight = (ax, ay, bx, by, srcSeg) => {
          if (Math.hypot(bx - ax, by - ay) < 0.001) return;
          newSegs.push({ from: { x: ax, y: ay }, to: { x: bx, y: by },
            thickness: segmentThickness(srcSeg), colorMode: srcSeg.colorMode });
        };

        const curved = (ax, ay, cpx, cpy, bx, by, srcSeg) => {
          newSegs.push({ from: { x: ax, y: ay }, to: { x: bx, y: by },
            cp: { x: cpx, y: cpy },
            thickness: segmentThickness(srcSeg), colorMode: srcSeg.colorMode });
        };

        // Detect closed shape: user clicked back to the start point
        const isClosed = samePoint(pts[0], pts[n - 1]);

        if (isClosed) {
          // Closed loop — every corner gets a smooth curve, no straight stubs.
          // Treat pts[0] (== pts[n-1]) as a regular interior corner using the
          // wrap-around neighbours pts[n-2] and pts[1].
          const loopPts = pts.slice(0, n - 1); // drop the duplicate closing point
          const ln = loopPts.length;
          for (let i = 0; i < ln; i++) {
            const prev   = loopPts[(i - 1 + ln) % ln];
            const corner = loopPts[i];
            const next   = loopPts[(i + 1) % ln];
            const m1x = (prev.x + corner.x) / 2, m1y = (prev.y + corner.y) / 2;
            const m2x = (corner.x + next.x) / 2, m2y = (corner.y + next.y) / 2;
            // affectedIndices covers pts[0..n-2] pairs; wrap last segment index
            const srcIdx = i === 0 ? affectedIndices[ln - 1] : affectedIndices[i - 1];
            curved(m1x, m1y, corner.x, corner.y, m2x, m2y, state.lines[srcIdx]);
          }
        } else {
          // Open path — first and last points stay sharp (straight stubs),
          // interior corners get curves.

          // First straight stub: p0 → mid(p0, p1)
          {
            const p0 = pts[0], p1 = pts[1];
            const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
            straight(p0.x, p0.y, mx, my, orig(0));
          }

          // Interior corners
          for (let i = 1; i < n - 1; i++) {
            const prev = pts[i - 1], corner = pts[i], next = pts[i + 1];
            const m1x = (prev.x + corner.x) / 2, m1y = (prev.y + corner.y) / 2;
            const m2x = (corner.x + next.x) / 2, m2y = (corner.y + next.y) / 2;
            curved(m1x, m1y, corner.x, corner.y, m2x, m2y, orig(i - 1));
          }

          // Last straight stub: mid(p[N-2], p[N-1]) → p[N-1]
          {
            const pLast = pts[n - 1], pPrev = pts[n - 2];
            const mx = (pPrev.x + pLast.x) / 2, my = (pPrev.y + pLast.y) / 2;
            straight(mx, my, pLast.x, pLast.y, orig(n - 2));
          }
        }

        if (!newSegs.length) { updateControls(); draw(); return; }

        const prevLines = state.lines.slice();
        const prevFills = state.fills.map(cloneFill);

        const sortedUnique = [...new Set(affectedIndices)].sort((a, b) => b - a);
        for (const idx of sortedUnique) {
          state.lines.splice(idx, 1);
        }
        for (const seg of newSegs) {
          state.lines.push(seg);
        }

        pushUndo({ type: "roundLine", prevLines, prevFills, newLines: state.lines.slice() });
        invalidateFillCache();
        persist(true);
        updateControls();

        // Flash closed-shape highlight if the rounded segments form a closed loop.
        // For a closed round-line, isClosed==true and all newSegs connect end-to-end
        // forming a loop — detect by checking if any seg's endpoint is reachable from
        // another seg's startpoint through the full newSegs set.
        if (isClosed && newSegs.length >= 2) {
          state.closeHighlight = {
            lines: newSegs.slice(),
            until: performance.now() + 1150,
            duration: 1150
          };
          window.setTimeout(() => {
            if (state.closeHighlight && performance.now() >= state.closeHighlight.until) {
              state.closeHighlight = null;
              draw();
            }
          }, 1180);
        } else if (!isClosed && newSegs.length >= 2) {
          // Open round-line path: check if the endpoints of the full path already
          // close back to the start via existing lines (partial curve in a closed shape).
          const pathStart = newSegs[0].from;
          const pathEnd   = newSegs[newSegs.length - 1].to;
          const existingPath = findPathBetweenPoints(pathEnd, pathStart, state.lines);
          if (existingPath && existingPath.length) {
            state.closeHighlight = {
              lines: [...newSegs, ...existingPath],
              until: performance.now() + 1150,
              duration: 1150
            };
            window.setTimeout(() => {
              if (state.closeHighlight && performance.now() >= state.closeHighlight.until) {
                state.closeHighlight = null;
                draw();
              }
            }, 1180);
          }
        }

        draw();
      }

      // Draw the round-line selection overlay (highlight selected pts and path preview)
      function drawRoundLineOverlay() {
        if (!state.roundLineMode) return;
        const pts = state.roundLinePts;
        if (!pts.length) return;
        ctx.save();
        ctx.strokeStyle = cobalt;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const p = worldToScreen(pts[i].x, pts[i].y);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        // Draw selected point circles
        for (const pt of pts) {
          const p = worldToScreen(pt.x, pt.y);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = cobalt;
          ctx.fill();
        }
        ctx.restore();
      }

        });

        // Custom tool cursors
        if (state.eraserMode) {
          const ink = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const paper = state.theme === "dark" ? "%23000000" : "%23ffffff";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M9.5 11.1 13 7.3a2.2 2.2 0 0 1 3.1 0l3.2 3.2a2.2 2.2 0 0 1 0 3.1l-3.8 3.5-6-6Z' fill='${ink}' stroke='${ink}' stroke-width='0.3'/><path d='M4.2 16.1 9.5 11.1l6 6-2.1 2.4H8L4.2 16.1Z' fill='${paper}' stroke='${ink}' stroke-width='1.85'/><path d='M8.2 19.5H21' stroke='${ink}' stroke-width='1.85' stroke-linecap='round'/></svg>`;

          // Encode the color for use in SVG URL — convert to a hex-safe format
          const tmpEl = document.createElement("canvas");

          const paintHex = `%23${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`;
          const ink = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M5 8h14l-2 11a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 19L5 8Z' fill='${paintHex}' stroke='${ink}' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/><path d='M7 8a5 5 0 0 1 10 0' fill='none' stroke='${ink}' stroke-width='1.7' stroke-linecap='round'/><line x1='3' y1='8' x2='21' y2='8' stroke='${ink}' stroke-width='1.7' stroke-linecap='round'/></svg>`;
          stage.style.cursor = `url("data:image/svg+xml,${cur}") 12 4, crosshair`;
        } else if (state.accentMode) {
          // Pencil cursor: eraser nub = white, body = blue
          const ink = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const nub = state.theme === "dark" ? "%23000000" : "%23ffffff";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='${ink}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M17 3a2.85 2.85 0 0 1 4 4l-3 3-4-4Z' fill='${nub}'/><path d='M18 10 7.5 20.5 2 22l1.5-5.5L14 6Z' fill='%231F51FF'/><line x1='14' y1='6' x2='18' y2='10'/></svg>`;
          stage.style.cursor = `url("data:image/svg+xml,${cur}") 2 22, crosshair`;
        } else {
          // Pencil cursor: eraser nub = white, body = ink
          const ink = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const nub = state.theme === "dark" ? "%23000000" : "%23ffffff";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='${ink}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M17 3a2.85 2.85 0 0 1 4 4l-3 3-4-4Z' fill='${nub}'/><path d='M18 10 7.5 20.5 2 22l1.5-5.5L14 6Z' fill='${ink}'/><line x1='14' y1='6' x2='18' y2='10'/></svg>`;

        // 3D mode: hide irrelevant buttons

        bucketButton.closest(".tool-wrap").style.display = hide3D ? "none" : "";
        roundLineButton.style.display = hide3D ? "none" : "";
        saveJsonButton.style.display = hide3D ? "none" : "";
        saveSvgButton.style.display = hide3D ? "none" : "";
        savePngButton.style.display = hide3D ? "none" : "";
        save3dButton.style.display = hide3D ? "" : "none";

      function segmentThickness(segment) {

      function isStraightPreview(from, to) {
        if (!from || !to || samePoint(from, to)) return false;
        const dx = Math.abs(to.x - from.x);
        const dy = Math.abs(to.y - from.y);
        return dx === 0 || dy === 0 || Math.abs(dx - dy) < 0.0001;
      }

      function shadeColor(shade, alpha = 1) {
        const safeShade = Math.max(1, Math.min(20, Math.round(shade || 1)));
        const value = Math.round(248 - ((safeShade - 1) / 19) * 218);
        return `rgba(${value}, ${value}, ${value}, ${alpha})`;
      }

      function blueShadeColor(shade, alpha = 1) {
        const palette = [
          [166, 187, 255],
          [88, 125, 255],
          [31, 81, 255],
          [17, 56, 215],
          [8, 31, 132]
        ];
        const safeShade = Math.max(1, Math.min(5, Math.round(shade || 3)));
        const color = palette[safeShade - 1];
        return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
      }

      function paintColor(kind, shade, alpha = 1) {
        return kind === "blue" ? blueShadeColor(shade, alpha) : shadeColor(shade, alpha);
      }

      function renderShadePalette() {
