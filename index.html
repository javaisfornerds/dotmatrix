          } else if (stype === "spiral") {
            const turns = ri(2, 5);
            const sr = ri(2, 6) * grid;
            const er = ri(canvasSpan / 2, canvasSpan) * grid;
            const spt = ri(8, 20);
            newLines.push(...genSpiral(off.x, off.y, turns, sr, er, spt));
            // Double spiral
            if (rand() > 0.5)
              newLines.push(...genSpiral(off.x, off.y, turns, er, sr, spt));
          } else if (stype === "radial") {
            const spokes = ri(5, 20);
            const inner = rand() > 0.5 ? ri(1, 4) * grid : 0;
            const outer = ri(5, canvasSpan) * grid;
            newLines.push(...genRadial(off.x, off.y, spokes, inner, outer, rand() > 0.5));
          } else if (stype === "hexgrid") {
            const rings = ri(1, 4);
            newLines.push(...genHexGrid(off.x, off.y, rings));
          } else if (stype === "circuit") {
            const pts = makeGrid(off.x, off.y, ri(3, 8), ri(3, 8));
            newLines.push(...genCircuit(pts));
          } else if (stype === "web") {
            const nodes = shuffle(makeGrid(off.x, off.y, ri(3, 7), ri(3, 7))).slice(0, ri(6, 18));
            newLines.push(...genWeb(nodes, ri(12, 40)));
          } else if (stype === "tree") {
            const depth = ri(4, 7);
            const len = ri(4, 9) * grid;
            const angle = rf(-Math.PI * 0.6, -Math.PI * 0.4);
            newLines.push(...genFractalTree(off.x, off.y + canvasSpan * grid * 0.5, angle, len, depth, 0.65));
          } else if (stype === "lissajous") {
            const a = ri(1, 6), b = ri(1, 6);
            const delta = rf(0, Math.PI);
            const scale = ri(4, canvasSpan) * grid;
            newLines.push(...genLissajous(off.x, off.y, a, b, delta, ri(40, 120), scale));
          } else if (stype === "cross") {
            const arms = ri(3, 8);
            const armLen = ri(4, canvasSpan) * grid;
            const armW = ri(1, 4) * grid;
            newLines.push(...genCross(off.x, off.y, arms, armLen, armW));
          } else if (stype === "grid") {
            const cols = ri(3, 10), rows = ri(3, 10);
            const sx = ri(1, 4) * grid, sy = ri(1, 4) * grid;
            newLines.push(...genGrid(off.x - cols * sx / 2, off.y - rows * sy / 2, cols, rows, sx, sy));
          } else if (stype === "ring") {
            // Multiple concentric rings with connecting spokes
            const rings = ri(3, 8);
            const maxR = ri(5, canvasSpan) * grid;
            for (let r = 1; r <= rings; r++) {
              const radius = (r / rings) * maxR;
              const sides = ri(6, 18);
              const { lines } = genPolygon(off.x, off.y, sides, radius, rf(0, Math.PI), null);
              newLines.push(...lines);
            }
            const spokes = ri(4, 16);
            for (let s = 0; s < spokes; s++) {
              const a = (s / spokes) * Math.PI * 2;
              newLines.push(makeLine(pt(off.x, off.y), pt(off.x + Math.cos(a) * maxR, off.y + Math.sin(a) * maxR)));
            }
          }
        }

        // ── Random accent overlay: a scattered web connecting everything ──
        if (rand() > 0.3) {
          const allPts = newLines.flatMap(l => [l.from, l.to]);
          const sample = shuffle(allPts.slice()).slice(0, ri(8, 24));
          const extra = ri(6, 20);
          for (let i = 0; i < extra && sample.length >= 2; i++) {
            const a = sample[ri(0, sample.length - 1)];
            const b = sample[ri(0, sample.length - 1)];
            newLines.push({ from: a, to: b, thickness: ri(1, 3), colorMode: "accent" });
          }
        }

        // ── Dots scattered on key vertices ───────────────────────────────
        const allVerts = shuffle(newLines.flatMap(l => [l.from, l.to]).slice()).slice(0, ri(6, 28));
        const dc = dotColors();
        for (const v of allVerts) newDots.push({ x: v.x, y: v.y, color: rp(dc) });

        // ── Commit state ─────────────────────────────────────────────────
        state.lines = dedup(newLines);
        state.dots  = newDots;
        state.fills = [];
        state.redo = []; state.undoStack = []; state.redoStack = [];
        state.selected = state.hover = state.dragFrom = state.dragStart = null;
        state.dragMoved = false; state.bendDrag = null;
        state.midpointHover = state.lineHover = null;
        invalidateFillCache();

        // ── Attempt flood fills in closed regions ─────────────────────────
        const fillCount = ri(3, 10);
        const candidates = shuffle(state.lines.slice());
        let attempts = 0;
        for (const seg of candidates) {
          if (state.fills.length >= fillCount || attempts++ > fillCount * 8) break;
          const ox = (seg.from.x + seg.to.x) / 2 + rf(-0.4, 0.4) * grid;
          const oy = (seg.from.y + seg.to.y) / 2 + rf(-0.4, 0.4) * grid;
          const kind = rp(["gray", "gray", "blue"]);
          const shade = kind === "blue" ? ri(1, 5) : ri(2, 18);
          state.fills.push({ seed: { x: ox, y: oy }, kind, shade });
        }

        // ── Scale & center view ───────────────────────────────────────────
        const xs = state.lines.flatMap(l => [l.from.x, l.to.x]);
        const ys = state.lines.flatMap(l => [l.from.y, l.to.y]);
        if (xs.length) {
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const minY = Math.min(...ys), maxY = Math.max(...ys);
          const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
          const rect = canvasRect;
          const spanX = maxX - minX || grid * 10;
          const spanY = maxY - minY || grid * 10;
          const fitScale = Math.min(maxScale, Math.max(minScale,
            Math.min((rect.width  * 0.85) / spanX,
                     (rect.height * 0.85) / spanY)));
          state.scale   = fitScale;
          state.offsetX = rect.width  / 2 - midX * fitScale;
          state.offsetY = rect.height / 2 - midY * fitScale;
        }

        persist(true);
        draw();
        updateControls();
      }

      function addColoredDot(clientX, clientY) {
        const dot = snappedDotFromClient(clientX, clientY);
        if (!dot) return;
        const color = state.accentMode ? cobalt : (state.paintMode ? paintColor(state.paintKind, state.paintKind === "blue" ? state.blueShade : state.shade, 1) : cssCache.line);
        const dotEntry = {
          x: dot.x,
          y: dot.y,
          color
        };
        state.dots.push(dotEntry);
        pushUndo({ type: "addDot", dot: dotEntry });
        persist(true);
        draw();
        updateControls();
      }

      function fillAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect(); // needed for .left/.top offset
        const sx = Math.round(clientX - rect.left);
        const sy = Math.round(clientY - rect.top);
        if (sx < 0 || sy < 0 || sx >= canvasRect.width || sy >= canvasRect.height || !state.lines.length) return false;
        const world = screenToWorld(sx, sy);
        const bounds = drawingBounds([world]);
        const geometry = layerGeometry(bounds, 1400000, 2);
        const toPixel = point => toLayerPoint(bounds, geometry.scale, point);
        const boundary = drawBoundaryMap(state.lines, geometry.width, geometry.height, toPixel, geometry.scale);
        const region = floodRegion(toPixel(world), boundary, geometry.width, geometry.height);
        if (!region) return false;
        let pixels = 0;
        for (let index = 0; index < region.length; index += 1) {
          if (region[index]) pixels += 1;
          if (pixels >= 3) break;
        }
        if (pixels < 3) return false;
        const fill = {
          seed: { x: world.x, y: world.y },
          kind: state.paintKind,
          shade: state.paintKind === "blue" ? state.blueShade : state.shade
        };
        freezeFillRegion(fill);
        state.fills.push(fill);
        pushUndo({ type: "addFill", fill });
        invalidateFillCache();
        persist(true);
        draw();
        updateControls();
        return true;
      }

      function renderFills(width, height) {
        if (!state.fills.length) return;

        // Only freeze missing fills when not in the middle of a rapid zoom.
        // During zoom, just draw whatever cached canvas is available.
        if (!zoomSettleTimer) {
          for (const fill of state.fills) {
            if (!fill._regionCanvas && state.lines.length) {
              freezeFillRegion(fill);
            }
          }
        }

        ctx.save();
        // Always downscaling from a maxScale-baked canvas — no smoothing needed, stays crisp.
        ctx.imageSmoothingEnabled = false;

        for (const fill of state.fills) {
          if (!fill._regionCanvas) continue;
          const rb = fill._regionBounds;
          const rs = fill._regionScale;
          const drawScale = state.scale / rs;
          const dx = rb.minX * state.scale + state.offsetX;
          const dy = rb.minY * state.scale + state.offsetY;
          ctx.setTransform(drawScale, 0, 0, drawScale, dx, dy);
          ctx.drawImage(fill._regionCanvas, 0, 0);
        }

        ctx.restore();
      }

      function drawDots(width, height, ink, soft) {
        const step = activeGridStep();
        const spacing = step * state.scale;
        if (spacing < 3) return;

        const worldTopLeft = screenToWorld(0, 0);
        const worldBottomRight = screenToWorld(width, height);
        const startX = Math.floor(worldTopLeft.x / step) * step;
        const endX = Math.ceil(worldBottomRight.x / step) * step;
        const startY = Math.floor(worldTopLeft.y / step) * step;
        const endY = Math.ceil(worldBottomRight.y / step) * step;
        const dotRadius = Math.max(0.7, Math.min(2.5, state.scale * 1.4));
        const majorEvery = 5;

        if (state.gridLines) {
          // Batch all vertical lines into a single path call
          ctx.save();
          ctx.strokeStyle = soft;
          ctx.globalAlpha = 0.32;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = startX; x <= endX; x += step) {
            const screen = worldToScreen(x, 0);
            ctx.moveTo(screen.x, 0);
            ctx.lineTo(screen.x, height);
          }
          for (let y = startY; y <= endY; y += step) {
            const screen = worldToScreen(0, y);
            ctx.moveTo(0, screen.y);
            ctx.lineTo(width, screen.y);
          }
          ctx.stroke();
          ctx.restore();
        }

        // At 100% zoom and above: use the normal soft color unchanged.
        // Below 100%: linearly darken the dot color toward a more visible shade.
        const t = Math.min(1, Math.max(0, (state.scale - minScale) / (1 - minScale)));
        const dotAlpha = 0.14 + (1 - t) * 0.31;
        const dotColor = state.theme === "dark"
          ? `rgba(246,246,246,${dotAlpha})`
          : `rgba(5,5,5,${dotAlpha})`;

        ctx.fillStyle = dotColor;

        // Batch dots by alpha bucket (major / base / sub) to minimize globalAlpha switches
        const rMajor = (major, base) => major ? dotRadius * 1.28 : base ? dotRadius * 1.08 : dotRadius * 0.76;

        // Collect points by category
        const majorPts = [], basePts = [], subPts = [];
        for (let x = startX; x <= endX; x += step) {
          for (let y = startY; y <= endY; y += step) {
            const screen = worldToScreen(x, y);
            const base = isBaseGridPoint(x) && isBaseGridPoint(y);
            const major = base && (Math.round(x / grid) % majorEvery === 0) && (Math.round(y / grid) % majorEvery === 0);
            if (major) majorPts.push(screen.x, screen.y);
            else if (base) basePts.push(screen.x, screen.y);
            else subPts.push(screen.x, screen.y);
          }
        }

        // Draw each batch as a single path
        const drawBatch = (pts, alpha, r) => {
          if (!pts.length) return;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          for (let i = 0; i < pts.length; i += 2) {
            ctx.moveTo(pts[i] + r, pts[i + 1]);
            ctx.arc(pts[i], pts[i + 1], r, 0, Math.PI * 2);
          }
          ctx.fill();
        };

        drawBatch(subPts,   0.62, dotRadius * 0.76);
        drawBatch(basePts,  0.86, dotRadius * 1.08);
        drawBatch(majorPts, 1,    dotRadius * 1.28);

        ctx.globalAlpha = 1;
        ctx.fillStyle = ink;
      }

      function drawPoint(point, radius, stroke, fill) {
        const p = worldToScreen(point.x, point.y);
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }

      function drawPulsingPoint(point, radius, stroke, fill, amount = 1.2) {
        const pulse = (Math.sin(performance.now() / 260) + 1) / 2;
        drawPoint(point, radius + pulse * amount, stroke, fill);
      }

      function requestAnimationDraw() {
        if (animationFrame) return;
        animationFrame = requestAnimationFrame(() => {
          animationFrame = null;
          draw();
        });
      }

      function drawRulers() {
        const topRect = { width: rulerCache.topW, height: rulerCache.topH };
        const leftRect = { width: rulerCache.leftW, height: rulerCache.leftH };
        const paper = cssCache.button;
        const ink = cssCache.ink;
        const muted = cssCache.muted;
        const border = cssCache.border;
        const step = rulerStep();
        const unitStep = step / grid;
        const minorStep = step / 4;

        topRulerCtx.clearRect(0, 0, topRect.width, topRect.height);
        topRulerCtx.fillStyle = paper;
        topRulerCtx.fillRect(0, 0, topRect.width, topRect.height);
        topRulerCtx.strokeStyle = border;
        topRulerCtx.fillStyle = muted;
        topRulerCtx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
        topRulerCtx.textBaseline = "top";
        const topStart = Math.floor(screenToWorld(0, 0).x / minorStep) * minorStep;
        const topEnd = Math.ceil(screenToWorld(topRect.width, 0).x / minorStep) * minorStep;
        {
          const majorPtsT = [], halfPtsT = [], minorPtsT = [];
          for (let x = topStart; x <= topEnd; x += minorStep) {
            const sx = worldToScreen(x, 0).x;
            const major = Math.abs(x / step - Math.round(x / step)) < 0.0001;
            const half = !major && Math.abs(x / (step/2) - Math.round(x / (step/2))) < 0.0001;
            if (major) majorPtsT.push(sx, x);
            else if (half) halfPtsT.push(sx);
            else minorPtsT.push(sx);
          }
          topRulerCtx.beginPath();
          for (let i = 0; i < minorPtsT.length; i++) { topRulerCtx.moveTo(minorPtsT[i], topRect.height); topRulerCtx.lineTo(minorPtsT[i], 19); }
          topRulerCtx.stroke();
          topRulerCtx.beginPath();
          for (let i = 0; i < halfPtsT.length; i++) { topRulerCtx.moveTo(halfPtsT[i], topRect.height); topRulerCtx.lineTo(halfPtsT[i], 14); }
          topRulerCtx.stroke();
          topRulerCtx.beginPath();
          for (let i = 0; i < majorPtsT.length; i+=2) { topRulerCtx.moveTo(majorPtsT[i], topRect.height); topRulerCtx.lineTo(majorPtsT[i], 6); }
          topRulerCtx.stroke();
          if (unitStep >= 0.05) {
            for (let i = 0; i < majorPtsT.length; i+=2) topRulerCtx.fillText(formatUnits(majorPtsT[i+1]), majorPtsT[i] + 3, 4);
          }
        }

        leftRulerCtx.clearRect(0, 0, leftRect.width, leftRect.height);
        leftRulerCtx.fillStyle = paper;
        leftRulerCtx.fillRect(0, 0, leftRect.width, leftRect.height);
        leftRulerCtx.strokeStyle = border;
        leftRulerCtx.fillStyle = muted;
        leftRulerCtx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
        leftRulerCtx.textBaseline = "middle";
        const leftStart = Math.floor(screenToWorld(0, 0).y / minorStep) * minorStep;
        const leftEnd = Math.ceil(screenToWorld(0, leftRect.height).y / minorStep) * minorStep;
        {
          const majorPtsL = [], halfPtsL = [], minorPtsL = [];
          for (let y = leftStart; y <= leftEnd; y += minorStep) {
            const sy = worldToScreen(0, y).y;
            const major = Math.abs(y / step - Math.round(y / step)) < 0.0001;
            const half = !major && Math.abs(y / (step/2) - Math.round(y / (step/2))) < 0.0001;
            if (major) majorPtsL.push(sy, y);
            else if (half) halfPtsL.push(sy);
            else minorPtsL.push(sy);
          }
          leftRulerCtx.beginPath();
          for (let i = 0; i < minorPtsL.length; i++) { leftRulerCtx.moveTo(leftRect.width, minorPtsL[i]); leftRulerCtx.lineTo(24, minorPtsL[i]); }
          leftRulerCtx.stroke();
          leftRulerCtx.beginPath();
          for (let i = 0; i < halfPtsL.length; i++) { leftRulerCtx.moveTo(leftRect.width, halfPtsL[i]); leftRulerCtx.lineTo(18, halfPtsL[i]); }
          leftRulerCtx.stroke();
          leftRulerCtx.beginPath();
          for (let i = 0; i < majorPtsL.length; i+=2) { leftRulerCtx.moveTo(leftRect.width, majorPtsL[i]); leftRulerCtx.lineTo(8, majorPtsL[i]); }
          leftRulerCtx.stroke();
          if (unitStep >= 0.05) {
            for (let i = 0; i < majorPtsL.length; i+=2) {
              leftRulerCtx.save();
              leftRulerCtx.translate(10, majorPtsL[i] - 3);
              leftRulerCtx.rotate(-Math.PI / 2);
              leftRulerCtx.fillText(formatUnits(majorPtsL[i+1]), 0, 0);
              leftRulerCtx.restore();
            }
          }
        }

        topRulerCtx.strokeStyle = ink;
        topRulerCtx.beginPath();
        topRulerCtx.moveTo(state.offsetX, topRect.height);
        topRulerCtx.lineTo(state.offsetX, 0);
        topRulerCtx.stroke();
        leftRulerCtx.strokeStyle = ink;
        leftRulerCtx.beginPath();
        leftRulerCtx.moveTo(leftRect.width, state.offsetY);
        leftRulerCtx.lineTo(0, state.offsetY);
        leftRulerCtx.stroke();
      }

      function updateMeasure() {
        const rect = canvas.getBoundingClientRect();
        if (state.dragMoved && state.dragFrom && state.hover) {
          const hover = worldToScreen(state.hover.x, state.hover.y);
          measure.textContent = formatUnits(dragLength());
          measure.style.left = `${Math.min(rect.width - 56, Math.max(0, hover.x))}px`;
          measure.style.top = `${Math.min(rect.height - 22, Math.max(0, hover.y))}px`;
          measure.classList.add("is-visible");
          return;
        }
        if (state.lineHover) {
          const line = state.lineHover.line;
          measure.textContent = formatUnits(Math.hypot(line.to.x - line.from.x, line.to.y - line.from.y));
          measure.style.left = `${Math.min(rect.width - 56, Math.max(0, state.lineHover.x))}px`;
          measure.style.top = `${Math.min(rect.height - 22, Math.max(0, state.lineHover.y))}px`;
          measure.classList.add("is-visible");
          return;
        }
        measure.classList.remove("is-visible");
      }

      function updateCoords() {
        if (!state.pointerWorld) {
          coords.textContent = "x 0, y 0";
          return;
        }
        coords.textContent = `x ${formatUnits(state.pointerWorld.x)}, y ${formatUnits(state.pointerWorld.y)}`;
      }

      function draw() {
        const width = canvasRect.width;
        const height = canvasRect.height;
        const paper = cssCache.paper;
        const ink = cssCache.ink;
        const line = cssCache.line;
        const soft = cssCache.soft;
        const selected = cssCache.selected;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = paper;
        ctx.fillRect(0, 0, width, height);

        renderFills(width, height);
        drawDots(width, height, ink, soft);

        // Render colored dots (right-click standalone dots)
        for (const dot of state.dots) {
          const p = worldToScreen(dot.x, dot.y);
          const radius = Math.max(3, Math.min(9, state.scale * 5));
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = dot.color;
          ctx.fill();
        }

        ctx.lineCap = "round";
        // Batch lines by color+thickness to minimize ctx state switches and path flushes
        const lineBatches = new Map();
        for (let index = 0; index < state.lines.length; index++) {
          if (state.bendDrag && index === state.bendDrag.index) continue;
          const segment = state.lines[index];
          const color = lineColor(segment);
          const lw = screenLineWidth(segment);
          const key = color + "|" + lw;
          if (!lineBatches.has(key)) lineBatches.set(key, { color, lw, segs: [] });
          lineBatches.get(key).segs.push(segment);
        }
        for (const { color, lw, segs } of lineBatches.values()) {
          ctx.strokeStyle = color;
          ctx.lineWidth = lw;
          ctx.beginPath();
          for (const seg of segs) {
            const from = worldToScreen(seg.from.x, seg.from.y);
            const to = worldToScreen(seg.to.x, seg.to.y);
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
          }
          ctx.stroke();
        }

        if (state.closeHighlight) {
          if (performance.now() >= state.closeHighlight.until) {
            state.closeHighlight = null;
          } else {
            const remaining = Math.max(0, state.closeHighlight.until - performance.now()) / state.closeHighlight.duration;
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 110);
            const alpha = (0.13 + pulse * 0.07) * Math.min(1, remaining * 1.8);
            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = state.accentMode ? cobalt : selected;
            ctx.globalAlpha = alpha;
            for (const segment of state.closeHighlight.lines) {
              const from = worldToScreen(segment.from.x, segment.from.y);
              const to = worldToScreen(segment.to.x, segment.to.y);
              ctx.lineWidth = Math.max(screenLineWidth(segment), state.thickness * state.scale) + 8;
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              ctx.lineTo(to.x, to.y);
              ctx.stroke();
            }
            ctx.globalAlpha = 0.48 + pulse * 0.2;
            for (const segment of state.closeHighlight.lines) {
              const from = worldToScreen(segment.from.x, segment.from.y);
              const to = worldToScreen(segment.to.x, segment.to.y);
              ctx.lineWidth = Math.max(1.5, screenLineWidth(segment) + 2);
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              ctx.lineTo(to.x, to.y);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        const previewFromPoint = state.dragFrom || state.selected;
        if (previewFromPoint && state.hover && !samePoint(previewFromPoint, state.hover)) {
          const from = worldToScreen(previewFromPoint.x, previewFromPoint.y);
          const to = worldToScreen(state.hover.x, state.hover.y);
          const straight = isStraightPreview(previewFromPoint, state.hover);
          ctx.save();
          ctx.strokeStyle = state.accentMode ? cobalt : line;
          if (straight) {
            ctx.globalAlpha = 0.28;
            ctx.lineWidth = Math.max(0.7, Math.min(18, state.thickness * state.scale)) + 7;
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();
          }
          ctx.globalAlpha = straight ? 0.86 : 0.55;
          ctx.lineWidth = Math.max(0.7, Math.min(18, state.thickness * state.scale)) + (straight ? 1.5 : 0);
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
          ctx.restore();
        }

        if (state.bendDrag && state.hover) {
          const bend = worldToScreen(state.hover.x, state.hover.y);
          const from = worldToScreen(state.bendDrag.line.from.x, state.bendDrag.line.from.y);
          const to = worldToScreen(state.bendDrag.line.to.x, state.bendDrag.line.to.y);
          ctx.save();
          ctx.globalAlpha = 0.72;
          ctx.strokeStyle = lineColor(state.bendDrag.line);
          ctx.lineWidth = screenLineWidth(state.bendDrag.line);
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(bend.x, bend.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
          ctx.restore();
        }

        if (state.selected && !state.paintMode && !state.eraserMode) {
          drawPoint(state.selected, 6, selected, paper);
        }

        if (state.midpointHover && !state.bendDrag && !state.paintMode && !state.eraserMode) {
          drawPoint(state.midpointHover.point, 6.2, selected, paper);
        }

        if (state.bendDrag && state.hover && !state.paintMode && !state.eraserMode) {
          drawPoint(state.hover, 5, selected, selected);
        }

        if (state.hover && !state.paintMode && !state.eraserMode) {
          const hoverColor = state.accentMode ? cobalt : selected;
          drawPoint(state.hover, state.selected && samePoint(state.selected, state.hover) ? 5 : 4, hoverColor, hoverColor);
        }

        drawRulers();
        updateMeasure();
        updateCoords();
        // Only drive the animation loop for things that actually animate over time (close highlight pulse).
        // Hover dots are now static — no need to redraw every frame just because the cursor is near a dot.
        if (state.closeHighlight) requestAnimationDraw();
      }

      function boardBounds() {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const s of state.lines) {
          if (s.from.x < minX) minX = s.from.x; if (s.from.y < minY) minY = s.from.y;
          if (s.from.x > maxX) maxX = s.from.x; if (s.from.y > maxY) maxY = s.from.y;
          if (s.to.x < minX) minX = s.to.x; if (s.to.y < minY) minY = s.to.y;
          if (s.to.x > maxX) maxX = s.to.x; if (s.to.y > maxY) maxY = s.to.y;
        }
        for (const f of state.fills) {
          if (f.seed.x < minX) minX = f.seed.x; if (f.seed.y < minY) minY = f.seed.y;
          if (f.seed.x > maxX) maxX = f.seed.x; if (f.seed.y > maxY) maxY = f.seed.y;
        }
        if (!isFinite(minX)) { minX = -grid*8; minY = -grid*6; maxX = grid*8; maxY = grid*6; }
        const pad = grid * 3;
        return { minX: minX-pad, minY: minY-pad, maxX: maxX+pad, maxY: maxY+pad };
      }

      function colorParts(color) {
        // Fast RGBA extraction without regex — parse rgba(r,g,b,a) directly
        const s = color.indexOf("(") + 1;
        const e = color.indexOf(")");
        const p = color.slice(s, e).split(",");
        return [+p[0], +p[1], +p[2], Math.round((p[3] != null ? +p[3] : 1) * 255)];
      }

      function renderFloodFills(targetCtx, width, height, toCanvas, lineWidthForSegment, alpha = 0.72, options = {}) {
        if (!state.fills.length || !state.lines.length) return;
        const widthPx = Math.max(1, Math.round(width));
        const heightPx = Math.max(1, Math.round(height));
        const maskCanvas = document.createElement("canvas");
        maskCanvas.width = widthPx;
        maskCanvas.height = heightPx;
        const maskCtx = maskCanvas.getContext("2d");
        maskCtx.strokeStyle = "#000";
        maskCtx.lineCap = "round";
        maskCtx.lineJoin = "round";
        for (const segment of state.lines) {
          const from = toCanvas(segment.from);
          const to = toCanvas(segment.to);
          const lineWidth = lineWidthForSegment(segment);
          const pad = lineWidth + 2;
          if (Math.max(from.x, to.x) < -pad ||
              Math.min(from.x, to.x) > widthPx + pad ||
              Math.max(from.y, to.y) < -pad ||
              Math.min(from.y, to.y) > heightPx + pad) {
            continue;
          }
          maskCtx.lineWidth = lineWidth;
          maskCtx.beginPath();
          maskCtx.moveTo(from.x, from.y);
          maskCtx.lineTo(to.x, to.y);
          maskCtx.stroke();
        }
        const mask = maskCtx.getImageData(0, 0, widthPx, heightPx);
        const boundary = new Uint8Array(widthPx * heightPx);
        for (let id = 0; id < boundary.length; id += 1) {
          boundary[id] = mask.data[id * 4 + 3] > 0 ? 1 : 0;
        }

        const fillCanvas = document.createElement("canvas");
        fillCanvas.width = widthPx;
        fillCanvas.height = heightPx;
        const fillCtx = fillCanvas.getContext("2d");
        const out = fillCtx.createImageData(widthPx, heightPx);
        for (const fill of state.fills) {
          const seed = toCanvas(fill.seed);
          const sx = Math.round(seed.x);
          const sy = Math.round(seed.y);
          if (sx < 0 || sy < 0 || sx >= widthPx || sy >= heightPx) continue;
          if (boundary[sy * widthPx + sx]) continue;
          const totalPx = widthPx * heightPx;
          const queue2 = new Int32Array(totalPx);
          const seen = new Uint8Array(totalPx);
          const region = options.allowEdge ? null : [];
          const color = colorParts(paintColor(fill.kind, fill.shade, alpha));
          let reachedEdge = false;
          const startId2 = sy * widthPx + sx;
          queue2[0] = startId2; seen[startId2] = 1;
          let qhead = 0, qtail = 1;
          while (qhead < qtail) {
            const id = queue2[qhead++];
            const x = id % widthPx;
            const y = (id - x) / widthPx;
            if (x === 0 || y === 0 || x === widthPx - 1 || y === heightPx - 1) reachedEdge = true;
            if (region) {
              region.push(id);
            } else {
              const offset = id * 4;
              out.data[offset] = color[0];
              out.data[offset + 1] = color[1];
              out.data[offset + 2] = color[2];
              out.data[offset + 3] = color[3];
            }
            const r2=id+1; if (x<widthPx-1 && !seen[r2] && !boundary[r2]) { seen[r2]=1; queue2[qtail++]=r2; }
            const l2=id-1; if (x>0 && !seen[l2] && !boundary[l2]) { seen[l2]=1; queue2[qtail++]=l2; }
            const d2=id+widthPx; if (y<heightPx-1 && !seen[d2] && !boundary[d2]) { seen[d2]=1; queue2[qtail++]=d2; }
            const u2=id-widthPx; if (y>0 && !seen[u2] && !boundary[u2]) { seen[u2]=1; queue2[qtail++]=u2; }
          }
          if (reachedEdge && !options.allowEdge) continue;
          if (region) {
            for (const id of region) {
              const offset = id * 4;
              out.data[offset] = color[0];
              out.data[offset + 1] = color[1];
              out.data[offset + 2] = color[2];
              out.data[offset + 3] = color[3];
            }
          }
        }
        fillCtx.putImageData(out, 0, 0);
        targetCtx.drawImage(fillCanvas, 0, 0, width, height);
      }

      function renderViewPreview() {
        const rect = viewBox.getBoundingClientRect();
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        viewCanvas.width = Math.max(1, Math.round(rect.width * dpr));
        viewCanvas.height = Math.max(1, Math.round(rect.height * dpr));
        viewCanvas.style.width = `${rect.width}px`;
        viewCanvas.style.height = `${rect.height}px`;
        viewCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        viewCtx.fillStyle = cssCache.paper;
        viewCtx.fillRect(0, 0, rect.width, rect.height);

        const bounds = boardBounds();
        const worldWidth = bounds.maxX - bounds.minX;
        const worldHeight = bounds.maxY - bounds.minY;
        const scale = Math.min(rect.width / worldWidth, rect.height / worldHeight) * 0.9;
        const offsetX = (rect.width - worldWidth * scale) / 2 - bounds.minX * scale;
        const offsetY = (rect.height - worldHeight * scale) / 2 - bounds.minY * scale;
        const toPreview = point => ({
          x: point.x * scale + offsetX,
          y: point.y * scale + offsetY
        });

        renderFloodFills(
          viewCtx,
          rect.width,
          rect.height,
          toPreview,
          segment => Math.max(1, Math.min(10, segmentThickness(segment) * scale) * 0.62),
          0.58
        );
        viewCtx.lineCap = "round";
        viewCtx.lineJoin = "round";
        for (const segment of state.lines) {
          const from = toPreview(segment.from);
          const to = toPreview(segment.to);
          viewCtx.strokeStyle = lineColor(segment);
          viewCtx.lineWidth = Math.max(1, Math.min(10, segmentThickness(segment) * scale));
          viewCtx.beginPath();
          viewCtx.moveTo(from.x, from.y);
          viewCtx.lineTo(to.x, to.y);
          viewCtx.stroke();
        }
        viewCtx.strokeStyle = cssCache.border;
        viewCtx.lineWidth = 1;
      }

      function setViewOpen(open) {
        state.viewOpen = open;
        viewOverlay.classList.toggle("is-open", open);
        if (open) renderViewPreview();
        updateControls();
      }

      function toggleFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen();
        }
      }

      function persist(immediate = false) {
        // Debounced: structural changes (line add/remove) flush immediately;
        // pan/zoom/hover only flush after a 500ms idle — eliminates JSON churn on every frame.
        if (immediate) { _persistNow(); return; }
        if (_persistTimer) return;
        _persistTimer = setTimeout(_persistNow, 500);
      }

      function restore() {
        if (state.blankStart) {
          state.lines = [];
          state.fills = [];
          state.dots = [];
          state.undoStack = [];
          state.redoStack = [];
          invalidateFillCache();
          centerOrigin(true);
          return;
        }
        const saved = localStorage.getItem(storageKey);
        if (!saved) { resetView(); return; }
        try {
          const p = JSON.parse(saved);
          const isCompact = p.v === 3;

          state.theme = p.theme === "dark" ? "dark" : "light";
          const sc = isCompact ? p.scale : p.scale;
          state.scale = Number.isFinite(sc) ? Math.max(minScale, Math.min(maxScale, sc)) : 1;
          state.offsetX = Number.isFinite(isCompact ? p.ox : p.offsetX) ? (isCompact ? p.ox : p.offsetX) : 0;
          state.offsetY = Number.isFinite(isCompact ? p.oy : p.offsetY) ? (isCompact ? p.oy : p.offsetY) : 0;
          state.thickness = Number.isFinite(p.thickness) ? Math.max(minThickness, Math.min(maxThickness, p.thickness)) : 2;
          state.accentMode = isCompact ? p.accentMode === 1 : p.accentMode === true;
          state.shade = Number.isFinite(p.shade) ? Math.max(1, Math.min(20, Math.round(p.shade))) : 8;
          state.paintKind = (isCompact ? p.paintKind === 1 : p.paintKind === "blue") ? "blue" : "gray";
          state.blueShade = Number.isFinite(p.blueShade) ? Math.max(1, Math.min(5, Math.round(p.blueShade))) : 3;
          state.gridLines = isCompact ? p.gridLines === 1 : p.gridLines === true;
          state.paintMode = isCompact ? p.paintMode === 1 : p.paintMode === true;
          state.eraserMode = isCompact ? p.eraserMode === 1 : p.eraserMode === true;
          if (state.eraserMode) state.paintMode = false;

          if (isCompact) {
            state.lines = Array.isArray(p.lines) ? p.lines
              .filter(l => Array.isArray(l) && l.length >= 4 && l.every(Number.isFinite))
              .map(l => ({
                from: { x: l[0], y: l[1] },
                to:   { x: l[2], y: l[3] },
                thickness: Number.isFinite(l[4]) ? l[4] : state.thickness,
                colorMode: l[5] === 1 ? "accent" : "mono"
              })) : [];
            state.fills = Array.isArray(p.fills) ? p.fills
              .filter(f => Array.isArray(f) && f.length >= 4)
              .map(f => ({ seed: { x: f[0], y: f[1] }, kind: f[2] === 1 ? "blue" : "gray", shade: f[3] }))
              .filter(isValidFill) : [];
            state.dots = Array.isArray(p.dots) ? p.dots
              .filter(d => Array.isArray(d) && d.length >= 3 && Number.isFinite(d[0]) && Number.isFinite(d[1]))
              .map(d => ({ x: d[0], y: d[1], color: d[2] })) : [];
          } else {
            // Legacy object format
            state.lines = Array.isArray(p.lines) ? p.lines.filter(isValidLine) : [];
            state.fills = Array.isArray(p.fills) ? p.fills.filter(isValidFill) : [];
            state.dots  = Array.isArray(p.dots)  ? p.dots.filter(d => d && Number.isFinite(d.x) && Number.isFinite(d.y)) : [];
          }

          invalidateFillCache();
          centerOrigin(false);
          document.documentElement.dataset.theme = state.theme;
        } catch {
          resetView();
        }
      }

      function isValidLine(line) {
        return line &&
          line.from &&
          line.to &&
          Number.isFinite(line.from.x) &&
          Number.isFinite(line.from.y) &&
          Number.isFinite(line.to.x) &&
          Number.isFinite(line.to.y);
      }

      function isValidFill(fill) {
        return fill &&
          fill.seed &&
          Number.isFinite(fill.seed.x) &&
          Number.isFinite(fill.seed.y) &&
          Number.isFinite(fill.shade);
      }

      function escapeXml(value) {
        return value.replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&apos;"
        }[character]));
      }

      function exportSvg() {
        const step = activeGridStep();
        const bounds = boardBounds();
        const minX = Math.floor(bounds.minX);
        const minY = Math.floor(bounds.minY);
        const maxX = Math.ceil(bounds.maxX);
        const maxY = Math.ceil(bounds.maxY);
        const width = Math.max(grid * 4, maxX - minX);
        const height = Math.max(grid * 4, maxY - minY);
        const bg = state.theme === "dark" ? "#000000" : "#ffffff";
        const ink = state.theme === "dark" ? "#f6f6f6" : "#050505";
        const dot = state.theme === "dark" ? "rgba(246,246,246,0.24)" : "rgba(5,5,5,0.18)";
        const gridLine = state.theme === "dark" ? "rgba(246,246,246,0.1)" : "rgba(5,5,5,0.08)";
        let dotMarkup = "";
        let gridMarkup = "";

        for (let x = Math.floor(minX / step) * step; x <= maxX; x += step) {
          if (state.gridLines) {
            gridMarkup += `<line x1="${x}" y1="${minY}" x2="${x}" y2="${maxY}" stroke="${gridLine}" stroke-width="1"/>`;
          }
          for (let y = Math.floor(minY / step) * step; y <= maxY; y += step) {
            const radius = isBaseGridPoint(x) && isBaseGridPoint(y) ? 1.4 : 1;
            dotMarkup += `<circle cx="${x}" cy="${y}" r="${radius}" fill="${dot}"/>`;
          }
        }
        if (state.gridLines) {
          for (let y = Math.floor(minY / step) * step; y <= maxY; y += step) {
            gridMarkup += `<line x1="${minX}" y1="${y}" x2="${maxX}" y2="${y}" stroke="${gridLine}" stroke-width="1"/>`;
          }
        }

        let fillMarkup = "";
        if (state.fills.length && state.lines.length) {
          const fillCanvas = document.createElement("canvas");
          fillCanvas.width = Math.max(1, Math.round(width));
          fillCanvas.height = Math.max(1, Math.round(height));
          const fillCtx = fillCanvas.getContext("2d");
          renderFloodFills(
            fillCtx,
            width,
            height,
            point => ({ x: point.x - minX, y: point.y - minY }),
            segment => Math.max(0.5, segmentThickness(segment) * 0.62),
            0.72
          );
          fillMarkup = `<image x="${minX}" y="${minY}" width="${width}" height="${height}" href="${fillCanvas.toDataURL("image/png")}"/>`;
        }

        const lineMarkup = state.lines.map(segment =>
          `<line x1="${segment.from.x}" y1="${segment.from.y}" x2="${segment.to.x}" y2="${segment.to.y}" stroke="${segment.colorMode === "accent" ? cobalt : ink}" stroke-width="${segmentThickness(segment)}" stroke-linecap="round"/>`
        ).join("");
        const metadata = `<metadata id="matrix-data" type="application/json">${escapeXml(JSON.stringify(projectPayload()))}</metadata>`;

        return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="${minX} ${minY} ${width} ${height}">${metadata}<rect x="${minX}" y="${minY}" width="${width}" height="${height}" fill="${bg}"/>${gridMarkup}${dotMarkup}${fillMarkup}${lineMarkup}</svg>`;
      }

      function projectPayload() {
        persist(true);
        // Compact v3 format — same structure as localStorage
        return {
          app: "matrix-dot-paper",
          v: 3,
          savedAt: new Date().toISOString(),
          theme: state.theme,
          scale: state.scale,
          ox: state.offsetX,
          oy: state.offsetY,
          thickness: state.thickness,
          accentMode: state.accentMode ? 1 : 0,
          shade: state.shade,
          paintKind: state.paintKind === "blue" ? 1 : 0,
          blueShade: state.blueShade,
          gridLines: state.gridLines ? 1 : 0,
          paintMode: state.paintMode ? 1 : 0,
          eraserMode: state.eraserMode ? 1 : 0,
          lines: state.lines.map(l => [l.from.x, l.from.y, l.to.x, l.to.y, l.thickness ?? state.thickness, l.colorMode === "accent" ? 1 : 0]),
          fills: state.fills.map(f => [f.seed.x, f.seed.y, f.kind === "blue" ? 1 : 0, f.shade]),
          dots:  state.dots.map(d => [d.x, d.y, d.color])
        };
      }

      function applyProject(payload) {
        if (!payload) return;
        const isCompact = payload.v === 3;
        // Support both compact v3 and legacy object format
        const hasLines = isCompact ? Array.isArray(payload.lines) : Array.isArray(payload.lines);
        if (!hasLines) return;

        // theme intentionally not restored — stay on current theme
        const sc = payload.scale;
        state.scale = Number.isFinite(sc) ? Math.max(minScale, Math.min(maxScale, sc)) : 1;
        state.offsetX = Number.isFinite(isCompact ? payload.ox : payload.offsetX) ? (isCompact ? payload.ox : payload.offsetX) : canvas.getBoundingClientRect().width / 2;
        state.offsetY = Number.isFinite(isCompact ? payload.oy : payload.offsetY) ? (isCompact ? payload.oy : payload.offsetY) : canvas.getBoundingClientRect().height / 2;
        state.thickness = Number.isFinite(payload.thickness) ? Math.max(minThickness, Math.min(maxThickness, payload.thickness)) : 2;
        state.accentMode = isCompact ? payload.accentMode === 1 : payload.accentMode === true;
        state.shade = Number.isFinite(payload.shade) ? Math.max(1, Math.min(20, Math.round(payload.shade))) : 8;
        state.paintKind = (isCompact ? payload.paintKind === 1 : payload.paintKind === "blue") ? "blue" : "gray";
        state.blueShade = Number.isFinite(payload.blueShade) ? Math.max(1, Math.min(5, Math.round(payload.blueShade))) : 3;
        state.gridLines = isCompact ? payload.gridLines === 1 : payload.gridLines === true;
        state.paintMode = isCompact ? payload.paintMode === 1 : payload.paintMode === true;
        state.eraserMode = isCompact ? payload.eraserMode === 1 : payload.eraserMode === true;
        if (state.eraserMode) state.paintMode = false;

        if (isCompact) {
          state.lines = payload.lines
            .filter(l => Array.isArray(l) && l.length >= 4 && l.slice(0,4).every(Number.isFinite))
            .map(l => ({ from: { x: l[0], y: l[1] }, to: { x: l[2], y: l[3] }, thickness: Number.isFinite(l[4]) ? l[4] : state.thickness, colorMode: l[5] === 1 ? "accent" : "mono" }));
          state.fills = Array.isArray(payload.fills) ? payload.fills
            .filter(f => Array.isArray(f) && f.length >= 4)
            .map(f => ({ seed: { x: f[0], y: f[1] }, kind: f[2] === 1 ? "blue" : "gray", shade: f[3] }))
            .filter(isValidFill) : [];
          state.dots = Array.isArray(payload.dots) ? payload.dots
            .filter(d => Array.isArray(d) && d.length >= 3 && Number.isFinite(d[0]) && Number.isFinite(d[1]))
            .map(d => ({ x: d[0], y: d[1], color: d[2] })) : [];
        } else {
          state.lines = payload.lines.filter(isValidLine);
          state.fills = Array.isArray(payload.fills) ? payload.fills.filter(isValidFill) : [];
          state.dots  = Array.isArray(payload.dots)  ? payload.dots.filter(d => d && Number.isFinite(d.x) && Number.isFinite(d.y)) : [];
        }
        state.undoStack = [];
        state.redoStack = [];
        state.selected = null;
        state.hover = null;
        state.midpointHover = null;
        state.bendDrag = null;
        if (state.lines.length === 0 && state.fills.length === 0) {
          centerOrigin(false);
        }
        invalidateFillCache();
        persist(true);
        draw();
        updateControls();
      }

      function saveFileName(extension, name = "") {
        name = name.replace(/\.[^.]+$/, "").replace(/^dotmatrix-?/i, "");
        const cleaned = name.replace(/[^a-z0-9_-]+/gi, "-").replace(/^-+|-+$/g, "");
        return cleaned ? `dotmatrix-${cleaned}.${extension}` : `dotmatrix.${extension}`;
      }

      function downloadSvg(name = "") {
        const filename = saveFileName("svg", name);
        if (!filename) return;
        persist(true);
        const blob = new Blob([exportSvg()], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function downloadJson(name = "") {
        const filename = saveFileName("json", name);
        if (!filename) return;
        const json = JSON.stringify(projectPayload(), null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function loadProjectFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          try {
            const text = String(reader.result || "");
            if (file.name.toLowerCase().endsWith(".svg") || text.trimStart().startsWith("<svg")) {
              const documentSvg = new DOMParser().parseFromString(text, "image/svg+xml");
              const metadata = documentSvg.querySelector("#matrix-data");
              if (!metadata) throw new Error("Missing .matrix metadata");
              applyProject(JSON.parse(metadata.textContent));
            } else {
              applyProject(JSON.parse(text));
            }
          } catch {
            window.alert("Could not load this file.");
          }
        });
        reader.readAsText(file);
      }

      function handleCanvasPointerDown(event) {
        if (state.viewOpen) return;
        playSound("click");
        canvas.setPointerCapture(event.pointerId);
        state.activePointerId = event.pointerId;
        if (event.button === 2) {
          state.rightPan = {
            x: event.clientX,
            y: event.clientY,
            offsetX: state.offsetX,
            offsetY: state.offsetY,
            moved: false
          };
          return;
        }

        if (state.eraserMode) {
          state.erasing = true;
          if (!eraseDotAt(event.clientX, event.clientY) && !eraseLineAt(event.clientX, event.clientY)) {
            removeFillAt(event.clientX, event.clientY);
          }
          return;
        }

        if (state.paintMode) {
          fillAt(event.clientX, event.clientY);
          return;
        }

        const shouldPan = event.button === 1 || event.altKey || event.metaKey || event.shiftKey;
        if (shouldPan) {
          state.panning = true;
          state.panStart = {
            x: event.clientX,
            y: event.clientY,
            offsetX: state.offsetX,
            offsetY: state.offsetY
          };
          state.dragFrom = null;
          state.dragStart = null;
          state.dragMoved = false;
          stage.classList.add("is-panning");
          stage.style.cursor = "grabbing";
          return;
        }

        if (!state.selected) {
          const midpoint = nearestMidpoint(event.clientX, event.clientY);
          if (midpoint) {
            const line = state.lines[midpoint.index];
            state.bendDrag = {
              index: midpoint.index,
              line: {
                from: { x: line.from.x, y: line.from.y },
                to: { x: line.to.x, y: line.to.y },
                thickness: segmentThickness(line),
                colorMode: line.colorMode
              }
            };
            state.dragStart = { x: event.clientX, y: event.clientY };
            state.dragMoved = false;
            state.selected = null;
            state.hover = snappedDotFromClient(event.clientX, event.clientY);
            draw();
            return;
          }
        }

        const dot = nearestDot(event.clientX, event.clientY);
        if (!dot) {
          state.selected = null;
          state.hover = null;
          state.dragFrom = null;
          state.dragStart = null;
          state.dragMoved = false;
          state.midpointHover = null;
          state.lineHover = null;
          state.bendDrag = null;
          draw();
          return;
        }

        state.dragFrom = { x: dot.x, y: dot.y };
        state.dragStart = { x: event.clientX, y: event.clientY };
        state.dragMoved = false;
        state.hover = { x: dot.x, y: dot.y };
        state.lineHover = null;
        draw();
        updateControls();
      }

      function handleCanvasPointerMove(event) {
        const rect = canvas.getBoundingClientRect();
        state.pointerWorld = screenToWorld(event.clientX - rect.left, event.clientY - rect.top);
        if (state.rightPan) {
          const dx = event.clientX - state.rightPan.x;
          const dy = event.clientY - state.rightPan.y;
          if (Math.hypot(dx, dy) > 3) state.rightPan.moved = true;
          if (state.rightPan.moved) {
            playDragSound();
            state.offsetX = state.rightPan.offsetX + dx;
            state.offsetY = state.rightPan.offsetY + dy;
            clampOffset();
            stage.classList.add("is-panning");
            stage.style.cursor = "grabbing";
            draw();
          }
          return;
        }
        if (state.erasing) {
          playDragSound();
          if (!eraseDotAt(event.clientX, event.clientY) && !eraseLineAt(event.clientX, event.clientY)) {
            removeFillAt(event.clientX, event.clientY);
          }
          return;
        }
        if (state.panning && state.panStart) {
          playDragSound();
          state.offsetX = state.panStart.offsetX + event.clientX - state.panStart.x;
          state.offsetY = state.panStart.offsetY + event.clientY - state.panStart.y;
          clampOffset();
          draw();
          return;
        }

        if (state.bendDrag) {
          if (state.dragStart && Math.hypot(event.clientX - state.dragStart.x, event.clientY - state.dragStart.y) > 5) {
            state.dragMoved = true;
            playDragSound();
          }
          state.hover = snappedDotFromClient(event.clientX, event.clientY);
          state.lineHover = null;
          draw();
          return;
        }

        if (state.dragStart && Math.hypot(event.clientX - state.dragStart.x, event.clientY - state.dragStart.y) > 5) {
          state.dragMoved = true;
          playDragSound();
        }

        const dot = nearestDot(event.clientX, event.clientY);
        const newHover = dot ? { x: dot.x, y: dot.y } : null;
        const newMidHover = !state.paintMode && !state.dragFrom ? nearestMidpoint(event.clientX, event.clientY) : null;
        const newLineHover = !state.paintMode && !state.dragFrom && !newMidHover ? nearestLine(event.clientX, event.clientY) : null;

        // Only redraw if something interactive actually changed
        const hoverChanged = (newHover?.x !== state.hover?.x || newHover?.y !== state.hover?.y ||
                              (newHover == null) !== (state.hover == null));
        const midChanged = (newMidHover?.index !== state.midpointHover?.index ||
                            (newMidHover == null) !== (state.midpointHover == null));
        const lineChanged = (newLineHover?.index !== state.lineHover?.index ||
                             (newLineHover == null) !== (state.lineHover == null));

        state.hover = newHover;
        state.midpointHover = newMidHover;
        state.lineHover = newLineHover;

        // If dragging (line preview), always redraw; otherwise only if hover state changed
        if (state.dragFrom || state.dragMoved || hoverChanged || midChanged || lineChanged) {
          draw();
        }
      }

      function handleCanvasPointerUp(event) {
        if (state.activePointerId !== event.pointerId) return;
        state.activePointerId = null;
        if (state.rightPan) {
          const wasMoved = state.rightPan.moved;
          state.rightPan = null;
          stage.classList.remove("is-panning");
          if (wasMoved) {
            persist(true);
            draw();
            updateControls();
          } else {
            addColoredDot(event.clientX, event.clientY);
          }
          return;
        }
        if (state.erasing) {
          state.erasing = false;
          draw();
          updateControls();
          return;
        }
        if (state.panning) {
          state.panning = false;
          state.panStart = null;
          stage.classList.remove("is-panning");
          persist(true);
          updateControls();
        }
        if (state.bendDrag) {
          if (state.dragMoved && state.hover &&
              !samePoint(state.bendDrag.line.from, state.hover) &&
              !samePoint(state.bendDrag.line.to, state.hover)) {
            const source = state.bendDrag.line;
            const replacement = [
              { from: source.from, to: { x: state.hover.x, y: state.hover.y }, thickness: source.thickness, colorMode: source.colorMode },
              { from: { x: state.hover.x, y: state.hover.y }, to: source.to, thickness: source.thickness, colorMode: source.colorMode }
            ];
            state.lines.splice(state.bendDrag.index, 1, ...replacement);
            state.redo = [];
            pushUndo({ type: "bendLine", index: state.bendDrag.index, original: source, replacement });
            invalidateFillCache();
            persist(true);
          }
          state.bendDrag = null;
          state.dragStart = null;
          state.dragMoved = false;
          state.midpointHover = null;
          draw();
          updateControls();
          return;
        }
        if (state.dragFrom) {
          if (state.dragMoved && state.hover && !samePoint(state.dragFrom, state.hover)) {
            addLine(state.dragFrom, state.hover);
            state.selected = { x: state.hover.x, y: state.hover.y };
          } else if (!state.dragMoved) {
            connectClickedDot(state.dragFrom);
          }
          draw();
          updateControls();
        }
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
      }

      function handleWheel(event) {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = event.clientX - rect.left;
        const sy = event.clientY - rect.top;
        const direction = event.deltaY > 0 ? -1 : 1;
        const factor = Math.pow(1.16, direction);
        zoomAt(state.scale * factor, sx, sy);
      }

      function handleKeyDown(event) {
        if (confirmOverlay.classList.contains("is-open") && event.key === "Enter") {
          event.preventDefault();
          confirmOverlay.classList.remove("is-open");
          performClearBoard();
          return;
        }
        if (randomizeOverlay.classList.contains("is-open") && event.key === "Enter") {
          event.preventDefault();
          randomizeOverlay.classList.remove("is-open");
          generateRandomVector();
          return;
        }
        if (event.target instanceof HTMLInputElement && !(event.metaKey || event.ctrlKey)) return;
        const command = event.metaKey || event.ctrlKey;
        const key = event.key.toLowerCase();
        if (!command && key === "shift" && (state.paintMode || state.eraserMode)) {
          event.preventDefault();
          state.paintMode = false;
          state.eraserMode = false;
          state.erasing = false;
          palettePopover.classList.remove("is-open");
          persist(true);
          updateControls();
          draw();
          return;
        }
        if (!command && key === "v") {
          event.preventDefault();
          setViewOpen(!state.viewOpen);
          return;
        }
        if (!command && key === "f") {
          event.preventDefault();
          toggleFullscreen();
          return;
        }
        if (!command && key === "c") {
          event.preventDefault();
          requestClearBoard();
          return;
        }
        if (!command && (event.key === " " || key === "spacebar")) {
          event.preventDefault();
          endCurrentConnect();
          return;
        }
        if (!command && key === "s") {
          event.preventDefault();
          downloadJson();
          return;
        }
        if (!command && key === "l") {
          event.preventDefault();
          loadInput.click();
          return;
        }
        if (!command) return;
        if (key === "z") {
          event.preventDefault();
          if (event.shiftKey) redo();
          else undo();
        }
        if (key === "x") {
          event.preventDefault();
          redo();
        }
        if (key === "s") {
          event.preventDefault();
          downloadJson();
        }
        if (key === "0") {
          event.preventDefault();
          resetView();
        }
      }

      document.addEventListener("pointerdown", event => {
        if (event.target.closest("button")) playSound("button");
      }, true);

      clearButton.addEventListener("click", requestClearBoard);
      menuWraps.forEach(wrap => {
        wrap.addEventListener("pointerenter", () => openMenu(wrap));
        wrap.addEventListener("pointerleave", () => wrap.classList.remove("is-menu-open"));
        wrap.addEventListener("focusin", () => openMenu(wrap));
        wrap.addEventListener("focusout", () => {
          window.setTimeout(() => {
            if (!wrap.contains(document.activeElement)) wrap.classList.remove("is-menu-open");
          }, 0);
        });
      });
      fileButton.addEventListener("click", event => {
        event.stopPropagation();
        openMenu(fileButton.closest(".menu-wrap"));
      });
      settingsButton.addEventListener("click", event => {
        event.stopPropagation();
        openMenu(settingsButton.closest(".menu-wrap"));
      });
      saveJsonButton.addEventListener("click", () => {
        requestSaveName("json");
        closeMenus();
      });
      saveSvgButton.addEventListener("click", () => {
        requestSaveName("svg");
        closeMenus();
      });
      loadButton.addEventListener("click", () => {
        loadInput.click();
        closeMenus();
      });
      randomizeButton.addEventListener("click", () => {
        requestRandomize();
        closeMenus();
      });
      brandButton.addEventListener("click", event => {
        event.stopPropagation();
        openMenu(brandButton.closest(".brand-wrap"));
      });
      blankStartButton.addEventListener("click", () => {
        state.blankStart = !state.blankStart;
        localStorage.setItem(blankStartKey, state.blankStart ? "true" : "false");
        closeMenus();
        updateControls();
      });
      document.querySelectorAll("[data-lang]").forEach(button => {
        button.addEventListener("click", () => {
          state.lang = button.dataset.lang;
          localStorage.setItem(langKey, state.lang);
          closeMenus();
          updateControls();
        });
      });
      viewButton.addEventListener("click", () => setViewOpen(!state.viewOpen));
      accentButton.addEventListener("click", () => {
        // If paint or eraser is active, clicking the color dot deactivates them
        if (state.paintMode || state.eraserMode) {
          state.paintMode = false;
          state.eraserMode = false;
          state.erasing = false;
          palettePopover.classList.remove("is-open");
        } else {
          state.accentMode = !state.accentMode;
        }
        persist(true);
        updateControls();
        draw();
      });
      loadInput.addEventListener("change", () => {
        loadProjectFile(loadInput.files[0]);
        loadInput.value = "";
      });
      undoButton.addEventListener("click", undo);
      redoButton.addEventListener("click", redo);
      zoomLockButton.addEventListener("click", () => {
        state.zoomLocked = !state.zoomLocked;
        updateControls();
      });
      zoomInButton.addEventListener("click", () => zoomBy(1.35));
      zoomOutButton.addEventListener("click", () => zoomBy(1 / 1.35));
      // Zoom readout: always displays "NNN%" — the % is always visible but the cursor never
      // moves past the digits. Backspace/digits edit the numeric part; Enter/blur commits+clamps.
      zoomReadout.addEventListener("keydown", event => {
        if (event.key === "Enter") { event.preventDefault(); commitZoomInput(); zoomReadout.blur(); }
        if (event.key === "Escape") { event.preventDefault(); updateControls(); zoomReadout.blur(); }
      });
      zoomReadout.addEventListener("focus", () => zoomReadout.select());
      zoomReadout.addEventListener("blur", commitZoomInput);
      thicknessButton.addEventListener("click", event => {
        event.stopPropagation();
        thicknessPopover.classList.toggle("is-open");
        palettePopover.classList.remove("is-open");
      });
      thicknessSlider.addEventListener("input", () => {
        state.thickness = Math.max(minThickness, Math.min(maxThickness, Number.parseFloat(thicknessSlider.value) || 2));
        persist(true);
        draw();
      });
      bucketButton.addEventListener("click", event => {
        event.stopPropagation();
        state.paintMode = !state.paintMode;
        if (state.paintMode) state.eraserMode = false;
        palettePopover.classList.toggle("is-open", state.paintMode);
        thicknessPopover.classList.remove("is-open");
        state.selected = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        persist(true);
        updateControls();
        draw();
      });
      eraserButton.addEventListener("click", () => {
        state.eraserMode = !state.eraserMode;
        if (state.eraserMode) {
          state.paintMode = false;
          palettePopover.classList.remove("is-open");
        }
        state.selected = null;
        state.hover = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        state.erasing = false;
        persist(true);
        updateControls();
        draw();
      });
      themeButton.addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));
      soundButton.addEventListener("click", () => {
        state.soundEnabled = !state.soundEnabled;
        localStorage.setItem("matrix-dot-paper-sound-v1", state.soundEnabled ? "true" : "false");
        updateControls();
      });
      gridButton.addEventListener("click", () => {
        state.gridLines = !state.gridLines;
        persist(true);
        draw();
        updateControls();
      });
      fullscreenButton.addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", updateControls);
      cancelClearButton.addEventListener("click", () => confirmOverlay.classList.remove("is-open"));
      confirmClearButton.addEventListener("click", () => {
        confirmOverlay.classList.remove("is-open");
        performClearBoard();
      });
      document.getElementById("cancelRandomizeButton").addEventListener("click", () => randomizeOverlay.classList.remove("is-open"));
      document.getElementById("confirmRandomizeButton").addEventListener("click", () => {
        randomizeOverlay.classList.remove("is-open");
        generateRandomVector();
      });
      randomizeOverlay.addEventListener("pointerdown", event => {
        if (event.target === randomizeOverlay) randomizeOverlay.classList.remove("is-open");
      });
      cancelSaveButton.addEventListener("click", closeSaveDialog);
      confirmSaveButton.addEventListener("click", () => {
        const name = saveNameInput.value.trim();
        const type = pendingSaveType;
        closeSaveDialog();
        window.setTimeout(() => {
          if (type === "svg") downloadSvg(name);
          else downloadJson(name);
        }, 60);
      });
      saveNameInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          confirmSaveButton.click();
        }
        if (event.key === "Escape") {
          event.preventDefault();
          closeSaveDialog();
        }
      });
      confirmOverlay.addEventListener("pointerdown", event => {
        if (event.target === confirmOverlay) {
          confirmOverlay.classList.remove("is-open");
        }
      });
      saveOverlay.addEventListener("pointerdown", event => {
        if (event.target === saveOverlay) {
          closeSaveDialog();
        }
      });
      document.addEventListener("pointerdown", event => {
        if (state.viewOpen && !viewBox.contains(event.target) && event.target !== viewButton) {
          setViewOpen(false);
        }
        if (!event.target.closest(".brand-wrap, .menu-wrap")) closeMenus();
        if (!thicknessPopover.contains(event.target) && !thicknessButton.contains(event.target)) {
          thicknessPopover.classList.remove("is-open");
        }
        if (!palettePopover.contains(event.target) && !bucketButton.contains(event.target)) {
          palettePopover.classList.remove("is-open");
        }
      });
      // Drag-and-drop to load saves (.json / .matrix-dots / .svg)
      let _dragCounter = 0;
      document.addEventListener("dragenter", event => {
        const items = event.dataTransfer && event.dataTransfer.items;
        if (!items) return;
        const hasFile = Array.from(items).some(it => it.kind === "file");
        if (!hasFile) return;
        event.preventDefault();
        _dragCounter++;
        dropOverlay.classList.add("is-active");
      });
      document.addEventListener("dragleave", () => {
        _dragCounter--;
        if (_dragCounter <= 0) { _dragCounter = 0; dropOverlay.classList.remove("is-active"); }
      });
      document.addEventListener("dragover", event => {
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      });
      document.addEventListener("drop", event => {
        event.preventDefault();
        _dragCounter = 0;
        dropOverlay.classList.remove("is-active");
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (file) loadProjectFile(file);
      });

      canvas.addEventListener("pointerdown", handleCanvasPointerDown);
      canvas.addEventListener("pointermove", handleCanvasPointerMove);
      canvas.addEventListener("pointerup", handleCanvasPointerUp);
      canvas.addEventListener("pointercancel", handleCanvasPointerUp);
      canvas.addEventListener("contextmenu", event => event.preventDefault());
      canvas.addEventListener("wheel", handleWheel, { passive: false });
      window.addEventListener("keydown", handleKeyDown);
      window.addEventListener("resize", resizeCanvas);

      restore();
      refreshCssCache();
      resizeCanvas();
      updateControls();
    })();
  </script>
</body>
</html>
