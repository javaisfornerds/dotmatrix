      function nearestMidpoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        let closest = null;
        for (let index = 0; index < state.lines.length; index += 1) {
          const line = state.lines[index];
          const mid = {
            x: (line.from.x + line.to.x) / 2,
            y: (line.from.y + line.to.y) / 2
          };
          const screen = worldToScreen(mid.x, mid.y);
          const distance = Math.hypot(screen.x - sx, screen.y - sy);
          const threshold = Math.max(14, Math.min(28, 16 + segmentThickness(line) * state.scale));
          if (distance <= threshold && (!closest || distance < closest.distance)) {
            closest = { index, point: mid, sx: screen.x, sy: screen.y, distance };
          }
        }
        return closest;
      }

      function nearestLine(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        let closest = null;
        for (let index = 0; index < state.lines.length; index += 1) {
          const line = state.lines[index];
          const from = worldToScreen(line.from.x, line.from.y);
          const to = worldToScreen(line.to.x, line.to.y);
          const threshold = Math.max(5, Math.min(12, screenLineWidth(line) + 5));
          let distance;
          if (line.cp) {
            // Quadratic bezier — sample along the curve and find closest point
            const cp = worldToScreen(line.cp.x, line.cp.y);
            const steps = 32;
            let minD = Infinity;
            for (let i = 0; i <= steps; i++) {
              const tt = i / steps;
              const mt = 1 - tt;
              const bx = mt * mt * from.x + 2 * mt * tt * cp.x + tt * tt * to.x;
              const by = mt * mt * from.y + 2 * mt * tt * cp.y + tt * tt * to.y;
              const d = Math.hypot(bx - sx, by - sy);
              if (d < minD) minD = d;
            }
            distance = minD;
          } else {
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const lengthSq = dx * dx + dy * dy;
            if (!lengthSq) continue;
            const t = Math.max(0, Math.min(1, ((sx - from.x) * dx + (sy - from.y) * dy) / lengthSq));
            const px = from.x + dx * t;
            const py = from.y + dy * t;
            distance = Math.hypot(px - sx, py - sy);
          }
          if (distance <= threshold && (!closest || distance < closest.distance)) {
            closest = { line, index, x: sx, y: sy, distance };
          }
        }
        return closest;
      }

      function eraseLineAt(clientX, clientY) {
        const hit = nearestLine(clientX, clientY);
        if (!hit) return false;
        const previousFills = state.fills.map(cloneFill);
        const [line] = state.lines.splice(hit.index, 1);
        const nextFills = state.fills.map(cloneFill);
        pushUndo({
          type: "removeLine",
          line,
          index: hit.index,
          previousFills,
          nextFills
        });
        state.selected = null;
        state.hover = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        invalidateFillCache();
        persist(true);
        draw();
        updateControls();
        return true;
      }

      function eraseDotAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const hitRadius = Math.max(10, Math.min(22, state.scale * 8));
        for (let i = state.dots.length - 1; i >= 0; i--) {
          const dot = state.dots[i];
          const p = worldToScreen(dot.x, dot.y);
          if (Math.hypot(p.x - sx, p.y - sy) <= hitRadius) {
            const [removed] = state.dots.splice(i, 1);
            pushUndo({ type: "removeDot", dot: removed, index: i });
            persist(true);
            draw();
            updateControls();
            return true;
          }
        }
        return false;
      }

      function fillContainsPoint(fill, clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        if (sx < 0 || sy < 0 || sx >= rect.width || sy >= rect.height) return false;
        const world = screenToWorld(sx, sy);
        // Use frozen region if available (works even when boundary lines are gone)
        if (fill._region && fill._regionBounds && fill._regionScale) {
          const rb = fill._regionBounds;
          const rs = fill._regionScale;
          const rw = Math.max(1, Math.ceil((rb.maxX - rb.minX) * rs));
          const rh = Math.max(1, Math.ceil((rb.maxY - rb.minY) * rs));
          const px = Math.round((world.x - rb.minX) * rs);
          const py = Math.round((world.y - rb.minY) * rs);
          if (px < 0 || py < 0 || px >= rw || py >= rh) return false;
          return fill._region[py * rw + px] === 1;
        }
        // Fallback: flood from seed using current lines (for fills without frozen region)
        if (!state.lines.length) return false;
        const target = world;
        const bounds = drawingBounds([fill.seed, target]);
        const geometry = layerGeometry(bounds, 1400000, 2);
        const toPixel = point => toLayerPoint(bounds, geometry.scale, point);
        const boundary = drawBoundaryMap(state.lines, geometry.width, geometry.height, toPixel, geometry.scale);
        const region = floodRegion(toPixel(fill.seed), boundary, geometry.width, geometry.height);
        if (!region) return false;
        const targetPixel = toPixel(target);
        const tx = Math.round(targetPixel.x);
        const ty = Math.round(targetPixel.y);
        if (tx < 0 || ty < 0 || tx >= geometry.width || ty >= geometry.height) return false;
        return region[ty * geometry.width + tx] === 1;
      }

      function removeFillAt(clientX, clientY) {
        for (let index = state.fills.length - 1; index >= 0; index -= 1) {
          if (!fillContainsPoint(state.fills[index], clientX, clientY)) continue;
          const fill = state.fills.splice(index, 1)[0];
          pushUndo({ type: "removeFill", fill, index });
          invalidateFillCache();
          persist(true);
          draw();
          updateControls();
          return true;
        }
        return false;
      }


      function requestRandomize() {
        if (is3D) return;
        randomizeMessage.textContent = t("randomizePrompt");
        randomizeOverlay.classList.add("is-open");
      }

      function generateRandomVector() {
        if (is3D) return;
        // ── True random seed via crypto ──────────────────────────────────
        const seedArr = new Uint32Array(4);
        crypto.getRandomValues(seedArr);
        let s0 = seedArr[0] >>> 0 || 1, s1 = seedArr[1] >>> 0 || 2;
        let s2 = seedArr[2] >>> 0 || 3, s3 = seedArr[3] >>> 0 || 4;

        // xoshiro128** PRNG
        function rand() {
          const r = (Math.imul(s1 * 5 | 0, 7) >>> 0) / 0x100000000;
          const t = s1 << 9;
          s2 ^= s0; s3 ^= s1; s1 ^= s2; s0 ^= s3;
          s2 ^= t; s3 = (s3 << 11) | (s3 >>> 21);
          return r;
        }
        const ri = (a, b) => Math.floor(rand() * (b - a + 1)) + a;
        const rf = (a, b) => rand() * (b - a) + a;
        const rp = a => a[Math.floor(rand() * a.length)];
        const snap = v => Math.round(v / grid) * grid;
        const pt = (x, y) => ({ x: snap(x), y: snap(y) });
        const dedup = lines => {
          const seen = new Set();
          return lines.filter(l => {
            if (!l || !l.from || !l.to) return false;
            if (l.from.x === l.to.x && l.from.y === l.to.y) return false;
            const k = [l.from.x, l.from.y, l.to.x, l.to.y].join(",");
            const k2 = [l.to.x, l.to.y, l.from.x, l.from.y].join(",");
            if (seen.has(k) || seen.has(k2)) return false;
            seen.add(k); return true;
          });
        };
        const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

        // ── Global palette — weighted toward blue/black mix ──────────────
        const paletteMode = rp([
          "accent", "accent",
          "fullRandom", "fullRandom", "fullRandom",
          "bicolor", "bicolor",
          "allBlue",
          "mono"
        ]);
        // Per-line thickness — each line gets its own random weight
        const baseThick = ri(1, maxThickness);
        let lineIdx = 0;

        function pickThick() {
          lineIdx++;
          // Always fully random per-line thickness for max variety
          return ri(1, maxThickness);
        }

        function pickColor() {
          if (paletteMode === "mono")       return "normal";
          if (paletteMode === "accent")     return "accent";
          if (paletteMode === "allBlue")    return "accent";
          if (paletteMode === "bicolor")    return rand() > 0.5 ? "accent" : "normal";
          // fullRandom: heavy blue bias
          return rand() > 0.35 ? "accent" : "normal";
        }

        function makeLine(from, to, tOverride) {
          return { from: { x: from.x, y: from.y }, to: { x: to.x, y: to.y },
                   thickness: tOverride ?? pickThick(), colorMode: pickColor() };
        }

        // ── Dot colors — rich blue/black/grey palette ────────────────────
        const dotColors = () => [
          cobalt, cobalt, cobalt,
          cssCache.line, cssCache.line,
          blueShadeColor(ri(1, 5)), blueShadeColor(ri(1, 5)), blueShadeColor(ri(1, 5)),
          shadeColor(ri(1, 10)), shadeColor(ri(10, 18))
        ];

        // ── True random generation — no presets, no compositions ─────────
        const newLines = [];
        const newDots  = [];

        // Spread varies wildly — bias toward large values to push away from center
        const spread = rp([
          ri(15, 30), ri(30, 60), ri(60, 120), ri(120, 220)
        ]) * grid;
        const numLines = ri(20, 180);
        const dc = dotColors();

        for (let i = 0; i < numLines; i++) {
          // Use polar coords with non-uniform distribution to avoid center clustering
          const angle1 = rf(0, Math.PI * 2);
          const angle2 = rf(0, Math.PI * 2);
          // Bias radius toward outer region: sqrt gives uniform area distribution
          const r1 = Math.sqrt(rand()) * spread + ri(0, spread * 0.3);
          const r2 = Math.sqrt(rand()) * spread + ri(0, spread * 0.3);
          const ax = Math.cos(angle1) * r1, ay = Math.sin(angle1) * r1;
          const bx = Math.cos(angle2) * r2, by = Math.sin(angle2) * r2;
          newLines.push(makeLine(pt(ax, ay), pt(bx, by)));
        }

        const numDots = ri(10, 60);
        for (let i = 0; i < numDots; i++) {
          const angle = rf(0, Math.PI * 2);
          const r = Math.sqrt(rand()) * spread;
          newDots.push({ x: snap(Math.cos(angle) * r), y: snap(Math.sin(angle) * r),
            color: rp(dc) });
        }

        // ── Commit state ─────────────────────────────────────────────────
        state.lines = dedup(newLines);
        state.dots  = newDots;
        state.fills = [];
        state.redo = []; state.undoStack = []; state.redoStack = [];
        state.selected = state.hover = state.dragFrom = state.dragStart = null;
        state.dragMoved = false; state.bendDrag = null;
        state.midpointHover = state.lineHover = null;
        invalidateFillCache();

        // ── Attempt flood fills in closed regions ─────────────────────────
        const fillCount = ri(0, 14);
        const candidates = shuffle(state.lines.slice());
        let attempts = 0;
        for (const seg of candidates) {
          if (state.fills.length >= fillCount || attempts++ > fillCount * 8) break;
          const ox = (seg.from.x + seg.to.x) / 2 + rf(-0.4, 0.4) * grid;
          const oy = (seg.from.y + seg.to.y) / 2 + rf(-0.4, 0.4) * grid;
          const kind = rp(["gray", "gray", "blue"]);
          const shade = kind === "blue" ? ri(1, 5) : ri(2, 18);
          state.fills.push({ seed: { x: ox, y: oy }, kind, shade });
        }

        // ── Scale & center view ───────────────────────────────────────────
        const xs = state.lines.flatMap(l => [l.from.x, l.to.x]);
        const ys = state.lines.flatMap(l => [l.from.y, l.to.y]);
        if (xs.length) {
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const minY = Math.min(...ys), maxY = Math.max(...ys);
          const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
          const rect = canvasRect;
          const spanX = maxX - minX || grid * 10;
          const spanY = maxY - minY || grid * 10;
          const fitScale = Math.min(maxScale, Math.max(minScale,
            Math.min((rect.width  * 0.85) / spanX,
                     (rect.height * 0.85) / spanY)));
          state.scale   = fitScale;
          state.offsetX = rect.width  / 2 - midX * fitScale;
          state.offsetY = rect.height / 2 - midY * fitScale;
        }

        persist(true);
        draw();
        updateControls();
      }

      function requestRandomize3d() {
        randomize3dMessage.textContent = t("randomize3dPrompt");
        randomize3dOverlay.classList.add("is-open");
      }

      function generateRandom3dVector() {
        // ── True random seed via crypto ──────────────────────────────────
        const seedArr = new Uint32Array(4);
        crypto.getRandomValues(seedArr);
        let s0 = seedArr[0] >>> 0 || 1, s1 = seedArr[1] >>> 0 || 2;
        let s2 = seedArr[2] >>> 0 || 3, s3 = seedArr[3] >>> 0 || 4;

        function rand() {
          const r = (Math.imul(s1 * 5 | 0, 7) >>> 0) / 0x100000000;
          const tt = s1 << 9;
          s2 ^= s0; s3 ^= s1; s1 ^= s2; s0 ^= s3;
          s2 ^= tt; s3 = (s3 << 11) | (s3 >>> 21);
          return r;
        }
        const ri = (a, b) => Math.floor(rand() * (b - a + 1)) + a;
        const rf = (a, b) => rand() * (b - a) + a;
        const rp = a => a[Math.floor(rand() * a.length)];
        const snap = v => Math.round(v / grid) * grid;

        // ── Color palette — wilder variety ───────────────────────────────
        const paletteMode = rp([
          "bicolor","bicolor",
          "fullRandom","fullRandom","fullRandom",
          "allBlue","allBlue",
          "mono",
          "chaotic"   // every line fully independent
        ]);
        function pickColor() {
          if (paletteMode === "mono")    return "mono";
          if (paletteMode === "allBlue") return "accent";
          if (paletteMode === "bicolor") return rand() > 0.45 ? "accent" : "mono";
          if (paletteMode === "chaotic") return rand() > 0.5 ? "accent" : "mono";
          return rand() > 0.5 ? "accent" : "mono";
        }

        // ── Thickness — wildly varied, heavily skewed toward extremes ────
        function pickThick() {
          const roll = rand();
          if (roll < 0.15) return ri(1, 2);           // hair-thin
          if (roll < 0.40) return ri(3, 6);           // medium
          if (roll < 0.70) return ri(7, 14);          // chunky
          return ri(15, maxThickness);                 // massive
        }

        // ── Spread: dramatically larger ranges, multiple concentration zones
        const globalSpreadUnits = rp([
          ri(40, 80),   // big
          ri(80, 160),  // very big
          ri(160, 300), // enormous
          ri(300, 500)  // colossal
        ]);
        const globalSpread = globalSpreadUnits * grid;

        // Number of independent "clusters" with their own center + spread
        const numClusters = ri(2, 7);
        const clusters = [];
        for (let c = 0; c < numClusters; c++) {
          const angle = rf(0, Math.PI * 2);
          const dist  = rf(0, globalSpread * 0.6);
          clusters.push({
            cx: snap(Math.cos(angle) * dist),
            cy: snap(Math.sin(angle) * dist),
            // Each cluster gets its own spread: some tight, some vast
            spread: rp([ri(5,15), ri(15,50), ri(50,150), ri(150,350)]) * grid,
            // Concentration: how likely a point falls in this cluster
            weight: rf(0.2, 1.0)
          });
        }
        // Normalise weights
        const totalW = clusters.reduce((s, c) => s + c.weight, 0);
        clusters.forEach(c => c.weight /= totalW);

        function pickCluster() {
          let r = rand(), acc = 0;
          for (const c of clusters) { acc += c.weight; if (r <= acc) return c; }
          return clusters[clusters.length - 1];
        }

        function samplePoint() {
          const c = pickCluster();
          const a = rf(0, Math.PI * 2);
          // Power controls shape: 0.5=uniform-disk, 2=center-heavy, 0.2=ring-heavy
          const power = rp([0.2, 0.4, 0.5, 0.7, 1.5, 2.5]);
          const r = Math.pow(rand(), power) * c.spread;
          return { x: snap(c.cx + Math.cos(a) * r), y: snap(c.cy + Math.sin(a) * r) };
        }

        const zSpread = threedMaxZ; // full range
        const numLines = ri(200, 600);
        const newLines = [];

        // ── Shape variety: some lines short & local, others long & spanning
        for (let i = 0; i < numLines; i++) {
          const shapeRoll = rand();
          let fp, tp, fz, tz;

          if (shapeRoll < 0.30) {
            // Short local stroke — both ends near same cluster
            const c = pickCluster();
            const a1 = rf(0, Math.PI * 2), a2 = rf(0, Math.PI * 2);
            const localR = rp([ri(1,4), ri(4,12), ri(12,30)]) * grid;
            const cx = c.cx + (rand()-0.5)*c.spread*0.4;
            const cy = c.cy + (rand()-0.5)*c.spread*0.4;
            fp = { x: snap(cx + Math.cos(a1)*localR*rf(0.1,1)), y: snap(cy + Math.sin(a1)*localR*rf(0.1,1)) };
            tp = { x: snap(cx + Math.cos(a2)*localR*rf(0.1,1)), y: snap(cy + Math.sin(a2)*localR*rf(0.1,1)) };
            fz = ri(-zSpread, zSpread);
            tz = ri(Math.max(-zSpread, fz - ri(2,5)), Math.min(zSpread, fz + ri(2,5)));
          } else if (shapeRoll < 0.55) {
            // Normal cluster-sampled endpoints
            fp = samplePoint();
            tp = samplePoint();
            fz = ri(-zSpread, zSpread);
            tz = ri(-zSpread, zSpread);
          } else if (shapeRoll < 0.75) {
            // Long diagonal spanning multiple clusters — creates visual structure
            fp = samplePoint();
            const farCluster = clusters[ri(0, clusters.length - 1)];
            const a = rf(0, Math.PI * 2);
            tp = { x: snap(farCluster.cx + Math.cos(a)*farCluster.spread*rf(0.5,1.5)),
                   y: snap(farCluster.cy + Math.sin(a)*farCluster.spread*rf(0.5,1.5)) };
            fz = ri(-zSpread, zSpread);
            tz = ri(-zSpread, zSpread);
          } else {
            // Radial/spoke from a cluster center outward — creates starburst shapes
            const c = pickCluster();
            const a = rf(0, Math.PI * 2);
            const len = rf(0.3, 2.5) * c.spread;
            fp = { x: snap(c.cx + Math.cos(a)*len*0.05), y: snap(c.cy + Math.sin(a)*len*0.05) };
            tp = { x: snap(c.cx + Math.cos(a)*len), y: snap(c.cy + Math.sin(a)*len) };
            fz = ri(-zSpread, zSpread);
            tz = ri(-zSpread, zSpread);
          }

          if (fp.x === tp.x && fp.y === tp.y && fz === tz) continue;
          newLines.push({
            from: { x: fp.x, y: fp.y, z: fz },
            to:   { x: tp.x, y: tp.y, z: tz },
            thickness: pickThick(),
            colorMode: pickColor()
          });
        }

        // Dedup
        const seen = new Set();
        threedLines = newLines.filter(l => {
          const k  = `${l.from.x},${l.from.y},${l.from.z},${l.to.x},${l.to.y},${l.to.z}`;
          const k2 = `${l.to.x},${l.to.y},${l.to.z},${l.from.x},${l.from.y},${l.from.z}`;
          if (seen.has(k) || seen.has(k2)) return false;
          seen.add(k); return true;
        });
        threedDots = {};
        persist3d();
        threedZ = 0;
        t3DrawFrom = null;

        // Fit view to generated content
        const allX = threedLines.flatMap(l => [l.from.x, l.to.x]);
        const allY = threedLines.flatMap(l => [l.from.y, l.to.y]);
        if (allX.length) {
          const midX = (Math.min(...allX) + Math.max(...allX)) / 2;
          const midY = (Math.min(...allY) + Math.max(...allY)) / 2;
          const spanX = Math.max(...allX) - Math.min(...allX) || grid * 10;
          const spanY = Math.max(...allY) - Math.min(...allY) || grid * 10;
          const cw = threedCanvas.offsetWidth, ch = threedCanvas.offsetHeight;
          t3Scale = Math.max(minScale, Math.min(maxScale,
            Math.min((cw * 0.82) / spanX, (ch * 0.82) / spanY)));

          t3OffY = ch / 2 - midY * t3Scale;

        drawThreed();
        updateControls();
      }

      function addColoredDot(clientX, clientY) {
        const dot = snappedDotFromClient(clientX, clientY);
        if (!dot) return;
        const color = state.accentMode ? cobalt : (state.paintMode ? paintColor(state.paintKind, state.paintKind === "blue" ? state.blueShade : state.shade, 1) : cssCache.line);
        const dotEntry = {
          x: dot.x,
          y: dot.y,
          color
        };
        state.dots.push(dotEntry);
        pushUndo({ type: "addDot", dot: dotEntry });
        persist(true);
        draw();
        updateControls();
      }

      function fillAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect(); // needed for .left/.top offset
        const sx = Math.round(clientX - rect.left);
        const sy = Math.round(clientY - rect.top);
        if (sx < 0 || sy < 0 || sx >= canvasRect.width || sy >= canvasRect.height || !state.lines.length) return false;
        const world = screenToWorld(sx, sy);
        const bounds = drawingBounds([world]);
        const geometry = layerGeometry(bounds, 1400000, 2);
        const toPixel = point => toLayerPoint(bounds, geometry.scale, point);
        const boundary = drawBoundaryMap(state.lines, geometry.width, geometry.height, toPixel, geometry.scale);
        const region = floodRegion(toPixel(world), boundary, geometry.width, geometry.height);
        if (!region) return false;
        let pixels = 0;
        for (let index = 0; index < region.length; index += 1) {
          if (region[index]) pixels += 1;
          if (pixels >= 3) break;
        }
        if (pixels < 3) return false;
        const fill = {
          seed: { x: world.x, y: world.y },
          kind: state.paintKind,
          shade: state.paintKind === "blue" ? state.blueShade : state.shade
        };
        freezeFillRegion(fill);
        state.fills.push(fill);
        pushUndo({ type: "addFill", fill });
        invalidateFillCache();
        persist(true);
        draw();
        updateControls();
        return true;
      }

      function renderFills(width, height) {
        if (!state.fills.length) return;

        // Only freeze missing fills when not in the middle of a rapid zoom.
        // During zoom, just draw whatever cached canvas is available.
        if (!zoomSettleTimer) {
          for (const fill of state.fills) {
            if (!fill._regionCanvas && state.lines.length) {
              freezeFillRegion(fill);
            }
          }
        }

        ctx.save();
        // Always downscaling from a maxScale-baked canvas — no smoothing needed, stays crisp.
        ctx.imageSmoothingEnabled = false;

        for (const fill of state.fills) {
          if (!fill._regionCanvas) continue;
          const rb = fill._regionBounds;
          const rs = fill._regionScale;
          const drawScale = state.scale / rs;
          const dx = rb.minX * state.scale + state.offsetX;
          const dy = rb.minY * state.scale + state.offsetY;
          ctx.setTransform(drawScale * livePixelRatio, 0, 0, drawScale * livePixelRatio, dx * livePixelRatio, dy * livePixelRatio);
          ctx.drawImage(fill._regionCanvas, 0, 0);
        }

        ctx.restore();
      }

      function drawDots(width, height, ink, soft) {
        const step = activeGridStep();
        const spacing = step * state.scale;
        if (spacing < 3) return;

        const worldTopLeft = screenToWorld(0, 0);
        const worldBottomRight = screenToWorld(width, height);
        const startX = Math.floor(worldTopLeft.x / step) * step;
        const endX = Math.ceil(worldBottomRight.x / step) * step;
        const startY = Math.floor(worldTopLeft.y / step) * step;
        const endY = Math.ceil(worldBottomRight.y / step) * step;
        const dotRadius = Math.max(0.7, Math.min(2.5, state.scale * 1.4));
        const majorEvery = 5;

        if (state.gridLines) {
          // Batch all vertical lines into a single path call
          ctx.save();
          ctx.strokeStyle = soft;
          ctx.globalAlpha = 0.32;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = startX; x <= endX; x += step) {
            const screen = worldToScreen(x, 0);
            ctx.moveTo(screen.x, 0);
            ctx.lineTo(screen.x, height);
          }
          for (let y = startY; y <= endY; y += step) {
            const screen = worldToScreen(0, y);
            ctx.moveTo(0, screen.y);
            ctx.lineTo(width, screen.y);
          }
          ctx.stroke();
          ctx.restore();
        }

        // At 100% zoom and above: use the normal soft color unchanged.
        // Below 100%: linearly darken the dot color toward a more visible shade.
        const t = Math.min(1, Math.max(0, (state.scale - minScale) / (1 - minScale)));
        const dotAlpha = 0.14 + (1 - t) * 0.31;
        const dotColor = state.theme === "dark"
          ? `rgba(246,246,246,${dotAlpha})`
          : `rgba(5,5,5,${dotAlpha})`;

        ctx.fillStyle = dotColor;

        // Batch dots by alpha bucket (major / base / sub) to minimize globalAlpha switches
        const rMajor = (major, base) => major ? dotRadius * 1.28 : base ? dotRadius * 1.08 : dotRadius * 0.76;

        // Collect points by category
        const majorPts = [], basePts = [], subPts = [];
        for (let x = startX; x <= endX; x += step) {
          for (let y = startY; y <= endY; y += step) {
            const screen = worldToScreen(x, y);
            const base = isBaseGridPoint(x) && isBaseGridPoint(y);
            const major = base && (Math.round(x / grid) % majorEvery === 0) && (Math.round(y / grid) % majorEvery === 0);
            if (major) majorPts.push(screen.x, screen.y);
            else if (base) basePts.push(screen.x, screen.y);
            else subPts.push(screen.x, screen.y);
          }
        }

        // Draw each batch as a single path
        const drawBatch = (pts, alpha, r) => {
          if (!pts.length) return;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          for (let i = 0; i < pts.length; i += 2) {
            ctx.moveTo(pts[i] + r, pts[i + 1]);
            ctx.arc(pts[i], pts[i + 1], r, 0, Math.PI * 2);
          }
          ctx.fill();
        };

        drawBatch(subPts,   0.62, dotRadius * 0.76);
        drawBatch(basePts,  0.86, dotRadius * 1.08);
        drawBatch(majorPts, 1,    dotRadius * 1.28);

        ctx.globalAlpha = 1;
        ctx.fillStyle = ink;
      }

      function drawPoint(point, radius, stroke, fill) {
        const p = worldToScreen(point.x, point.y);
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }

      function drawPulsingPoint(point, radius, stroke, fill, amount = 1.2) {
        const pulse = (Math.sin(performance.now() / 260) + 1) / 2;
        drawPoint(point, radius + pulse * amount, stroke, fill);
      }

      function requestAnimationDraw() {
        if (animationFrame) return;
        animationFrame = requestAnimationFrame(() => {
          animationFrame = null;
          draw();
        });
      }

      function drawRulers() {
        const topRect = { width: rulerCache.topW, height: rulerCache.topH };
        const leftRect = { width: rulerCache.leftW, height: rulerCache.leftH };
        const paper = cssCache.button;
        const ink = is3D ? cobalt : cssCache.ink;
        const muted = is3D ? cobalt : cssCache.ink;
        const border = cssCache.border;
        const step = rulerStep();
        const unitStep = step / grid;
        const minorStep = step / 4;

        // In 3D mode use the 3D pan/zoom transform; in 2D use the regular state
        const rS2W = is3D
          ? (x, y) => ({ x: (x - t3OffX) / t3Scale, y: (y - t3OffY) / t3Scale })
          : screenToWorld;
        const rW2S = is3D
          ? (x, y) => ({ x: x * t3Scale + t3OffX, y: y * t3Scale + t3OffY })
          : worldToScreen;

        const rulerBg = is3D
          ? (state.theme === "dark" ? "rgba(31,81,255,0.06)" : "rgba(31,81,255,0.04)")
          : (state.theme === "dark" ? "rgba(246,246,246,0.04)" : "rgba(5,5,5,0.03)");
        topRulerCtx.clearRect(0, 0, topRect.width, topRect.height);
        topRulerCtx.fillStyle = paper;
        topRulerCtx.fillRect(0, 0, topRect.width, topRect.height);
        topRulerCtx.fillStyle = rulerBg;
        topRulerCtx.fillRect(0, 0, topRect.width, topRect.height);
        topRulerCtx.strokeStyle = is3D ? cobalt : cssCache.ink;
        topRulerCtx.lineWidth = 1;
        topRulerCtx.imageSmoothingEnabled = false;
        topRulerCtx.fillStyle = muted;
        topRulerCtx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
        topRulerCtx.textBaseline = "top";
        const topStart = Math.floor(rS2W(0, 0).x / minorStep) * minorStep;
        const topEnd = Math.ceil(rS2W(topRect.width, 0).x / minorStep) * minorStep;
        {
          const majorPtsT = [], halfPtsT = [], minorPtsT = [];
          for (let x = topStart; x <= topEnd; x += minorStep) {
            const sx = rW2S(x, 0).x;
            const major = Math.abs(x / step - Math.round(x / step)) < 0.0001;
            const half = !major && Math.abs(x / (step/2) - Math.round(x / (step/2))) < 0.0001;
            if (major) majorPtsT.push(sx, x);
            else if (half) halfPtsT.push(sx);
            else minorPtsT.push(sx);
          }
          topRulerCtx.beginPath();
          for (let i = 0; i < minorPtsT.length; i++) { const x = Math.round(minorPtsT[i]) + 0.5; topRulerCtx.moveTo(x, topRect.height); topRulerCtx.lineTo(x, 19); }
          topRulerCtx.stroke();
          topRulerCtx.beginPath();
          for (let i = 0; i < halfPtsT.length; i++) { const x = Math.round(halfPtsT[i]) + 0.5; topRulerCtx.moveTo(x, topRect.height); topRulerCtx.lineTo(x, 14); }
          topRulerCtx.stroke();
          topRulerCtx.beginPath();
          for (let i = 0; i < majorPtsT.length; i+=2) { const x = Math.round(majorPtsT[i]) + 0.5; topRulerCtx.moveTo(x, topRect.height); topRulerCtx.lineTo(x, 6); }
          topRulerCtx.stroke();
          if (unitStep >= 0.05) {
            for (let i = 0; i < majorPtsT.length; i+=2) topRulerCtx.fillText(formatUnits(majorPtsT[i+1]), majorPtsT[i] + 3, 4);
          }
        }

        leftRulerCtx.clearRect(0, 0, leftRect.width, leftRect.height);
        leftRulerCtx.fillStyle = paper;
        leftRulerCtx.fillRect(0, 0, leftRect.width, leftRect.height);
        leftRulerCtx.fillStyle = rulerBg;
        leftRulerCtx.fillRect(0, 0, leftRect.width, leftRect.height);
        leftRulerCtx.strokeStyle = is3D ? cobalt : cssCache.ink;
        leftRulerCtx.lineWidth = 1;
        leftRulerCtx.imageSmoothingEnabled = false;
        leftRulerCtx.fillStyle = muted;
        leftRulerCtx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
        leftRulerCtx.textBaseline = "middle";
        const leftStart = Math.floor(rS2W(0, 0).y / minorStep) * minorStep;
        const leftEnd = Math.ceil(rS2W(0, leftRect.height).y / minorStep) * minorStep;
        {
          const majorPtsL = [], halfPtsL = [], minorPtsL = [];
          for (let y = leftStart; y <= leftEnd; y += minorStep) {
            const sy = rW2S(0, y).y;
            const major = Math.abs(y / step - Math.round(y / step)) < 0.0001;
            const half = !major && Math.abs(y / (step/2) - Math.round(y / (step/2))) < 0.0001;
            if (major) majorPtsL.push(sy, y);
            else if (half) halfPtsL.push(sy);
            else minorPtsL.push(sy);
          }
          leftRulerCtx.beginPath();
          for (let i = 0; i < minorPtsL.length; i++) { const y = Math.round(minorPtsL[i]) + 0.5; leftRulerCtx.moveTo(leftRect.width, y); leftRulerCtx.lineTo(24, y); }
          leftRulerCtx.stroke();
          leftRulerCtx.beginPath();
          for (let i = 0; i < halfPtsL.length; i++) { const y = Math.round(halfPtsL[i]) + 0.5; leftRulerCtx.moveTo(leftRect.width, y); leftRulerCtx.lineTo(18, y); }
          leftRulerCtx.stroke();
          leftRulerCtx.beginPath();
          for (let i = 0; i < majorPtsL.length; i+=2) { const y = Math.round(majorPtsL[i]) + 0.5; leftRulerCtx.moveTo(leftRect.width, y); leftRulerCtx.lineTo(8, y); }
          leftRulerCtx.stroke();
          if (unitStep >= 0.05) {
            leftRulerCtx.textAlign = "right";
            leftRulerCtx.textBaseline = "bottom";
            for (let i = 0; i < majorPtsL.length; i+=2) {
              leftRulerCtx.fillText(formatUnits(majorPtsL[i+1]), leftRect.width - 2, majorPtsL[i] - 1);
            }
          }
        }


      }

      function updateMeasure() {
        const rect = canvas.getBoundingClientRect();
        if (state.dragMoved && state.dragFrom && state.hover) {
          const hover = worldToScreen(state.hover.x, state.hover.y);
          measure.textContent = formatUnits(dragLength());
          measure.style.left = `${Math.min(rect.width - 56, Math.max(0, hover.x))}px`;
          measure.style.top = `${Math.min(rect.height - 22, Math.max(0, hover.y))}px`;
          measure.classList.add("is-visible");
          return;
        }
        if (state.lineHover) {
          const line = state.lineHover.line;
          measure.textContent = formatUnits(Math.hypot(line.to.x - line.from.x, line.to.y - line.from.y));
          measure.style.left = `${Math.min(rect.width - 56, Math.max(0, state.lineHover.x))}px`;
          measure.style.top = `${Math.min(rect.height - 22, Math.max(0, state.lineHover.y))}px`;
          measure.classList.add("is-visible");
          return;
        }
        measure.classList.remove("is-visible");
      }

      function updateCoords() {
        if (!state.pointerWorld) {
          coords.textContent = "x 0, y 0";
          return;
        }
        coords.textContent = `x ${formatUnits(state.pointerWorld.x)}, y ${formatUnits(state.pointerWorld.y)}`;
      }

      function updateThreedCoords(clientX, clientY) {
        if (!is3D) return;
        const rect = threedCanvas.getBoundingClientRect();
        const w = t3ScreenToWorld(clientX - rect.left, clientY - rect.top);
        const gx = Math.round(w.x / grid);
        const gy = Math.round(w.y / grid);
        coords.textContent = `x ${gx}, y ${gy}, z ${threedZ}`;
      }

      function draw() {
        const width = canvasRect.width;
        const height = canvasRect.height;
        const paper = cssCache.paper;
        const ink = cssCache.ink;
        const line = cssCache.line;
        const soft = cssCache.soft;
        const selected = cssCache.selected;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = paper;
        ctx.fillRect(0, 0, width, height);

        renderFills(width, height);
        drawDots(width, height, ink, soft);

        // Render colored dots (right-click standalone dots)
        for (const dot of state.dots) {
          const p = worldToScreen(dot.x, dot.y);
          const radius = Math.max(3, Math.min(9, state.scale * 5));
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = dot.color;
          ctx.fill();
        }

        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        // Batch straight lines by color+thickness
        const lineBatches = new Map();
        const curvedSegs = [];
        for (let index = 0; index < state.lines.length; index++) {
          if (state.bendDrag && index === state.bendDrag.index) continue;
          const segment = state.lines[index];
          if (segment.cp) { curvedSegs.push(segment); continue; }
          const color = lineColor(segment);
          const lw = screenLineWidth(segment);
          const key = color + "|" + lw;
          if (!lineBatches.has(key)) lineBatches.set(key, { color, lw, segs: [] });
          lineBatches.get(key).segs.push(segment);
        }
        for (const { color, lw, segs } of lineBatches.values()) {
          ctx.strokeStyle = color;
          ctx.lineWidth = lw;
          ctx.beginPath();
          for (const seg of segs) {
            const from = worldToScreen(seg.from.x, seg.from.y);
            const to = worldToScreen(seg.to.x, seg.to.y);
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
          }
          ctx.stroke();
        }
        // Draw curved (rounded) segments individually
        for (const seg of curvedSegs) {
          const from = worldToScreen(seg.from.x, seg.from.y);
          const to   = worldToScreen(seg.to.x,   seg.to.y);
          const cp   = worldToScreen(seg.cp.x,    seg.cp.y);
          ctx.strokeStyle = lineColor(seg);
          ctx.lineWidth = screenLineWidth(seg);

          ctx.moveTo(from.x, from.y);
          ctx.quadraticCurveTo(cp.x, cp.y, to.x, to.y);

            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 110);

            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = state.accentMode ? cobalt : selected;
            ctx.globalAlpha = alpha;
            for (const segment of state.closeHighlight.lines) {

              const to = worldToScreen(segment.to.x, segment.to.y);
              ctx.lineWidth = Math.max(screenLineWidth(segment), state.thickness * state.scale) + 14;
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              if (segment.cp) {

              }

              ctx.lineWidth = Math.max(1.5, screenLineWidth(segment) + 2);
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              if (segment.cp) {

                ctx.quadraticCurveTo(cp.x, cp.y, to.x, to.y);

        if (previewFromPoint && state.hover && !samePoint(previewFromPoint, state.hover)) {

            ctx.lineTo(to.x, to.y);
            ctx.stroke();

          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
          ctx.restore();
        }

        if (state.bendDrag && state.hover) {
          const bend = worldToScreen(state.hover.x, state.hover.y);
          const from = worldToScreen(state.bendDrag.line.from.x, state.bendDrag.line.from.y);

          ctx.save();
          ctx.globalAlpha = 0.72;
          ctx.strokeStyle = lineColor(state.bendDrag.line);
          ctx.lineWidth = screenLineWidth(state.bendDrag.line);
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(bend.x, bend.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
          ctx.restore();
        }

        if (state.selected && !state.paintMode && !state.eraserMode) {
          const selColor = state.accentMode ? cobalt : selected;

        }

          drawPoint(state.midpointHover.point, 6.2, selected, paper);
        }

        if (state.bendDrag && state.hover && !state.paintMode && !state.eraserMode) {

        }

        if (state.hover && !state.paintMode && !state.eraserMode) {

          drawPoint(state.hover, state.selected && samePoint(state.selected, state.hover) ? 5 : 4, hoverColor, hoverColor);

        if (wasdDot && !is3D && !state.paintMode && !state.eraserMode) {
          const wasdColor = state.accentMode ? cobalt : selected;

        drawRulers();
        updateMeasure();
        updateCoords();
        // Only drive the animation loop for things that actually animate over time (close highlight pulse).
        // Hover dots are now static — no need to redraw every frame just because the cursor is near a dot.
        if (state.closeHighlight) requestAnimationDraw();
      }

      function boardBounds() {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const s of state.lines) {
          if (s.from.x < minX) minX = s.from.x; if (s.from.y < minY) minY = s.from.y;
          if (s.from.x > maxX) maxX = s.from.x; if (s.from.y > maxY) maxY = s.from.y;
          if (s.to.x < minX) minX = s.to.x; if (s.to.y < minY) minY = s.to.y;

          if (f.seed.x < minX) minX = f.seed.x; if (f.seed.y < minY) minY = f.seed.y;

        }
