          confirmOverlay.classList.remove("is-open");
        }
      });
      saveOverlay.addEventListener("pointerdown", event => {
        if (event.target === saveOverlay) {
          closeSaveDialog();
        }
      });
      document.addEventListener("pointerdown", event => {
        if (state.viewOpen && !viewBox.contains(event.target) && event.target !== viewButton) {
          setViewOpen(false);
        }
        if (!event.target.closest(".brand-wrap, .menu-wrap")) closeMenus();
        if (!thicknessPopover.contains(event.target) && !thicknessButton.contains(event.target)) {
          thicknessPopover.classList.remove("is-open");
        }
        if (!palettePopover.contains(event.target) && !bucketButton.contains(event.target) && !canvas.contains(event.target)) {
          if (palettePopover.classList.contains("is-open")) {
            palettePopover.classList.remove("is-open");
            state.paintMode = false;
            updateControls();
            draw();
            persist(true);
          }
        }
      });
      // Drag-and-drop to load saves (.json / .matrix-dots / .svg)
      let _dragCounter = 0;
      document.addEventListener("dragenter", event => {
        const items = event.dataTransfer && event.dataTransfer.items;
        if (!items) return;
        const hasFile = Array.from(items).some(it => it.kind === "file");
        if (!hasFile) return;
        event.preventDefault();
        _dragCounter++;
        dropOverlay.classList.add("is-active");
      });
      document.addEventListener("dragleave", () => {
        _dragCounter--;
        if (_dragCounter <= 0) { _dragCounter = 0; dropOverlay.classList.remove("is-active"); }
      });
      document.addEventListener("dragover", event => {
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      });
      document.addEventListener("drop", event => {
        event.preventDefault();
        _dragCounter = 0;
        dropOverlay.classList.remove("is-active");
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (!file) return;
        if (is3D || file.name.toLowerCase().endsWith(".matrix3d")) {
          load3dFile(file);
        } else {
          loadProjectFile(file);
        }
      });

      canvas.addEventListener("pointerdown", handleCanvasPointerDown);
      canvas.addEventListener("pointermove", handleCanvasPointerMove);
      canvas.addEventListener("pointerup", handleCanvasPointerUp);
      canvas.addEventListener("pointercancel", handleCanvasPointerUp);
      canvas.addEventListener("contextmenu", event => event.preventDefault());
      canvas.addEventListener("wheel", handleWheel, { passive: false });
      window.addEventListener("keydown", handleKeyDownWrapper);
      window.addEventListener("resize", resizeCanvas);

      // ── 3D Mode ──────────────────────────────────────────────────────────
      const toggleDimensionButton = document.getElementById("toggleDimensionButton");
      const dimensionConfirmOverlay = document.getElementById("dimensionConfirmOverlay");
      const dimensionConfirmMessage = document.getElementById("dimensionConfirmMessage");
      const cancelDimensionButton = document.getElementById("cancelDimensionButton");
      const flattenDimensionButton = document.getElementById("flattenDimensionButton");
      const confirmDimensionButton = document.getElementById("confirmDimensionButton");
      const threedOverlay = document.getElementById("threedOverlay");
      const threedCanvas = document.getElementById("threedCanvas");
      const threedCtx = threedCanvas.getContext("2d");

      // ── 3D data model ─────────────────────────────────────────────────────
      // Lines are stored globally with full 3D coords: { from:{x,y,z}, to:{x,y,z}, thickness, colorMode }
      // Dots stay per-layer for simplicity
      let is3D = false;
      let threedZ = 0;
      const threedMinZ = -10;
      const threedMaxZ = 10;
      let threedLines = [];          // all 3D lines (cross-layer capable)
      let threedDots  = {};          // z -> [{ x, y, color }]
      let t3UndoStack = [];          // 3D undo history
      let t3RedoStack = [];          // 3D redo history

      // Pan/zoom (flat top-down view)
      let t3Scale = 1, t3OffX = 0, t3OffY = 0;
      let t3ActiveStep = 1; // adaptive dot step, kept in sync with drawThreedFlat
      let t3Panning = false, t3PanStart = null;
      let t3RightPan = null;
      let t3Hover = null;
      let t3ActivePtr = null;

      // In-progress cross-layer draw: a pending "from" point that persists across Z changes
      // { x, y, z } — set when user clicks a dot; cleared on second click or cancel
      let t3DrawFrom = null;   // the anchored start point (world + z)
      let t3DragStart = null;  // screen pos at drag start (for drag-vs-click detection)
      let t3DragMoved = false;

      // Perspective / orbit
      let t3IsPerspective = false;
      let t3RotX = -0.42;
      let t3RotY = 0.30;
      let t3OrbitStart = null;
      const t3LayerSpacing = grid * 2.2;

      // WASD pan
      const t3WasdKeys = new Set();
      let t3WasdFrame = null;
      const t3WasdSpeed = grid * 0.18;   // world units per frame
      let t3ZLabelTimer = null;

      function showZLabel() {
        // Z# no longer shown in button; label is in the canvas overlay
      }

      function clearZLabel() {
        if (t3ZLabelTimer) { clearTimeout(t3ZLabelTimer); t3ZLabelTimer = null; }
        toggleDimensionButton.textContent = "3D";
      }

      // ── Helpers ───────────────────────────────────────────────────────────
      function threedSheetEmpty() {
        return threedLines.length === 0 &&
          Object.values(threedDots).every(arr => !arr || arr.length === 0);
      }
      function twodSheetEmpty() {
        return state.lines.length === 0 && state.dots.length === 0 && state.fills.length === 0;
      }
      function getT3Dots(z) {
        if (!threedDots[z]) threedDots[z] = [];
        return threedDots[z];
      }

      // Flat coordinate helpers
      function t3ScreenToWorld(x, y) {
        return { x: (x - t3OffX) / t3Scale, y: (y - t3OffY) / t3Scale };
      }
      function t3WorldToScreen(x, y) {
        return { x: x * t3Scale + t3OffX, y: y * t3Scale + t3OffY };
      }
      function t3SnapWorld(v) { return Math.round(v / t3ActiveStep) * t3ActiveStep; }
      function t3SnappedDotFromClient(cx, cy) {
        const rect = threedCanvas.getBoundingClientRect();
        const w = t3ScreenToWorld(cx - rect.left, cy - rect.top);
        const dot = { x: t3SnapWorld(w.x), y: t3SnapWorld(w.y) };
        const s = t3WorldToScreen(dot.x, dot.y);
        return { x: dot.x, y: dot.y, sx: s.x, sy: s.y };
      }
      function t3NearestDot(cx, cy) {
        const rect = threedCanvas.getBoundingClientRect();
        const sx = cx - rect.left, sy = cy - rect.top;
        const dot = t3SnappedDotFromClient(cx, cy);
        const dist = Math.hypot(dot.sx - sx, dot.sy - sy);
        const threshold = Math.max(7, Math.min(18, grid * t3Scale * 0.46));
        if (dist > threshold) return null;
        return { x: dot.x, y: dot.y, sx: dot.sx, sy: dot.sy };
      }

      // Perspective projection
      function t3Project(wx, wy, wz) {
        const cw = threedCanvas.width  / 2;
        const ch = threedCanvas.height / 2;
        const fov = Math.min(cw, ch) * 1.6 * t3Scale;
        const camDist = Math.min(cw, ch) * 1.6 * 2.8; // fixed, independent of zoom so scale actually zooms
        const x0 = wx, y0 = wy, z0 = wz;
        const cosY = Math.cos(t3RotY), sinY = Math.sin(t3RotY);
        const x1 =  cosY * x0 + sinY * z0;
        const y1 =  y0;
        const z1 = -sinY * x0 + cosY * z0;
        const cosX = Math.cos(t3RotX), sinX = Math.sin(t3RotX);
        const x2 = x1;
        const y2 =  cosX * y1 - sinX * z1;
        const z2 =  sinX * y1 + cosX * z1;
        const zz  = z2 + camDist;
        const safe = zz > 1 ? zz : 1;
        const px = (x2 * fov) / safe + cw + (t3OffX - cw);
        const py = (y2 * fov) / safe + ch + (t3OffY - ch);
        return { sx: px, sy: py, depth: z2 };
      }

      // ── Draw ──────────────────────────────────────────────────────────────
      function drawThreed() {
        const w = threedCanvas.offsetWidth;
        const h = threedCanvas.offsetHeight;
        if (threedCanvas.width !== w || threedCanvas.height !== h) {
          threedCanvas.width  = w;
          threedCanvas.height = h;
        }
        if (!is3D) return;
        threedCtx.clearRect(0, 0, w, h);
        threedCtx.fillStyle = cssCache.paper;
        threedCtx.fillRect(0, 0, w, h);
        if (t3IsPerspective) {
          drawThreedPerspective(w, h);
        } else {
          drawThreedFlat(w, h);
        }
        drawRulers();
      }

      function drawThreedFlat(w, h) {
        // Ghost lines on other layers — filter by z of from/to
        const otherLines = threedLines.filter(l => l.from.z !== threedZ || l.to.z !== threedZ);
        for (const seg of otherLines) {
          // Draw on both the from-layer and to-layer's 2D projection
          // For flat view, project to current view and fade based on z-distance
          const fz = seg.from.z, tz = seg.to.z;
          const zdiff = Math.min(Math.abs(fz - threedZ), Math.abs(tz - threedZ));
          const alpha = Math.max(0.04, 0.20 - zdiff * 0.05);
          threedCtx.globalAlpha = alpha;
          const from = t3WorldToScreen(seg.from.x, seg.from.y);
          const to   = t3WorldToScreen(seg.to.x,   seg.to.y);
          threedCtx.lineWidth   = Math.max(0.5, (seg.thickness || 2) * t3Scale * 0.7);
          threedCtx.strokeStyle = seg.colorMode === "accent" ? cobalt : cssCache.ink;
          threedCtx.lineCap = "round";
          threedCtx.beginPath();
          threedCtx.moveTo(from.x, from.y);
          threedCtx.lineTo(to.x, to.y);
          threedCtx.stroke();
          threedCtx.globalAlpha = 1;
        }

        // Grid dots — active layer (adaptive step like 2D so density stays constant when zooming)
        let t3step = grid, t3spacing = t3step * t3Scale;
        while (t3spacing < 10 && t3step < grid * 64) { t3step *= 2; t3spacing = t3step * t3Scale; }
        while (t3spacing > 34 && t3step > grid / 128) { t3step /= 2; t3spacing = t3step * t3Scale; }
        t3ActiveStep = t3step;
        if (t3spacing >= 3) {
          const wTL = t3ScreenToWorld(0, 0);
          const wBR = t3ScreenToWorld(w, h);
          const startX = Math.floor(wTL.x / t3step) * t3step;
          const endX   = Math.ceil(wBR.x  / t3step) * t3step;
          const startY = Math.floor(wTL.y / t3step) * t3step;
          const endY   = Math.ceil(wBR.y  / t3step) * t3step;
          const dotR   = Math.max(0.7, Math.min(2.5, t3Scale * 1.4));
          const majorEvery = 5;
          threedCtx.fillStyle = state.theme === "dark" ? "#3a5a8a" : "#c8dffb";

          // Batch into sub / base / major tiers (same hierarchy as 2D grid)
          const t3MajorPts = [], t3BasePts = [], t3SubPts = [];
          for (let x = startX; x <= endX; x += t3step) {
            for (let y = startY; y <= endY; y += t3step) {
              const s = t3WorldToScreen(x, y);
              const base = isBaseGridPoint(x) && isBaseGridPoint(y);
              const major = base
                && (Math.round(x / grid) % majorEvery === 0)
                && (Math.round(y / grid) % majorEvery === 0);
              if (major)      t3MajorPts.push(s.x, s.y);
              else if (base)  t3BasePts.push(s.x, s.y);
              else            t3SubPts.push(s.x, s.y);
            }
          }
          const t3DrawBatch = (pts, alpha, r) => {
            if (!pts.length) return;
            threedCtx.globalAlpha = alpha;
            threedCtx.beginPath();
            for (let i = 0; i < pts.length; i += 2) {
              threedCtx.moveTo(pts[i] + r, pts[i + 1]);
              threedCtx.arc(pts[i], pts[i + 1], r, 0, Math.PI * 2);
            }
            threedCtx.fill();
          };
          t3DrawBatch(t3SubPts,   0.62, dotR * 0.76);
          t3DrawBatch(t3BasePts,  0.86, dotR * 1.08);
          t3DrawBatch(t3MajorPts, 1,    dotR * 1.28);
          threedCtx.globalAlpha = 1;
        }

        // Active-layer lines (both endpoints on this Z)
        const activeLines = threedLines.filter(l => l.from.z === threedZ && l.to.z === threedZ);
        threedCtx.lineCap = "round"; threedCtx.lineJoin = "round";
        for (const seg of activeLines) {
          const from = t3WorldToScreen(seg.from.x, seg.from.y);
          const to   = t3WorldToScreen(seg.to.x,   seg.to.y);
          threedCtx.lineWidth   = Math.max(0.7, (seg.thickness || 2) * t3Scale);
          threedCtx.strokeStyle = seg.colorMode === "accent" ? cobalt : cssCache.line;
          threedCtx.beginPath();
          threedCtx.moveTo(from.x, from.y);
          threedCtx.lineTo(to.x, to.y);
          threedCtx.stroke();
        }

        // Dots on active layer
        const dots = getT3Dots(threedZ);
        for (const d of dots) {
          const s = t3WorldToScreen(d.x, d.y);
          const r = Math.max(1.5, Math.min(5, t3Scale * 2.5));
          threedCtx.beginPath();
          threedCtx.arc(s.x, s.y, r, 0, Math.PI * 2);
          threedCtx.fillStyle = d.color || cssCache.line;
          threedCtx.fill();
        }

        // Pending from-point (cross-layer draw anchor)
        if (t3DrawFrom) {
          // Show anchor on its original layer projected flat
          const s = t3WorldToScreen(t3DrawFrom.x, t3DrawFrom.y);
          const onThisLayer = t3DrawFrom.z === threedZ;
          // Ring around anchor
          threedCtx.strokeStyle = cobalt;
          threedCtx.lineWidth = 1.5;
          threedCtx.globalAlpha = onThisLayer ? 1 : 0.45;
          threedCtx.beginPath();
          threedCtx.arc(s.x, s.y, Math.max(5, t3Scale * 4), 0, Math.PI * 2);
          threedCtx.stroke();
          threedCtx.globalAlpha = 1;

          // If anchor is on a different layer, draw a dashed line to hover showing cross-layer intent
          if (!onThisLayer && t3Hover) {
            const to = t3WorldToScreen(t3Hover.x, t3Hover.y);
            threedCtx.strokeStyle = cobalt;
            threedCtx.lineWidth = 1.2;
            threedCtx.globalAlpha = 0.35;
            threedCtx.setLineDash([5, 5]);
            threedCtx.beginPath();
            threedCtx.moveTo(s.x, s.y);
            threedCtx.lineTo(to.x, to.y);
            threedCtx.stroke();
            threedCtx.setLineDash([]);
            threedCtx.globalAlpha = 1;
          }
        }

        // Hover dot
        if (t3Hover) {
          const s = t3WorldToScreen(t3Hover.x, t3Hover.y);
          const r = Math.max(2, Math.min(6, t3Scale * 3));
          threedCtx.beginPath();
          threedCtx.arc(s.x, s.y, r, 0, Math.PI * 2);
          threedCtx.fillStyle = t3DrawFrom ? cobalt : (state.accentMode ? cobalt : cssCache.selected);
          threedCtx.fill();
        }

        // Preview line — show whenever a start point is anchored and we hover a different dot
        if (t3DrawFrom && t3Hover &&
            !(t3Hover.x === t3DrawFrom.x && t3Hover.y === t3DrawFrom.y && threedZ === t3DrawFrom.z)) {
          const from = t3WorldToScreen(t3DrawFrom.x, t3DrawFrom.y);
          const to   = t3WorldToScreen(t3Hover.x,    t3Hover.y);
          threedCtx.strokeStyle = state.accentMode ? cobalt : cssCache.line;
          threedCtx.lineCap = "round";
          // Glow halo
          threedCtx.globalAlpha = 0.22;
          threedCtx.lineWidth = Math.max(0.7, state.thickness * t3Scale) + 8;
          threedCtx.beginPath();
          threedCtx.moveTo(from.x, from.y);
          threedCtx.lineTo(to.x, to.y);
          threedCtx.stroke();
          // Preview stroke
          threedCtx.globalAlpha = 0.72;
          threedCtx.lineWidth = Math.max(0.7, state.thickness * t3Scale);
          threedCtx.beginPath();
          threedCtx.moveTo(from.x, from.y);
          threedCtx.lineTo(to.x, to.y);
          threedCtx.stroke();
          threedCtx.globalAlpha = 1;
        }

        // Z label indicator when a draw is pending
        if (t3DrawFrom) {
          threedCtx.globalAlpha = 0.75;
          threedCtx.fillStyle = cobalt;
          threedCtx.font = "bold 11px ui-sans-serif, system-ui, sans-serif";
          threedCtx.textAlign = "left";
          const s = t3WorldToScreen(t3DrawFrom.x, t3DrawFrom.y);
          threedCtx.fillText(`${t("dim3dFromZ")}${t3DrawFrom.z}`, s.x + 8, s.y - 18);
          threedCtx.fillText(`${t("dim3dCurrentZ")}${threedZ}`, s.x + 8, s.y - 4);
          threedCtx.globalAlpha = 1;
        }

      }

      function drawThreedPerspective(w, h) {
        // Collect all z-levels
        const zLevels = new Set([threedZ]);
        Object.keys(threedDots).forEach(k => { if (threedDots[k].length) zLevels.add(parseInt(k,10)); });
        threedLines.forEach(l => { zLevels.add(l.from.z); zLevels.add(l.to.z); });
        const sortedZ = [...zLevels].sort((a,b)=>a-b);
        threedCtx.lineCap = "round"; threedCtx.lineJoin = "round";

        // Sort layers back-to-front
        const layerDepths = sortedZ.map(z => {
          const p = t3Project(0, 0, z * t3LayerSpacing);
          return { z, depth: p.depth };
        });
        layerDepths.sort((a,b)=>b.depth-a.depth);

        for (const { z } of layerDepths) {
          const wz = z * t3LayerSpacing;
          const isActive = z === threedZ;
          const zdiff = Math.abs(z - threedZ);
          const baseAlpha = isActive ? 1 : Math.max(0.08, 0.55 - zdiff * 0.13);
          const dots = threedDots[z] || [];
          const linesHere = threedLines.filter(l => l.from.z === z && l.to.z === z);

          if (linesHere.length || dots.length) {
            // Faint grid plane
            const gStep = grid * 4, gExt = grid * 12;
            threedCtx.globalAlpha = isActive ? 0.10 : 0.04;
            threedCtx.strokeStyle = cssCache.soft;
            threedCtx.lineWidth = 0.7;
            for (let gx = -gExt; gx <= gExt; gx += gStep) {
              const a = t3Project(gx, -gExt, wz), b = t3Project(gx, gExt, wz);
              threedCtx.beginPath(); threedCtx.moveTo(a.sx,a.sy); threedCtx.lineTo(b.sx,b.sy); threedCtx.stroke();
            }
            for (let gy = -gExt; gy <= gExt; gy += gStep) {
              const a = t3Project(-gExt, gy, wz), b = t3Project(gExt, gy, wz);
              threedCtx.beginPath(); threedCtx.moveTo(a.sx,a.sy); threedCtx.lineTo(b.sx,b.sy); threedCtx.stroke();
            }
            threedCtx.globalAlpha = 1;
          }

          // Per-layer lines
          for (const seg of linesHere) {
            const from = t3Project(seg.from.x, seg.from.y, wz);
            const to   = t3Project(seg.to.x,   seg.to.y,   wz);
            const fov  = Math.min(w,h) * 1.6 * t3Scale;
            const camD = Math.min(w,h) * 1.6 * 2.8;
            const perspW = ((seg.thickness||2) * fov) / Math.max(1, from.depth + camD);
            threedCtx.lineWidth   = Math.max(0.5, perspW);
            threedCtx.strokeStyle = seg.colorMode === "accent" ? cobalt : cssCache.line;
            threedCtx.globalAlpha = baseAlpha;
            threedCtx.beginPath(); threedCtx.moveTo(from.sx,from.sy); threedCtx.lineTo(to.sx,to.sy); threedCtx.stroke();
          }
          threedCtx.globalAlpha = 1;

          for (const d of dots) {
            const p = t3Project(d.x, d.y, wz);
            threedCtx.globalAlpha = baseAlpha;
            threedCtx.fillStyle = d.color || cssCache.line;
            threedCtx.beginPath(); threedCtx.arc(p.sx, p.sy, 3, 0, Math.PI*2); threedCtx.fill();
            threedCtx.globalAlpha = 1;
          }
        }

        // Cross-layer lines (from.z ≠ to.z) — the real 3D edges!
        threedCtx.globalAlpha = 0.9;
        for (const seg of threedLines.filter(l => l.from.z !== l.to.z)) {
          const fromWz = seg.from.z * t3LayerSpacing;
          const toWz   = seg.to.z   * t3LayerSpacing;
          const from = t3Project(seg.from.x, seg.from.y, fromWz);
          const to   = t3Project(seg.to.x,   seg.to.y,   toWz);
          const fov  = Math.min(w,h) * 1.6 * t3Scale;
          const camD = Math.min(w,h) * 1.6 * 2.8;
          const perspW = ((seg.thickness||2) * fov) / Math.max(1, from.depth + camD);
          threedCtx.lineWidth   = Math.max(0.5, perspW);
          threedCtx.strokeStyle = seg.colorMode === "accent" ? cobalt : cssCache.line;
          threedCtx.beginPath(); threedCtx.moveTo(from.sx,from.sy); threedCtx.lineTo(to.sx,to.sy); threedCtx.stroke();
        }
        threedCtx.globalAlpha = 1;

        // Active layer outline (front reference wall) — brighter in dark mode
        const activeWz = threedZ * t3LayerSpacing;
        const e = grid * 14;
        const corners = [[-e,-e],[e,-e],[e,e],[-e,e],[-e,-e]];
        const pts = corners.map(([cx,cy]) => t3Project(cx,cy,activeWz));
        const wallAlpha = state.theme === "dark" ? 0.55 : 0.22;
        threedCtx.strokeStyle = cobalt; threedCtx.lineWidth = 1; threedCtx.globalAlpha = wallAlpha;
        threedCtx.setLineDash([6,6]);
        threedCtx.beginPath(); threedCtx.moveTo(pts[0].sx,pts[0].sy);
        for (let i=1;i<pts.length;i++) threedCtx.lineTo(pts[i].sx,pts[i].sy);
        threedCtx.stroke(); threedCtx.setLineDash([]); threedCtx.globalAlpha = 1;

        // Pending cross-layer anchor marker in perspective
        if (t3DrawFrom) {
          const fwz = t3DrawFrom.z * t3LayerSpacing;
          const fp  = t3Project(t3DrawFrom.x, t3DrawFrom.y, fwz);
          threedCtx.strokeStyle = cobalt; threedCtx.lineWidth = 2; threedCtx.globalAlpha = 0.8;
          threedCtx.beginPath(); threedCtx.arc(fp.sx, fp.sy, 6, 0, Math.PI*2); threedCtx.stroke();
          threedCtx.globalAlpha = 1;
        }

        threedCtx.globalAlpha = 1;
      }

      function resizeThreed() {
        if (!is3D) return;
        threedCanvas.width  = threedCanvas.offsetWidth;
        threedCanvas.height = threedCanvas.offsetHeight;
        drawThreed();
      }

      function enterThreeD() {
        is3D = true; threedZ = 0;
        t3UndoStack = []; t3RedoStack = [];
        wasdDot = null;
        document.documentElement.setAttribute("data-ruler-3d", "");
        t3IsPerspective = false;
        t3DrawFrom = null;
        threedOverlay.style.display = "";
        toggleDimensionButton.textContent = "3D";
        toggleDimensionButton.classList.add("is-active");
        bucketButton.disabled = true;
        // Read dimensions AFTER showing the overlay so offsetWidth/Height are valid
        threedCanvas.width  = threedCanvas.offsetWidth;
        threedCanvas.height = threedCanvas.offsetHeight;
        // Inherit the 2D pan/zoom: derive the world-space center from the live
        // 2D canvas rect (canvasRect is always current) and re-express it in
        // 3D canvas space so the view lands in exactly the same spot.
        t3Scale = state.scale;
        const t3cw = threedCanvas.offsetWidth  || canvasRect.width;
        const t3ch = threedCanvas.offsetHeight || canvasRect.height;
        const worldCX = (canvasRect.width  / 2 - state.offsetX) / state.scale;
        const worldCY = (canvasRect.height / 2 - state.offsetY) / state.scale;
        t3OffX = t3cw / 2 - worldCX * t3Scale;
        t3OffY = t3ch / 2 - worldCY * t3Scale;
        updateControls();
        drawRulers();
        drawThreed();
      }

      function exitThreeD() {
        is3D = false; t3IsPerspective = false;
        document.documentElement.removeAttribute("data-ruler-3d");
        t3DrawFrom = null;
        stopWasd();
        if (t3ZLabelTimer) { clearTimeout(t3ZLabelTimer); t3ZLabelTimer = null; }
        threedOverlay.style.display = "none";
        toggleDimensionButton.textContent = "2D";
        toggleDimensionButton.classList.remove("is-active");
        bucketButton.disabled = false;
        // Sync 3D pan/zoom back to 2D via world-space center so the view is consistent on exit
        state.scale = Math.max(minScale, Math.min(maxScale, t3Scale));
        const exitCW = threedCanvas.offsetWidth  || canvasRect.width;
        const exitCH = threedCanvas.offsetHeight || canvasRect.height;
        const exitWX = (exitCW / 2 - t3OffX) / t3Scale;
        const exitWY = (exitCH / 2 - t3OffY) / t3Scale;
        state.offsetX = canvasRect.width  / 2 - exitWX * state.scale;
        state.offsetY = canvasRect.height / 2 - exitWY * state.scale;
        draw();
        updateControls();
      }

      function requestSwitchDimension() {
        if (!is3D) {
          if (!twodSheetEmpty()) {
            dimensionConfirmMessage.textContent = t("dim3dEnter");
          } else { enterThreeD(); return; }
          flattenDimensionButton.style.display = "none";
        } else {
          if (!threedSheetEmpty()) {
            dimensionConfirmMessage.textContent = t("dim3dExit");
          } else { exitThreeD(); return; }
          flattenDimensionButton.style.display = "";
        }
        dimensionConfirmOverlay.classList.add("is-open");
      }

      function flattenThreeD() {
        // Project all 3D lines onto Z=0 (drop the Z axis entirely)
        state.lines = threedLines.map(l => ({
          from: { x: l.from.x, y: l.from.y },
          to:   { x: l.to.x,   y: l.to.y   },
          thickness: l.thickness,
          colorMode: l.colorMode
        })).filter(l => !(l.from.x === l.to.x && l.from.y === l.to.y));
        // Dedup
        const seen = new Set();
        state.lines = state.lines.filter(l => {
          const k  = `${l.from.x},${l.from.y},${l.to.x},${l.to.y}`;
          const k2 = `${l.to.x},${l.to.y},${l.from.x},${l.from.y}`;
          if (seen.has(k) || seen.has(k2)) return false;
          seen.add(k); return true;
        });
        state.fills = [];
        state.dots = [];
        state.undoStack = []; state.redoStack = [];
        state.selected = null; state.hover = null;
        state.dragFrom = null; state.dragStart = null;
        state.dragMoved = false; state.bendDrag = null;
        state.midpointHover = null; state.lineHover = null;
        invalidateFillCache();
        // Fit view
        const xs = state.lines.flatMap(l => [l.from.x, l.to.x]);
        const ys = state.lines.flatMap(l => [l.from.y, l.to.y]);
        if (xs.length) {
          const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
          const midY = (Math.min(...ys) + Math.max(...ys)) / 2;
          const spanX = Math.max(...xs) - Math.min(...xs) || grid * 10;
          const spanY = Math.max(...ys) - Math.min(...ys) || grid * 10;
          const rect = canvas.getBoundingClientRect();
          state.scale = Math.max(minScale, Math.min(maxScale,
            Math.min((rect.width * 0.82) / spanX, (rect.height * 0.82) / spanY)));
          state.offsetX = rect.width  / 2 - midX * state.scale;
          state.offsetY = rect.height / 2 - midY * state.scale;
        }
        threedLines = []; threedDots = {};
        persist3d();
        exitThreeD();
        persist(true);
      }

      toggleDimensionButton.addEventListener("click", requestSwitchDimension);
      cancelDimensionButton.addEventListener("click", () => dimensionConfirmOverlay.classList.remove("is-open"));
      flattenDimensionButton.addEventListener("click", () => {
        dimensionConfirmOverlay.classList.remove("is-open");
        flattenThreeD();
      });
      confirmDimensionButton.addEventListener("click", () => {
        dimensionConfirmOverlay.classList.remove("is-open");
        if (!is3D) {
          performClearBoard();
          threedLines = []; threedDots = {};
          persist3d();
          enterThreeD();
        } else {
          threedLines = []; threedDots = {};
          persist3d();
          exitThreeD();
        }
      });
      dimensionConfirmOverlay.addEventListener("pointerdown", event => {
        if (event.target === dimensionConfirmOverlay) dimensionConfirmOverlay.classList.remove("is-open");
      });

      // ── WASD pan ──────────────────────────────────────────────────────────
      function stopWasd() {
        t3WasdKeys.clear();
        if (t3WasdFrame) { cancelAnimationFrame(t3WasdFrame); t3WasdFrame = null; }
      }

      function tickWasd() {
        if (!is3D || t3WasdKeys.size === 0) { t3WasdFrame = null; return; }
        if (t3WasdKeys.has("ArrowLeft"))  t3OffX += t3WasdSpeed;
        if (t3WasdKeys.has("ArrowRight")) t3OffX -= t3WasdSpeed;
        if (t3WasdKeys.has("ArrowUp"))    t3OffY += t3WasdSpeed;
        if (t3WasdKeys.has("ArrowDown"))  t3OffY -= t3WasdSpeed;
        drawThreed();
        t3WasdFrame = requestAnimationFrame(tickWasd);
      }

      // ── 3D canvas pointer handling ────────────────────────────────────────
      threedCanvas.addEventListener("pointerdown", event => {
        if (!is3D) return;
        playSound("click");
        threedCanvas.setPointerCapture(event.pointerId);
        t3ActivePtr = event.pointerId;

        // Right-click → flat pan
        if (event.button === 2) {
          t3RightPan = { x: event.clientX, y: event.clientY, offX: t3OffX, offY: t3OffY, moved: false };
          return;
        }

        // Shift+drag or drag-in-perspective → orbit
        if (event.shiftKey || t3IsPerspective) {
          t3IsPerspective = true;
          t3OrbitStart = { x: event.clientX, y: event.clientY, rotX: t3RotX, rotY: t3RotY };
          threedCanvas.style.cursor = "grab";
          drawThreed();
          return;
        }

        // Middle / alt / meta → flat pan
        if (event.button === 1 || event.altKey || event.metaKey) {
          t3Panning = true;
          t3PanStart = { x: event.clientX, y: event.clientY, offX: t3OffX, offY: t3OffY };
          threedCanvas.style.cursor = "grabbing";
          return;
        }

        // Erase
        if (state.eraserMode) {
          const rect = threedCanvas.getBoundingClientRect();
          const sx = event.clientX - rect.left, sy = event.clientY - rect.top;
          // Erase lines whose both endpoints are on threedZ (flat erase)
          let bestIdx = -1, bestDist = Infinity;
          threedLines.forEach((seg, idx) => {
            if (seg.from.z !== threedZ && seg.to.z !== threedZ) return;
            const from = t3WorldToScreen(seg.from.x, seg.from.y);
            const to   = t3WorldToScreen(seg.to.x,   seg.to.y);
            const dx = to.x-from.x, dy = to.y-from.y, len2 = dx*dx+dy*dy;
            if (!len2) return;
            const tt = Math.max(0, Math.min(1, ((sx-from.x)*dx+(sy-from.y)*dy)/len2));
            const d  = Math.hypot(from.x+dx*tt-sx, from.y+dy*tt-sy);
            const thresh = Math.max(5, Math.min(12, Math.max(0.7,(seg.thickness||2)*t3Scale)+5));
            if (d <= thresh && d < bestDist) { bestDist=d; bestIdx=idx; }
          });
          if (bestIdx >= 0) { const removed = threedLines.splice(bestIdx,1)[0]; t3PushUndo({ type: "removeLine", index: bestIdx, line: removed }); persist3d(); drawThreed(); updateControls(); }
          return;
        }

        // Can't draw in perspective view
        if (t3IsPerspective) return;

        // Click a dot → set or complete a draw
        const dot = t3NearestDot(event.clientX, event.clientY);
        if (!dot) { t3DrawFrom = null; clearZLabel(); drawThreed(); return; }

        if (!t3DrawFrom) {
          // First click: anchor the start point
          t3DrawFrom  = { x: dot.x, y: dot.y, z: threedZ };
          t3DragStart = { x: event.clientX, y: event.clientY };
          t3DragMoved = false;
        } else {
          // Second click: complete the line (possibly cross-layer)
          const isSame = dot.x === t3DrawFrom.x && dot.y === t3DrawFrom.y && threedZ === t3DrawFrom.z;
          if (!isSame) {
            const newLine = {
              from: { x: t3DrawFrom.x, y: t3DrawFrom.y, z: t3DrawFrom.z },
              to:   { x: dot.x,        y: dot.y,        z: threedZ },
              thickness: state.thickness,
              colorMode: state.accentMode ? "accent" : "mono"
            };
            threedLines.push(newLine);
            t3PushUndo({ type: "addLine", index: threedLines.length - 1, line: newLine });
            persist3d();
            playSound("button");
            updateControls();
            // Chain: anchor at destination so the next click draws from here (matches 2D behaviour)
            t3DrawFrom  = { x: dot.x, y: dot.y, z: threedZ };
          } else {
            // Clicked the same dot → cancel the chain
            t3DrawFrom = null;
            clearZLabel();
          }
          t3DragStart = null;
          t3DragMoved = false;
        }
        drawThreed();
      });

      threedCanvas.addEventListener("pointermove", event => {
        if (!is3D) return;
        updateThreedCoords(event.clientX, event.clientY);

        if (t3OrbitStart) {
          const dx = event.clientX - t3OrbitStart.x;
          const dy = event.clientY - t3OrbitStart.y;
          t3RotY = t3OrbitStart.rotY + dx * 0.007;
          t3RotX = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, t3OrbitStart.rotX + dy*0.007));
          threedCanvas.style.cursor = "grabbing";
          drawThreed();
          return;
        }

        if (t3RightPan) {
          t3OffX = t3RightPan.offX + (event.clientX - t3RightPan.x);
          t3OffY = t3RightPan.offY + (event.clientY - t3RightPan.y);
          t3RightPan.moved = true;
          drawThreed(); return;
        }
        if (t3Panning) {
          t3OffX = t3PanStart.offX + (event.clientX - t3PanStart.x);
          t3OffY = t3PanStart.offY + (event.clientY - t3PanStart.y);
          drawThreed(); return;
        }

        if (!t3IsPerspective) {
          t3Hover = t3NearestDot(event.clientX, event.clientY) || null;
          if (t3DragStart)
            if (Math.hypot(event.clientX-t3DragStart.x, event.clientY-t3DragStart.y) > 4) t3DragMoved = true;
        }
        drawThreed();
      });

      threedCanvas.addEventListener("pointerup", event => {
        if (!is3D) return;
        if (t3OrbitStart) { t3OrbitStart = null; threedCanvas.style.cursor = "grab"; return; }
        if (t3RightPan)   { t3RightPan = null; return; }
        if (t3Panning)    { t3Panning=false; t3PanStart=null; threedCanvas.style.cursor="crosshair"; return; }
        // Single-click draw is handled entirely in pointerdown (click-click model)
      });

      threedCanvas.addEventListener("pointercancel", () => {
        t3Panning=false; t3PanStart=null; t3RightPan=null; t3OrbitStart=null;
      });

      threedCanvas.addEventListener("contextmenu", e => e.preventDefault());

      threedCanvas.addEventListener("wheel", event => {
        if (!is3D) return;
        event.preventDefault();
        if (state.zoomLocked) return;
        const rect = threedCanvas.getBoundingClientRect();
        const sx = event.clientX-rect.left, sy = event.clientY-rect.top;
        // Normalize deltaY across deltaMode (pixels / lines / pages)
        let dy = event.deltaY;
        if (event.deltaMode === 1) dy *= 20;
        else if (event.deltaMode === 2) dy *= 300;
        // Use magnitude-based factor so trackpad gives smooth continuous zoom
        const clampedDy = Math.max(-120, Math.min(120, dy));
        const factor = Math.pow(1.0012, -clampedDy);
        const newScale = Math.max(minScale, Math.min(maxScale, t3Scale*factor));
        if (newScale===t3Scale) return;
        // In perspective mode zoom toward screen center — cursor-based t3OffX adjustment
        // is a flat post-projection translation and causes a jump in 3D perspective.
        // In flat mode, zoom toward cursor as normal.
        const zx = t3IsPerspective ? rect.width  / 2 : sx;
        const zy = t3IsPerspective ? rect.height / 2 : sy;
        const wx=(zx-t3OffX)/t3Scale, wy=(zy-t3OffY)/t3Scale;
        t3Scale=newScale; t3OffX=zx-wx*t3Scale; t3OffY=zy-wy*t3Scale;
        drawThreed();
        if (document.activeElement !== zoomReadout) zoomReadout.value = `${Math.round(t3Scale*100)}%`;
        zoomOutButton.disabled = state.zoomLocked || t3Scale <= minScale + 0.001;
        zoomInButton.disabled  = state.zoomLocked || t3Scale >= maxScale - 0.001;
      }, { passive: false });

      // Return to flat view when shift released
      window.addEventListener("keyup", event => {
        if (!is3D) return;
        if (event.key === "Shift" && t3IsPerspective && !t3OrbitStart) {
          t3IsPerspective = false;
          threedCanvas.style.cursor = "crosshair";
          drawThreed();
        }
        const k = event.key;
        if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k)) {
          t3WasdKeys.delete(k);
          if (t3WasdKeys.size === 0) stopWasd();
        }
      });

      window.addEventListener("resize", () => { if (is3D) resizeThreed(); });

      // ── Key navigation wrapper ────────────────────────────────────────────
      function handleKeyDownWrapper(event) {
        if (is3D) {
          // Don't intercept w/s when typing in an input
          const inInput = document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;
          // W/S → navigate layers
          if (!inInput && (event.key === "w" || event.key === "W") && !event.metaKey && !event.ctrlKey) {
            event.preventDefault();
            threedZ = Math.max(threedMinZ, Math.min(threedMaxZ, threedZ + 1));
            playSound("layerUp");
            drawThreed();
            coords.textContent = coords.textContent.replace(/,\s*z\s*-?\d+/, `, z ${threedZ}`);
            showZLabel();
            return;
          }
          if (!inInput && (event.key === "s" || event.key === "S") && !event.metaKey && !event.ctrlKey) {
            event.preventDefault();
            threedZ = Math.max(threedMinZ, Math.min(threedMaxZ, threedZ - 1));
            playSound("layerDown");
            drawThreed();
            coords.textContent = coords.textContent.replace(/,\s*z\s*-?\d+/, `, z ${threedZ}`);
            showZLabel();
            return;
          }
          // Arrow keys → pan
          if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(event.key) && !(event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            t3WasdKeys.add(event.key);
            if (!t3WasdFrame) t3WasdFrame = requestAnimationFrame(tickWasd);
            return;
          }
          if (event.key === "Escape") return;
          if ((event.key === "r" || event.key === "R") && !event.metaKey && !event.ctrlKey) {
            if (event.target instanceof HTMLInputElement) return;
            event.preventDefault();
            requestRandomize3d();
            return;
          }
          if ((event.key === "Backspace" || event.key === " ") && t3DrawFrom) {
            event.preventDefault();
            t3DrawFrom = null;
            t3DragStart = null;
            t3DragMoved = false;
            clearZLabel();
            drawThreed();
            return;
          }
        }
        handleKeyDown(event);
      }

      restore();
      restore3d();
      refreshCssCache();
      resizeCanvas();
      if (state.threeDStart && !is3D) {
        enterThreeD();
      }
      updateControls();
    })();
  </script>
</body>
</html>
