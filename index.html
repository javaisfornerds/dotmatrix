<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.matrix</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke="%231F51FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14 32 32 50 14 50 50"/></g><g fill="%231F51FF"><circle cx="14" cy="14" r="5"/><circle cx="14" cy="50" r="5"/><circle cx="32" cy="32" r="5"/><circle cx="50" cy="14" r="5"/><circle cx="50" cy="32" r="5"/><circle cx="50" cy="50" r="5"/></g></svg>'>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f7;
      --paper: #ffffff;
      --ink: #050505;
      --muted: #6d6d6d;
      --line-soft: rgba(5, 5, 5, 0.14);
      --line: #050505;
      --toolbar: rgba(255, 255, 255, 0.92);
      --border: #d7d7d7;
      --button: #ffffff;
      --button-hover: #efefef;
      --shadow: rgba(0, 0, 0, 0.12);
      --selected: #000000;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #050505;
      --paper: #000000;
      --ink: #f6f6f6;
      --muted: #969696;
      --line-soft: rgba(246, 246, 246, 0.18);
      --line: #f6f6f6;
      --toolbar: rgba(0, 0, 0, 0.9);
      --border: #303030;
      --button: #090909;
      --button-hover: #171717;
      --shadow: rgba(255, 255, 255, 0.06);
      --selected: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 36px 1fr;
      grid-template-rows: 54px 28px 1fr;
    }

    .toolbar {
      position: relative;
      z-index: 5;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--toolbar);
      box-shadow: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .toolbar-group.primary-actions {
      gap: 6px;
    }

    .spacer {
      flex: 1 1 auto;
      min-width: 8px;
    }

    button {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--button);
      color: var(--ink);
      font: inherit;
      line-height: 1;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.36;
      transform: none;
    }

    .text-button {
      width: auto;
      min-width: 78px;
      padding: 0 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .primary-actions .text-button,
    .primary-actions .brand-button {
      min-width: auto;
      height: 34px;
      border-color: transparent;
      background: transparent;
      padding: 0 9px;
    }

    .primary-actions .text-button:hover {
      background: transparent;
      color: var(--muted);
    }

    .primary-actions .brand-button:hover {
      background: transparent;
      color: var(--ink);
    }

    .primary-actions .text-button.is-active {
      border-color: transparent;
      box-shadow: none;
      color: #1F51FF;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      pointer-events: none;
    }

    .bucket-icon {
      width: 22px;
      height: 22px;
    }

    .bucket-solid {
      fill: currentColor;
      stroke: none;
    }

    .bucket-handle {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 1.35;
    }

    .grid-icon {
      width: 20px;
      height: 20px;
    }

    .sound-icon {
      width: 22px;
      height: 22px;
    }

    .eraser-icon {
      width: 24px;
      height: 24px;
      stroke-width: 1.85;
    }

    .eraser-icon .eraser-upper {
      fill: currentColor;
      stroke: currentColor;
    }

    .eraser-icon .eraser-lower {
      fill: var(--button);
      stroke: currentColor;
    }

    .zoom-readout {
      display: block;
      width: 62px;
      height: 36px;
      border: 0;
      border-radius: 0;
      color: var(--ink);
      background: var(--button);
      font: inherit;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
    }

    .zoom-readout:focus {
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .zoom-combo {
      display: inline-grid;
      grid-template-columns: 34px 62px 34px;
      align-items: center;
      height: 38px;
      border: 1px solid var(--border);
      background: var(--button);
    }

    .zoom-combo button {
      min-width: 34px;
      height: 36px;
      border: 0;
      background: transparent;
    }

    .zoom-combo button + .zoom-readout,
    .zoom-combo .zoom-readout + button {
      border-left: 1px solid var(--border);
    }

    .thickness-wrap {
      position: relative;
    }

    .tool-wrap {
      position: relative;
    }

    .popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 20;
      display: none;
      width: 156px;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--toolbar);
      box-shadow: 0 8px 24px var(--shadow);
      transform: translateX(-50%);
    }

    .palette-popover {
      width: 180px;
    }

    .popover.is-open {
      display: block;
    }

    button.is-active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .shade-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .shade {
      width: 24px;
      min-width: 24px;
      height: 24px;
      border-color: var(--border);
    }

    .shade.is-active {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #1f51ff;
      pointer-events: none;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
    }

    .ruler-corner {
      grid-column: 1;
      grid-row: 2;
      background: var(--paper);
      pointer-events: none;
    }

    .top-ruler {
      grid-column: 2;
      grid-row: 2;
      border-bottom: 1px solid var(--border);
      background: var(--button);
    }

    .left-ruler {
      grid-column: 1;
      grid-row: 3;
      border-right: 1px solid var(--border);
      background: var(--button);
    }

    .stage {
      position: relative;
      grid-column: 2;
      grid-row: 3;
      min-height: 0;
      background: var(--paper);
      cursor: crosshair;
      touch-action: none;
    }

    .stage.is-panning {
      cursor: grabbing;
    }

    .measure {
      position: absolute;
      z-index: 12;
      display: none;
      min-width: 48px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      background: var(--toolbar);
      color: var(--ink);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      pointer-events: none;
      transform: translate(10px, -28px);
    }

    .measure.is-visible {
      display: block;
    }

    .coords {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 90;
      display: block;
      padding: 4px 6px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      pointer-events: none;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-popover {
      top: 100%;
      right: auto;
      left: 0;
      width: 180px;
      padding: 6px;
      background: var(--button);
      transform: none;
    }

    .brand-wrap.is-menu-open > .brand-popover,
    .menu-wrap.is-menu-open > .menu-popover {
      display: block;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 34px;
      border-color: transparent;
      background: transparent;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .menu-item:hover {
      background: transparent;
      color: var(--muted);
    }

    .menu-item.is-active::after {
      content: "✓";
    }

    .menu-label {
      padding: 8px 8px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .brand-wrap {
      position: relative;
    }

    .brand-button {
      min-width: auto;
      padding: 0 10px;
      border-color: transparent;
      background: transparent;
      color: #1F51FF;
      font-weight: 800;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .brand-mark .mark-line {
      stroke-width: 3.2;
    }

    .brand-mark .mark-dot {
      fill: currentColor;
      stroke: none;
    }

    .brand-popover {
      left: 0;
      width: auto;
      min-width: 170px;
      background: var(--button);
      font-size: 13px;
      font-weight: 700;
      transform: none;
    }

    .brand-version {
      margin-bottom: 7px;
    }

    .brand-credit {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .view-overlay {
      position: fixed;
      top: 54px;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.18);
    }

    .view-overlay.is-open {
      display: grid;
    }

    .view-box {
      width: min(82vw, 920px);
      height: min(72vh, 640px);
      border: 1px solid var(--border);
      outline: 0;
      background: var(--paper);
      box-shadow: 0 16px 48px var(--shadow);
    }

    #viewCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .confirm-overlay.is-open {
      display: grid;
    }

    .save-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .save-overlay.is-open {
      display: grid;
    }

    .confirm-box {
      min-width: 260px;
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--ink);
      padding: 16px;
      box-shadow: 0 16px 48px var(--shadow);
    }

    .save-box {
      min-width: 300px;
    }

    .confirm-message {
      margin-bottom: 16px;
      font-weight: 700;
    }

    .save-input {
      width: 100%;
      height: 38px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      padding: 0 10px;
      font: inherit;
      outline: none;
    }

    .save-input:focus {
      border-color: var(--ink);
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .confirm-actions .text-button {
      min-width: auto;
      border-color: transparent;
      background: transparent;
      padding: 0 8px;
    }

    .confirm-actions .text-button:hover {
      background: transparent;
      color: var(--muted);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 620px) {
      body {
        grid-template-columns: 30px 1fr;
        grid-template-rows: 50px 24px 1fr;
      }

      .toolbar {
        gap: 5px;
        padding: 6px;
      }

      button {
        min-width: 36px;
        height: 36px;
      }

      .text-button {
        min-width: 64px;
        padding: 0 10px;
      }

      .zoom-readout {
        width: 58px;
        height: 36px;
        font-size: 12px;
      }

      .zoom-combo {
        grid-template-columns: 32px 58px 32px;
      }

      .popover {
        right: 0;
        left: auto;
        transform: none;
      }
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.38);
      pointer-events: none;
    }

    .drop-overlay.is-active {
      display: grid;
    }

    .drop-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 36px 48px;
      border: 2px dashed var(--border);
      background: var(--toolbar);
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 16px 48px var(--shadow);
      pointer-events: none;
    }

    .drop-icon {
      width: 40px;
      height: 40px;
      stroke: #1F51FF;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-group primary-actions">
      <div class="brand-wrap">
        <button class="brand-button" id="brandButton" type="button" aria-label=".matrix">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <path class="mark-line" d="M14 14 32 32 50 14 50 50"></path>
            <circle class="mark-dot" cx="14" cy="14" r="5"></circle>
            <circle class="mark-dot" cx="14" cy="50" r="5"></circle>
            <circle class="mark-dot" cx="32" cy="32" r="5"></circle>
            <circle class="mark-dot" cx="50" cy="14" r="5"></circle>
            <circle class="mark-dot" cx="50" cy="32" r="5"></circle>
            <circle class="mark-dot" cx="50" cy="50" r="5"></circle>
          </svg>
        </button>
        <div class="popover brand-popover" id="brandPopover">
          <div class="brand-version">.matrix v.3.1</div>
          <div class="brand-credit" data-i18n="createdBy">Created by Brandon Wu</div>
          <div class="brand-credit" data-i18n="license">License: GPL 3.0</div>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="text-button" id="fileButton" type="button" aria-label="File" data-i18n="file">File</button>
        <div class="popover menu-popover" id="filePopover">
          <button class="menu-item" id="saveJsonButton" type="button" data-i18n="saveJson">Save JSON</button>
          <button class="menu-item" id="saveSvgButton" type="button" data-i18n="saveSvg">Save SVG</button>
          <button class="menu-item" id="loadButton" type="button" data-i18n="load">Load</button>
          <button class="menu-item" id="randomizeButton" type="button" data-i18n="randomize">Randomize</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="text-button" id="settingsButton" type="button" aria-label="Settings" data-i18n="settings">Settings</button>
        <div class="popover menu-popover" id="settingsPopover">
          <button class="menu-item" id="blankStartButton" type="button" data-i18n="blankStart">Blank Start</button>
          <div class="menu-label" data-i18n="language">Language</div>
          <button class="menu-item" type="button" data-lang="en">English</button>
          <button class="menu-item" type="button" data-lang="zh">中文</button>
          <button class="menu-item" type="button" data-lang="pt">Português</button>
        </div>
      </div>
      <button class="text-button" id="clearButton" type="button" aria-label="Clear" data-i18n="clear">Clear</button>
      <button class="text-button" id="viewButton" type="button" aria-label="View" data-i18n="view">View</button>
      <input id="loadInput" type="file" accept="application/json,.json,.matrix-dots,image/svg+xml,.svg" hidden>
    </div>
    <div class="spacer"></div>
    <div class="toolbar-group">
      <button id="accentButton" type="button" title="Change color" aria-label="Change color">
        <span class="color-dot" id="accentDot"></span>
      </button>
      <div class="tool-wrap">
        <button id="bucketButton" type="button" title="Paint bucket" aria-label="Paint bucket">
          <svg class="icon bucket-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-2 11a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 19L5 8Z" fill="currentColor"/><path d="M7 8a5 5 0 0 1 10 0"/><line x1="3" y1="8" x2="21" y2="8"/></svg>
        </button>
        <div class="popover palette-popover" id="palettePopover">
          <div class="shade-grid" id="shadeGrid"></div>
        </div>
      </div>
      <button id="eraserButton" type="button" title="Eraser" aria-label="Eraser">
        <svg class="icon eraser-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="eraser-upper" d="M9.5 11.1 13 7.3a2.2 2.2 0 0 1 3.1 0l3.2 3.2a2.2 2.2 0 0 1 0 3.1l-3.8 3.5-6-6Z"></path><path class="eraser-lower" d="M4.2 16.1 9.5 11.1l6 6-2.1 2.4H8L4.2 16.1Z"></path><path d="M8.2 19.5H21"></path></svg>
      </button>
      <div class="tool-wrap">
        <button id="thicknessButton" type="button" title="Thickness" aria-label="Thickness">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14" stroke-width="1.2"></path><path d="M5 12h14" stroke-width="2.3"></path><path d="M5 18h14" stroke-width="3.6"></path></svg>
        </button>
        <div class="popover thickness-popover" id="thicknessPopover">
          <input id="thicknessSlider" type="range" min="1" max="12" step="0.5" value="2" aria-label="Line thickness">
        </div>
      </div>
      <button id="undoButton" type="button" title="Undo" aria-label="Undo">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 4 11l4 4"></path><path d="M4 11h9a7 7 0 0 1 6.4 9.8"></path></svg>
      </button>
      <button id="redoButton" type="button" title="Redo" aria-label="Redo">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 7 4 4-4 4"></path><path d="M20 11h-9a7 7 0 0 0-6.4 9.8"></path></svg>
      </button>
      <button id="zoomLockButton" type="button" title="Lock zoom" aria-label="Lock zoom">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="1" fill="currentColor"></rect>
          <path class="lock-shackle-open" d="M8 11V7a4 4 0 0 1 8 0"></path>
          <path class="lock-shackle-closed" d="M8 11V7a4 4 0 0 1 8 0v4" style="display:none"></path>
        </svg>
      </button>
    </div>
    <div class="toolbar-group">
      <div class="zoom-combo" role="group" aria-label="Zoom">
        <button id="zoomOutButton" type="button" title="Zoom out" aria-label="Zoom out">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"></path></svg>
        </button>
      <input class="zoom-readout" id="zoomReadout" type="text" value="100%" inputmode="decimal" aria-label="Magnification">
        <button id="zoomInButton" type="button" title="Zoom in" aria-label="Zoom in">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"></path><path d="M12 7v10"></path></svg>
        </button>
      </div>
    </div>
    <div class="toolbar-group">
      <button id="gridButton" type="button" title="Grid" aria-label="Grid">
        <svg class="icon grid-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5h15v15h-15z"></path><path d="M4.5 9.5h15"></path><path d="M4.5 14.5h15"></path><path d="M9.5 4.5v15"></path><path d="M14.5 4.5v15"></path></svg>
      </button>
      <button id="themeButton" type="button" title="Theme" aria-label="Theme">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"></path></svg>
      </button>
      <button id="soundButton" type="button" title="Sound" aria-label="Sound">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l5 4V6l-5 4H5Z" fill="currentColor" stroke="none"></path><path d="M16 9.5a4 4 0 0 1 0 5"></path></svg>
      </button>
      <button id="fullscreenButton" type="button" title="Fullscreen" aria-label="Fullscreen">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M21 16v5h-5"></path><path d="M8 21H3v-5"></path></svg>
      </button>
    </div>
  </header>

  <div class="ruler-corner"></div>
  <div class="top-ruler"><canvas id="topRuler"></canvas></div>
  <div class="left-ruler"><canvas id="leftRuler"></canvas></div>
  <main class="stage" id="stage">
    <canvas id="paper"></canvas>

          blankStart: "空白开始",

          cancel: "取消",

          license: "许可证：GPL 3.0",
          enterFileName: "输入文件名",
          clearPrompt: "清除此方格纸？",

        },

          saveSvg: "Salvar SVG",

          cancel: "Cancelar",

          enterFileName: "Inserir nome do arquivo",

      function invalidateFillCache() {
        fillRevision += 1;
        fillCache = null;
      }


      function playSound(kind) {
        if (!state.soundEnabled) return;
        try {
          audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const settings = {
            button: [520, 0.018, 0.026],
            click: [300, 0.014, 0.034],
            drag: [170, 0.01, 0.05],
            connect: [680, 0.018, 0.055]
          }[kind] || [420, 0.012, 0.03];
          osc.type = kind === "drag" ? "sine" : "triangle";
          osc.frequency.setValueAtTime(settings[0], now);
          if (kind === "connect") osc.frequency.exponentialRampToValueAtTime(900, now + settings[2]);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(settings[1], now + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + settings[2]);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + settings[2] + 0.02);
        } catch {
          // Sound is optional; drawing should never depend on audio availability.
        }
      }

      function playDragSound() {
        const now = performance.now();
        if (now - lastDragSound < 90) return;
        lastDragSound = now;
        playSound("drag");
      }

      function resizeCanvas() {
        refreshCssCache();
        const rect = stage.getBoundingClientRect();
        const topRect = topRulerCanvas.parentElement.getBoundingClientRect();
        const leftRect = leftRulerCanvas.parentElement.getBoundingClientRect();
        const dpr = livePixelRatio;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasRect.width = rect.width; canvasRect.height = rect.height;
        topRulerCanvas.width = Math.round(topRect.width * dpr);
        topRulerCanvas.height = Math.round(topRect.height * dpr);
        topRulerCanvas.style.width = `${topRect.width}px`;
        topRulerCanvas.style.height = `${topRect.height}px`;
        topRulerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        rulerCache.topW = topRect.width; rulerCache.topH = topRect.height;
        leftRulerCanvas.width = Math.round(leftRect.width * dpr);
        leftRulerCanvas.height = Math.round(leftRect.height * dpr);
        leftRulerCanvas.style.width = `${leftRect.width}px`;
        leftRulerCanvas.style.height = `${leftRect.height}px`;
        leftRulerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        rulerCache.leftW = leftRect.width; rulerCache.leftH = leftRect.height;
        draw();
      }

      function screenToWorld(x, y) {
        return {
          x: (x - state.offsetX) / state.scale,
          y: (y - state.offsetY) / state.scale
        };
      }

      function worldToScreen(x, y) {
        return {
          x: x * state.scale + state.offsetX,
          y: y * state.scale + state.offsetY
        };
      }

      // Hard boundary: the canvas world extends ±200 grid units from origin.
      const worldLimit = 200 * grid;
      function clampOffset() {
        const w = canvasRect.width || 800;
        const h = canvasRect.height || 600;
        const maxX = worldLimit * state.scale;
        const minX = w - worldLimit * state.scale;
        const maxY = worldLimit * state.scale;
        const minY = h - worldLimit * state.scale;
        state.offsetX = Math.max(Math.min(maxX, minX), Math.min(Math.max(maxX, minX), state.offsetX));
        state.offsetY = Math.max(Math.min(maxY, minY), Math.min(Math.max(maxY, minY), state.offsetY));
      }

      function activeGridStep() {
        let step = grid;
        let spacing = step * state.scale;
        while (spacing > 34 && step > grid / 128) {
          step /= 2;
          spacing = step * state.scale;
        }
        while (spacing < 10 && step < grid * 64) {
          step *= 2;
          spacing = step * state.scale;
        }
        return step;
      }

      function snapWorld(value, step) {
        return Math.round(value / step) * step;
      }

      function snappedDotFromClient(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const world = screenToWorld(clientX - rect.left, clientY - rect.top);
        const step = activeGridStep();
        const dot = {
          x: snapWorld(world.x, step),
          y: snapWorld(world.y, step)
        };
        const screen = worldToScreen(dot.x, dot.y);
        return {
          x: dot.x,
          y: dot.y,
          sx: screen.x,
          sy: screen.y
        };
      }

      function isBaseGridPoint(value) {
        return Math.abs(value / grid - Math.round(value / grid)) < 0.0001;
      }

      function niceUnitStep(targetUnits) {
        const exponent = Math.floor(Math.log10(Math.max(targetUnits, 0.001)));
        const base = 10 ** exponent;
        const fraction = targetUnits / base;
        const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
        return nice * base;
      }

      function rulerStep() {
        // Clamp so ruler labels are always whole numbers (never show decimals)
        return Math.max(grid, niceUnitStep(84 / (state.scale * grid)) * grid);
      }

      function formatUnits(worldDistance) {
        const units = worldDistance / grid;
        if (Math.abs(units) >= 100) return units.toFixed(1).replace(/\.0$/, "");
        return units.toFixed(2).replace(/0$/, "").replace(/\.0$/, "");
      }

      function dragLength() {
        if (!state.dragFrom || !state.hover) return 0;
        return Math.hypot(state.hover.x - state.dragFrom.x, state.hover.y - state.dragFrom.y);
      }

      function nearestDot(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const dot = snappedDotFromClient(clientX, clientY);
        const distance = Math.hypot(dot.sx - sx, dot.sy - sy);
        const step = activeGridStep();
        const threshold = Math.max(7, Math.min(18, step * state.scale * 0.46));
        if (distance > threshold) return null;
        return {
          x: dot.x,
          y: dot.y,
          sx: dot.sx,
          sy: dot.sy,
          distance
        };
      }

      function samePoint(a, b) {
        return a && b && a.x === b.x && a.y === b.y;
      }

      function sameLine(a, b) {
        return (samePoint(a.from, b.from) && samePoint(a.to, b.to)) ||
          (samePoint(a.from, b.to) && samePoint(a.to, b.from));
      }

      function cloneFill(fill) {
        // Only copy the tiny seed/kind/shade — never the bitmap (_regionCanvas etc.).
        // Bitmaps are re-frozen lazily on the next draw() call; storing them in every
        // undo entry was the main source of 300-600 MB memory usage.
        return { seed: { x: fill.seed.x, y: fill.seed.y }, kind: fill.kind, shade: fill.shade };
      }

      // Compute and freeze the fill's pixel region using the current lines as boundary.
      // Stores a pre-rendered canvas so compositing is a fast drawImage, not a pixel loop.
      // Always bake at maxScale (3×) so drawScale is always ≤1 — we only ever downscale,
      // which is crisp at every zoom level. Budget caps prevent OOM on large drawings.
      function freezeFillRegion(fill) {
        const bounds = drawingBounds();
        const worldWidth = Math.max(1, bounds.maxX - bounds.minX);
        const worldHeight = Math.max(1, bounds.maxY - bounds.minY);
        // Bake at maxScale so the canvas is always high-enough resolution for any zoom level.
        const pixelBudget = 2000000;
        const budgetScale = Math.sqrt(pixelBudget / (worldWidth * worldHeight));
        const fillScale = Math.min(2, budgetScale); // cap at 2x — crisp enough, halves RAM vs 3x
        const safeScale = Number.isFinite(fillScale) && fillScale > 0 ? fillScale : 1;
        const fw = Math.max(1, Math.ceil(worldWidth * safeScale));
        const fh = Math.max(1, Math.ceil(worldHeight * safeScale));
        const toPixel = point => ({
          x: (point.x - bounds.minX) * safeScale,
          y: (point.y - bounds.minY) * safeScale
        });
        // Build boundary with a fat line so fill stops cleanly inside strokes
        const boundary = drawBoundaryMap(state.lines, fw, fh, toPixel,
          safeScale, seg => Math.max(2, segmentThickness(seg) * safeScale * 0.9));
        const seed = toPixel(fill.seed);
        const region = floodRegion(seed, boundary, fw, fh);
        if (!region) return false;

        // Bake the colored region into a canvas right now — rendering just does drawImage
        const color = colorParts(paintColor(fill.kind, fill.shade, 0.72));
        const regionCanvas = document.createElement("canvas");
        regionCanvas.width = fw;
        regionCanvas.height = fh;
        const rCtx = regionCanvas.getContext("2d");
        const imgData = rCtx.createImageData(fw, fh);
        for (let i = 0; i < region.length; i++) {
          if (!region[i]) continue;
          const off = i * 4;
          imgData.data[off]     = color[0];
          imgData.data[off + 1] = color[1];
          imgData.data[off + 2] = color[2];
          imgData.data[off + 3] = color[3];
        }
        rCtx.putImageData(imgData, 0, 0);

        fill._region = region;
        fill._regionCanvas = regionCanvas;
        fill._regionBounds = bounds;
        fill._regionScale = safeScale;
        return true;
      }

      function pointKey(point) {
        return `${point.x},${point.y}`;
      }

      function currentLineColorMode() {
        return state.accentMode ? "accent" : "mono";
      }

      function lineColor(segment) {
        return segment.colorMode === "accent" ? cobalt : cssCache.line;
      }

      function screenLineWidth(segment) {
        return Math.max(0.7, Math.min(18, segmentThickness(segment) * state.scale));
      }

      function maskLineWidth(segment) {
        return Math.max(0.5, screenLineWidth(segment) * 0.55);
      }

      function pushUndo(action) {
        state.undoStack.push(action);
        if (state.undoStack.length > 80) state.undoStack.shift();
        state.redoStack = [];
      }

      function findPathBetweenPoints(from, to, lines) {
        const targetKey = pointKey(to);
        const graph = new Map();
        const addEdge = (a, b, line) => {
          const key = pointKey(a);
          if (!graph.has(key)) graph.set(key, []);
          graph.get(key).push({ point: b, line });
        };
        for (const line of lines) {
          addEdge(line.from, line.to, line);
          addEdge(line.to, line.from, line);
        }
        const startKey = pointKey(from);
        const queue = [{ point: from, path: [] }];
        const seen = new Set([startKey]);
        while (queue.length) {
          const current = queue.shift();
          if (pointKey(current.point) === targetKey) return current.path;
          const edges = graph.get(pointKey(current.point)) || [];
          for (const edge of edges) {
            const key = pointKey(edge.point);
            if (seen.has(key)) continue;
            seen.add(key);
            queue.push({ point: edge.point, path: [...current.path, edge.line] });
          }
        }
        return null;
      }

      function flashClosedOutline(line, previousLines) {
        const path = findPathBetweenPoints(line.to, line.from, previousLines);
        if (!path || !path.length) return;
        state.closeHighlight = {
          lines: [...path, line],
          until: performance.now() + 1150,
          duration: 1150
        };
        window.setTimeout(() => {
          if (state.closeHighlight && performance.now() >= state.closeHighlight.until) {
            state.closeHighlight = null;
            draw();
          }
        }, 1180);
      }

      function splitBounds(lines, fills, addedLine) {
        let minX=addedLine.from.x, minY=addedLine.from.y, maxX=addedLine.from.x, maxY=addedLine.from.y;
        const chk = p => { if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; };
        chk(addedLine.to);
        for (const l of lines) { chk(l.from); chk(l.to); }
        for (const f of fills) chk(f.seed);
        const pad = grid * 3;
        return { minX: minX-pad, minY: minY-pad, maxX: maxX+pad, maxY: maxY+pad };
      }

      function drawBoundaryMap(lines, width, height, toPixel, scale, lineWidthFn) {
        const boundaryCanvas = document.createElement("canvas");
        boundaryCanvas.width = width;
        boundaryCanvas.height = height;
        const boundaryCtx = boundaryCanvas.getContext("2d");
        boundaryCtx.strokeStyle = "#000";
        boundaryCtx.lineCap = "round";
        boundaryCtx.lineJoin = "round";
        for (const line of lines) {
          const from = toPixel(line.from);
          const to = toPixel(line.to);
          boundaryCtx.lineWidth = lineWidthFn
            ? lineWidthFn(line)
            : Math.max(1, segmentThickness(line) * scale * 0.72);
          boundaryCtx.beginPath();
          boundaryCtx.moveTo(from.x, from.y);
          boundaryCtx.lineTo(to.x, to.y);
          boundaryCtx.stroke();
        }
        const data = boundaryCtx.getImageData(0, 0, width, height).data;
        const boundary = new Uint8Array(width * height);
        for (let index = 0; index < boundary.length; index += 1) {
          boundary[index] = data[index * 4 + 3] > 0 ? 1 : 0;
        }
        return boundary;
      }

      function floodRegion(seed, boundary, width, height) {
        const sx = Math.round(seed.x);
        const sy = Math.round(seed.y);
        if (sx < 0 || sy < 0 || sx >= width || sy >= height) return null;
        const startId = sy * width + sx;
        if (boundary[startId]) return null;
        // Flat index queue — avoids allocating [x,y] tuple objects per pixel
        const total = width * height;
        const queue = new Int32Array(total);
        const seen = new Uint8Array(total);
        let head = 0, tail = 0;
        queue[tail++] = startId;
        seen[startId] = 1;
        let reachedEdge = false;
        while (head < tail) {
          const id = queue[head++];
          const x = id % width;
          const y = (id - x) / width;
          if (x === 0 || y === 0 || x === width - 1 || y === height - 1) reachedEdge = true;
          // inline 4-neighbor expansion
          const r = id + 1; if (x < width-1  && !seen[r] && !boundary[r]) { seen[r]=1; queue[tail++]=r; }
          const l = id - 1; if (x > 0        && !seen[l] && !boundary[l]) { seen[l]=1; queue[tail++]=l; }
          const d = id + width; if (y < height-1 && !seen[d] && !boundary[d]) { seen[d]=1; queue[tail++]=d; }
          const u = id - width; if (y > 0       && !seen[u] && !boundary[u]) { seen[u]=1; queue[tail++]=u; }
        }
        return reachedEdge ? null : seen;
      }

      function drawingBounds(extraPoints = []) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const line of state.lines) {
          if (line.from.x < minX) minX = line.from.x; if (line.from.y < minY) minY = line.from.y;
          if (line.from.x > maxX) maxX = line.from.x; if (line.from.y > maxY) maxY = line.from.y;
          if (line.to.x < minX) minX = line.to.x; if (line.to.y < minY) minY = line.to.y;
          if (line.to.x > maxX) maxX = line.to.x; if (line.to.y > maxY) maxY = line.to.y;
        }
        for (const fill of state.fills) {
          if (fill.seed.x < minX) minX = fill.seed.x; if (fill.seed.y < minY) minY = fill.seed.y;
          if (fill.seed.x > maxX) maxX = fill.seed.x; if (fill.seed.y > maxY) maxY = fill.seed.y;
        }
        for (const pt of extraPoints) {
          if (pt.x < minX) minX = pt.x; if (pt.y < minY) minY = pt.y;
          if (pt.x > maxX) maxX = pt.x; if (pt.y > maxY) maxY = pt.y;
        }
        if (!isFinite(minX)) return { minX: -grid * 8, minY: -grid * 6, maxX: grid * 8, maxY: grid * 6 };
        const pad = grid * 3;
        return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
      }

      function layerGeometry(bounds, maxPixels = 1600000, maxScale = 2) {
        const worldWidth = Math.max(1, bounds.maxX - bounds.minX);
        const worldHeight = Math.max(1, bounds.maxY - bounds.minY);
        const scale = Math.min(maxScale, Math.sqrt(maxPixels / (worldWidth * worldHeight)));
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        return {
          scale: safeScale,
          width: Math.max(1, Math.ceil(worldWidth * safeScale)),
          height: Math.max(1, Math.ceil(worldHeight * safeScale)),
          worldWidth,
          worldHeight
        };
      }

      function toLayerPoint(bounds, scale, point) {
        return {
          x: (point.x - bounds.minX) * scale,
          y: (point.y - bounds.minY) * scale
        };
      }

      function splitExistingFills(previousFills, previousLines, newLine) {
        if (!previousFills.length || !previousLines.length) return previousFills.map(cloneFill);
        const bounds = splitBounds(previousLines, previousFills, newLine);
        const worldWidth = Math.max(1, bounds.maxX - bounds.minX);
        const worldHeight = Math.max(1, bounds.maxY - bounds.minY);
        const scale = Math.min(1, Math.sqrt(260000 / (worldWidth * worldHeight)));
        const width = Math.max(1, Math.ceil(worldWidth * scale));
        const height = Math.max(1, Math.ceil(worldHeight * scale));
        const toPixel = point => ({
          x: (point.x - bounds.minX) * scale,
          y: (point.y - bounds.minY) * scale
        });
        const toWorld = point => ({
          x: point.x / scale + bounds.minX,
          y: point.y / scale + bounds.minY
        });
        const oldBoundary = drawBoundaryMap(previousLines, width, height, toPixel, scale);
        const newBoundary = drawBoundaryMap([...previousLines, newLine], width, height, toPixel, scale);
        const nextFills = [];
        for (const fill of previousFills) {
          const oldRegion = floodRegion(toPixel(fill.seed), oldBoundary, width, height);
          if (!oldRegion) {
            nextFills.push(cloneFill(fill));
            continue;
          }
          const visited = new Uint8Array(width * height);
          const components = [];
          for (let start = 0; start < oldRegion.length; start += 1) {
            if (!oldRegion[start] || visited[start] || newBoundary[start]) continue;
            const queue = [start];
            visited[start] = 1;
            let count = 0;
            let sumX = 0;
            let sumY = 0;
            while (queue.length) {
              const id = queue.pop();
              const x = id % width;
              const y = Math.floor(id / width);
              count += 1;
              sumX += x;
              sumY += y;
              const neighbors = [id + 1, id - 1, id + width, id - width];
              for (const nextId of neighbors) {
                if (nextId < 0 || nextId >= oldRegion.length || visited[nextId]) continue;
                const nx = nextId % width;
                const ny = Math.floor(nextId / width);
                if (Math.abs(nx - x) + Math.abs(ny - y) !== 1) continue;
                if (!oldRegion[nextId] || newBoundary[nextId]) continue;
                visited[nextId] = 1;
                queue.push(nextId);
              }
            }
            if (count > 4) components.push({ x: sumX / count, y: sumY / count, count });
          }
          if (!components.length) {
            nextFills.push(cloneFill(fill));
            continue;
          }
          for (const component of components) {
            nextFills.push({
              seed: toWorld(component),
              kind: fill.kind,
              shade: fill.shade
            });
          }
        }
        return nextFills;
      }

      function addLine(from, to) {
        if (!from || !to || samePoint(from, to)) return false;
        const previousLines = state.lines.slice();
        const previousFills = state.fills.map(cloneFill);
        const next = {
          from: { x: from.x, y: from.y },
          to: { x: to.x, y: to.y },
          thickness: state.thickness,
          colorMode: currentLineColorMode()
        };
        if (state.lines.some(line => sameLine(line, next))) return false;
        // Fills are frozen bitmaps — no need to split them geometrically.
        // Just carry them forward as-is; their stored _region is unchanged.
        state.lines.push(next);
        invalidateFillCache();
        state.redo = [];
        pushUndo({ type: "addLine", line: next, previousFills, nextFills: previousFills });
        flashClosedOutline(next, previousLines);
        playSound("connect");
        persist(true);
        return true;
      }

      function connectClickedDot(dot) {
        if (!state.selected) {
          state.selected = { x: dot.x, y: dot.y };
          state.hover = { x: dot.x, y: dot.y };
        } else if (samePoint(state.selected, dot)) {
          state.selected = null;
        } else {
          addLine(state.selected, dot);
          state.selected = { x: dot.x, y: dot.y };
        }
      }

      function endCurrentConnect() {
        state.selected = null;
        state.hover = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        measure.classList.remove("is-visible");
        draw();
      }

      function undo() {
        const action = state.undoStack.pop();
        if (!action) return;
        if (action.type === "addLine") {
          state.lines.pop();
          if (action.previousFills) state.fills = action.previousFills.map(cloneFill);
          invalidateFillCache();
        } else if (action.type === "addFill") {
          state.fills.pop();
          invalidateFillCache();
        } else if (action.type === "removeFill") {
          state.fills.splice(action.index, 0, action.fill);
          invalidateFillCache();
        } else if (action.type === "addDot") {
          state.dots.pop();
        } else if (action.type === "removeDot") {
          state.dots.splice(action.index, 0, action.dot);
        } else if (action.type === "bendLine") {
          state.lines.splice(action.index, 2, action.original);
          invalidateFillCache();
        } else if (action.type === "removeLine") {
          state.lines.splice(action.index, 0, action.line);
          if (action.previousFills) state.fills = action.previousFills.map(cloneFill);
          invalidateFillCache();
        }
        state.redoStack.push(action);
        state.selected = null;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        persist(true);
        draw();
        updateControls();
      }

      function redo() {
        const action = state.redoStack.pop();
        if (!action) return;
        if (action.type === "addLine") {
          state.lines.push(action.line);
          if (action.nextFills) state.fills = action.nextFills.map(cloneFill);
          invalidateFillCache();
        } else if (action.type === "addFill") {
          state.fills.push(action.fill);
          invalidateFillCache();
        } else if (action.type === "removeFill") {
          state.fills.splice(action.index, 1);
          invalidateFillCache();
        } else if (action.type === "addDot") {
          state.dots.push(action.dot);
        } else if (action.type === "removeDot") {
          state.dots.splice(action.index, 1);
        } else if (action.type === "bendLine") {
          state.lines.splice(action.index, 1, ...action.replacement);
          invalidateFillCache();
        } else if (action.type === "removeLine") {
          state.lines.splice(action.index, 1);
          if (action.nextFills) state.fills = action.nextFills.map(cloneFill);
          invalidateFillCache();
        }
        state.undoStack.push(action);
        state.selected = null;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        persist(true);
        draw();
        updateControls();
      }

      function zoomAt(nextScale, sx, sy) {
        if (state.zoomLocked) return;
        // Snap to whole percentage steps (1%, 2%, ...) so zoom display is always a clean integer
        const rawPct = nextScale * 100;
        const snappedPct = Math.max(Math.round(minScale * 100), Math.min(Math.round(maxScale * 100), Math.round(rawPct)));
        const clamped = snappedPct / 100;
        if (clamped === state.scale) return;
        const world = screenToWorld(sx, sy);
        state.scale = clamped;
        state.offsetX = sx - world.x * state.scale;
        state.offsetY = sy - world.y * state.scale;
        clampOffset();
        persist();
        draw();
        updateControls();
        // No re-bake needed on zoom — fills are baked at maxScale, always crisp when downscaled.
        clearTimeout(zoomSettleTimer);
        zoomSettleTimer = null;
      }

      function zoomBy(factor) {
        zoomAt(state.scale * factor, canvasRect.width / 2, canvasRect.height / 2);
      }

      function commitZoomInput() {
        const raw = zoomReadout.value.replace(/[^\d]/g, "");
        const parsed = parseInt(raw, 10);
        const clamped = Math.max(8, Math.min(300, Number.isFinite(parsed) && parsed > 0 ? parsed : Math.round(state.scale * 100)));
        zoomAt(clamped / 100, canvasRect.width / 2, canvasRect.height / 2);
        updateControls();
      }

      function cleanZoomInput() {}


      function centerOrigin(resetScale = true) {
        const rect = canvas.getBoundingClientRect();
        if (resetScale) state.scale = 1;
        state.offsetX = rect.width / 2;
        state.offsetY = rect.height / 2;
      }

      function resetView() {
        centerOrigin(true);
        persist(true);
        draw();
        updateControls();
      }

      function performClearBoard() {
        state.lines = [];
        state.fills = [];
        state.dots = [];
        state.redo = [];
        state.undoStack = [];
        state.redoStack = [];
        state.selected = null;
        state.hover = null;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        state.erasing = false;
        invalidateFillCache();
        centerOrigin(true);
        persist(true);
        draw();
        updateControls();
      }

      function requestClearBoard() {
        confirmOverlay.classList.add("is-open");
      }

      function requestSaveName(type) {
        pendingSaveType = type;
        saveNameInput.value = "";
        saveOverlay.classList.add("is-open");
        window.setTimeout(() => saveNameInput.focus(), 0);
      }

      function closeSaveDialog() {
        pendingSaveType = null;
        saveOverlay.classList.remove("is-open");
        saveNameInput.value = "";
      }

      function closeMenus(except = null) {
        brandPopover.classList.remove("is-open");
        menuWraps.forEach(wrap => {
          if (wrap !== except) wrap.classList.remove("is-menu-open");
        });
      }

      function openMenu(wrap) {
        if (!wrap) return;
        closeMenus(wrap);
        wrap.classList.add("is-menu-open");
      }

      function setTheme(theme) {
        state.theme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = state.theme;
        // CSS variables change with theme — refresh the cache after the DOM attribute update
        requestAnimationFrame(() => { refreshCssCache(); draw(); updateControls(); });
        invalidateFillCache();
        persist(true);
      }

      function updateControls() {
        undoButton.disabled = state.undoStack.length === 0;
        zoomLockButton.classList.toggle("is-active", state.zoomLocked);
        zoomLockButton.title = state.zoomLocked ? "Unlock zoom" : "Lock zoom";
        zoomLockButton.setAttribute("aria-label", zoomLockButton.title);
        zoomLockButton.querySelector(".lock-shackle-open").style.display = state.zoomLocked ? "none" : "";
        zoomLockButton.querySelector(".lock-shackle-closed").style.display = state.zoomLocked ? "" : "none";
        redoButton.disabled = state.redoStack.length === 0;
        zoomOutButton.disabled = state.zoomLocked || state.scale <= minScale + 0.001;
        zoomInButton.disabled = state.zoomLocked || state.scale >= maxScale - 0.001;
        if (document.activeElement !== zoomReadout) {
          zoomReadout.value = `${Math.round(state.scale * 100)}%`;
        }
        thicknessSlider.value = state.thickness;
        bucketButton.classList.toggle("is-active", state.paintMode);
        eraserButton.classList.toggle("is-active", state.eraserMode);
        eraserButton.title = t("eraser");
        eraserButton.setAttribute("aria-label", t("eraser"));
        blankStartButton.classList.toggle("is-active", state.blankStart);
        accentButton.classList.toggle("is-active", !state.paintMode && !state.eraserMode);
        viewButton.classList.toggle("is-active", state.viewOpen);
        gridButton.classList.toggle("is-active", state.gridLines);
        soundButton.classList.toggle("is-active", !state.soundEnabled);
        soundButton.title = t("sound");
        soundButton.setAttribute("aria-label", t("sound"));
        soundButton.innerHTML = state.soundEnabled
          ? '<svg class="icon sound-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.8v4.4h3.2l5.1 4.1V5.7L7.7 9.8H4.5Z" fill="currentColor" stroke="none"></path><path d="M15.8 9.3a4.4 4.4 0 0 1 0 5.4"></path><path d="M18.5 7a8 8 0 0 1 0 10"></path></svg>'
          : '<svg class="icon sound-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.8v4.4h3.2l5.1 4.1V5.7L7.7 9.8H4.5Z" fill="currentColor" stroke="none"></path><path d="m17 9 4 6"></path><path d="m21 9-4 6"></path></svg>';
        fullscreenButton.classList.toggle("is-active", Boolean(document.fullscreenElement));
        accentButton.title = t("changeColor");
        accentButton.setAttribute("aria-label", t("changeColor"));
        accentDot.style.background = state.accentMode ? cobalt : cssCache.line;
        themeButton.innerHTML = state.theme === "dark"
          ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.5A8.7 8.7 0 0 1 9.5 3.5a9 9 0 1 0 11 11Z"></path></svg>'
          : '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="m19.1 4.9-2.1 2.1"></path><path d="m7 17-2.1 2.1"></path></svg>';
        renderShadePalette();
        document.querySelectorAll("[data-i18n]").forEach(element => {
          element.textContent = t(element.dataset.i18n);
          if (element.tagName === "BUTTON") {
            element.setAttribute("aria-label", element.textContent);
            if (!element.closest(".primary-actions")) {
              element.title = element.textContent;
            } else {
              element.removeAttribute("title");
            }
          }
        });
        confirmMessage.textContent = t("clearPrompt");
        document.querySelectorAll("[data-lang]").forEach(button => {
          button.classList.toggle("is-active", button.dataset.lang === state.lang);
        });

        // Custom tool cursors
        if (state.eraserMode) {
          const ink = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const paper = state.theme === "dark" ? "%23000000" : "%23ffffff";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M9.5 11.1 13 7.3a2.2 2.2 0 0 1 3.1 0l3.2 3.2a2.2 2.2 0 0 1 0 3.1l-3.8 3.5-6-6Z' fill='${ink}' stroke='${ink}' stroke-width='0.3'/><path d='M4.2 16.1 9.5 11.1l6 6-2.1 2.4H8L4.2 16.1Z' fill='${paper}' stroke='${ink}' stroke-width='1.85'/><path d='M8.2 19.5H21' stroke='${ink}' stroke-width='1.85' stroke-linecap='round'/></svg>`;
          stage.style.cursor = `url("data:image/svg+xml,${cur}") 9 18, crosshair`;
        } else if (state.paintMode) {
          // Use the current paint color for the bucket fill, same shape as button icon
          const rawColor = paintColor(state.paintKind, state.paintKind === "blue" ? state.blueShade : state.shade, 1);
          // Encode the color for use in SVG URL — convert to a hex-safe format
          const tmpEl = document.createElement("canvas");
          const tmpCtx = tmpEl.getContext("2d");
          tmpCtx.fillStyle = rawColor;
          tmpCtx.fillRect(0, 0, 1, 1);
          const [r, g, b] = tmpCtx.getImageData(0, 0, 1, 1).data;
          const paintHex = `%23${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`;
          const ink = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M5 8h14l-2 11a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 19L5 8Z' fill='${paintHex}' stroke='${ink}' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/><path d='M7 8a5 5 0 0 1 10 0' fill='none' stroke='${ink}' stroke-width='1.7' stroke-linecap='round'/><line x1='3' y1='8' x2='21' y2='8' stroke='${ink}' stroke-width='1.7' stroke-linecap='round'/></svg>`;
          stage.style.cursor = `url("data:image/svg+xml,${cur}") 12 4, crosshair`;
        } else if (state.accentMode) {
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20'><circle cx='10' cy='10' r='5' fill='%231F51FF'/></svg>`;
          stage.style.cursor = `url("data:image/svg+xml,${cur}") 10 10, crosshair`;
        } else {
          const inkHex = state.theme === "dark" ? "%23f6f6f6" : "%23050505";
          const cur = `<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20'><circle cx='10' cy='10' r='5' fill='${inkHex}'/></svg>`;
          stage.style.cursor = `url("data:image/svg+xml,${cur}") 10 10, crosshair`;
        }
      }

      function segmentThickness(segment) {
        return Number.isFinite(segment.thickness) ? segment.thickness : state.thickness;
      }

      function isStraightPreview(from, to) {
        if (!from || !to || samePoint(from, to)) return false;
        const dx = Math.abs(to.x - from.x);
        const dy = Math.abs(to.y - from.y);
        return dx === 0 || dy === 0 || Math.abs(dx - dy) < 0.0001;
      }

      function shadeColor(shade, alpha = 1) {
        const safeShade = Math.max(1, Math.min(20, Math.round(shade || 1)));
        const mapped = state.theme === "dark" ? 21 - safeShade : safeShade;
        const value = Math.round(248 - ((mapped - 1) / 19) * 218);
        return `rgba(${value}, ${value}, ${value}, ${alpha})`;
      }

      function blueShadeColor(shade, alpha = 1) {
        const palette = [
          [166, 187, 255],
          [88, 125, 255],
          [31, 81, 255],
          [17, 56, 215],
          [8, 31, 132]
        ];
        const safeShade = Math.max(1, Math.min(5, Math.round(shade || 3)));
        const mapped = state.theme === "dark" ? 6 - safeShade : safeShade;
        const color = palette[mapped - 1];
        return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
      }

      function paintColor(kind, shade, alpha = 1) {
        return kind === "blue" ? blueShadeColor(shade, alpha) : shadeColor(shade, alpha);
      }

      function renderShadePalette() {
        shadeGrid.innerHTML = "";
        for (let shade = 1; shade <= 20; shade += 1) {
          const button = document.createElement("button");
          button.className = `shade${state.paintKind === "gray" && shade === state.shade ? " is-active" : ""}`;
          button.type = "button";
          button.title = `Shade ${shade}`;
          button.setAttribute("aria-label", `Shade ${shade}`);
          button.style.background = shadeColor(shade);
          button.addEventListener("click", () => {
            state.paintKind = "gray";
            state.shade = shade;
            state.paintMode = true;
            state.eraserMode = false;
            updateControls();
            renderShadePalette();
          });
          shadeGrid.appendChild(button);
        }
        for (let shade = 1; shade <= 5; shade += 1) {
          const button = document.createElement("button");
          button.className = `shade${state.paintKind === "blue" && shade === state.blueShade ? " is-active" : ""}`;
          button.type = "button";
          button.title = `Blue ${shade}`;
          button.setAttribute("aria-label", `Blue ${shade}`);
          button.style.background = blueShadeColor(shade);
          button.addEventListener("click", () => {
            state.paintKind = "blue";
            state.blueShade = shade;
            state.paintMode = true;
            state.eraserMode = false;
            updateControls();
            renderShadePalette();
          });
          shadeGrid.appendChild(button);
        }
      }

      function nearestMidpoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        let closest = null;
        for (let index = 0; index < state.lines.length; index += 1) {
          const line = state.lines[index];
          const mid = {
            x: (line.from.x + line.to.x) / 2,
            y: (line.from.y + line.to.y) / 2
          };
          const screen = worldToScreen(mid.x, mid.y);
          const distance = Math.hypot(screen.x - sx, screen.y - sy);
          const threshold = Math.max(14, Math.min(28, 16 + segmentThickness(line) * state.scale));
          if (distance <= threshold && (!closest || distance < closest.distance)) {
            closest = { index, point: mid, sx: screen.x, sy: screen.y, distance };
          }
        }
        return closest;
      }

      function nearestLine(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        let closest = null;
        for (let index = 0; index < state.lines.length; index += 1) {
          const line = state.lines[index];
          const from = worldToScreen(line.from.x, line.from.y);
          const to = worldToScreen(line.to.x, line.to.y);
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const lengthSq = dx * dx + dy * dy;
          if (!lengthSq) continue;
          const t = Math.max(0, Math.min(1, ((sx - from.x) * dx + (sy - from.y) * dy) / lengthSq));
          const px = from.x + dx * t;
          const py = from.y + dy * t;
          const distance = Math.hypot(px - sx, py - sy);
          const threshold = Math.max(5, Math.min(12, screenLineWidth(line) + 5));
          if (distance <= threshold && (!closest || distance < closest.distance)) {
            closest = { line, index, x: sx, y: sy, distance };
          }
        }
        return closest;
      }

      function eraseLineAt(clientX, clientY) {
        const hit = nearestLine(clientX, clientY);
        if (!hit) return false;
        const previousFills = state.fills.map(cloneFill);
        const [line] = state.lines.splice(hit.index, 1);
        const nextFills = state.fills.map(cloneFill);
        pushUndo({
          type: "removeLine",
          line,
          index: hit.index,
          previousFills,
          nextFills
        });
        state.selected = null;
        state.hover = null;
        state.dragFrom = null;
        state.dragStart = null;
        state.dragMoved = false;
        state.midpointHover = null;
        state.lineHover = null;
        state.bendDrag = null;
        invalidateFillCache();
        persist(true);
        draw();
        updateControls();
        return true;
      }

      function eraseDotAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const hitRadius = Math.max(10, Math.min(22, state.scale * 8));
        for (let i = state.dots.length - 1; i >= 0; i--) {
          const dot = state.dots[i];
          const p = worldToScreen(dot.x, dot.y);
          if (Math.hypot(p.x - sx, p.y - sy) <= hitRadius) {
            const [removed] = state.dots.splice(i, 1);
            pushUndo({ type: "removeDot", dot: removed, index: i });
            persist(true);
            draw();
            updateControls();
            return true;
          }
        }
        return false;
      }

      function fillContainsPoint(fill, clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        if (sx < 0 || sy < 0 || sx >= rect.width || sy >= rect.height) return false;
        const world = screenToWorld(sx, sy);
        // Use frozen region if available (works even when boundary lines are gone)
        if (fill._region && fill._regionBounds && fill._regionScale) {
          const rb = fill._regionBounds;
          const rs = fill._regionScale;
          const rw = Math.max(1, Math.ceil((rb.maxX - rb.minX) * rs));
          const rh = Math.max(1, Math.ceil((rb.maxY - rb.minY) * rs));
          const px = Math.round((world.x - rb.minX) * rs);
          const py = Math.round((world.y - rb.minY) * rs);
          if (px < 0 || py < 0 || px >= rw || py >= rh) return false;
          return fill._region[py * rw + px] === 1;
        }
        // Fallback: flood from seed using current lines (for fills without frozen region)
        if (!state.lines.length) return false;
        const target = world;
        const bounds = drawingBounds([fill.seed, target]);
        const geometry = layerGeometry(bounds, 1400000, 2);
        const toPixel = point => toLayerPoint(bounds, geometry.scale, point);
        const boundary = drawBoundaryMap(state.lines, geometry.width, geometry.height, toPixel, geometry.scale);
        const region = floodRegion(toPixel(fill.seed), boundary, geometry.width, geometry.height);
        if (!region) return false;
        const targetPixel = toPixel(target);
        const tx = Math.round(targetPixel.x);
        const ty = Math.round(targetPixel.y);
        if (tx < 0 || ty < 0 || tx >= geometry.width || ty >= geometry.height) return false;
        return region[ty * geometry.width + tx] === 1;
      }

      function removeFillAt(clientX, clientY) {
        for (let index = state.fills.length - 1; index >= 0; index -= 1) {
          if (!fillContainsPoint(state.fills[index], clientX, clientY)) continue;
          const fill = state.fills.splice(index, 1)[0];
          pushUndo({ type: "removeFill", fill, index });
          invalidateFillCache();
          persist(true);
          draw();
          updateControls();
          return true;
        }
        return false;
      }


      function requestRandomize() {
        randomizeMessage.textContent = t("randomizePrompt");
        randomizeOverlay.classList.add("is-open");
      }

      function generateRandomVector() {
        // ── True random seed via crypto ──────────────────────────────────
        const seedArr = new Uint32Array(4);
        crypto.getRandomValues(seedArr);
        let s0 = seedArr[0] >>> 0 || 1, s1 = seedArr[1] >>> 0 || 2;
        let s2 = seedArr[2] >>> 0 || 3, s3 = seedArr[3] >>> 0 || 4;

        // xoshiro128** PRNG
        function rand() {
          const r = (Math.imul(s1 * 5 | 0, 7) >>> 0) / 0x100000000;
          const t = s1 << 9;
          s2 ^= s0; s3 ^= s1; s1 ^= s2; s0 ^= s3;
          s2 ^= t; s3 = (s3 << 11) | (s3 >>> 21);
          return r;
        }
        const ri = (a, b) => Math.floor(rand() * (b - a + 1)) + a;
        const rf = (a, b) => rand() * (b - a) + a;
        const rp = a => a[Math.floor(rand() * a.length)];
        const snap = v => Math.round(v / grid) * grid;
        const pt = (x, y) => ({ x: snap(x), y: snap(y) });
        const dedup = lines => {
          const seen = new Set();
          return lines.filter(l => {
            if (!l || !l.from || !l.to) return false;
            if (l.from.x === l.to.x && l.from.y === l.to.y) return false;
            const k = [l.from.x, l.from.y, l.to.x, l.to.y].join(",");
            const k2 = [l.to.x, l.to.y, l.from.x, l.from.y].join(",");
            if (seen.has(k) || seen.has(k2)) return false;
            seen.add(k); return true;
          });
        };
        const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

        // ── Global palette decision ──────────────────────────────────────
        const paletteMode = rp(["mono", "accent", "bicolor", "gradient", "allBlue", "fullRandom"]);
        const baseThick   = ri(1, 7);
        const thickMode   = rp(["uniform", "thin-to-thick", "thick-to-thin", "random", "two-weight"]);
        const thickB      = ri(1, maxThickness);
        let lineIdx = 0;

        function pickThick() {
          const i = lineIdx++;
          if (thickMode === "uniform")        return baseThick;
          if (thickMode === "thin-to-thick")  return Math.max(1, Math.min(maxThickness, 1 + Math.floor(i / 5)));
          if (thickMode === "thick-to-thin")  return Math.max(1, Math.min(maxThickness, maxThickness - Math.floor(i / 5)));
          if (thickMode === "two-weight")     return i % 3 === 0 ? thickB : baseThick;
          return ri(1, maxThickness);
        }

        function pickColor(i, total) {
          if (paletteMode === "mono")       return "normal";
          if (paletteMode === "accent")     return "accent";
          if (paletteMode === "allBlue")    return "accent";
          if (paletteMode === "bicolor")    return i % 2 === 0 ? "accent" : "normal";
          if (paletteMode === "gradient")   return i / (total || 1) > 0.5 ? "accent" : "normal";
          return rand() > 0.45 ? "accent" : "normal";
        }

        function makeLine(from, to, tOverride) {
          const i = lineIdx;
          return { from: { x: from.x, y: from.y }, to: { x: to.x, y: to.y },
                   thickness: tOverride ?? pickThick(), colorMode: pickColor(i, 120) };
        }

        // ── Dot color options ────────────────────────────────────────────
        const dotColors = () => [
          cobalt, cobalt, cssCache.line,
          shadeColor(ri(3, 17)), shadeColor(ri(3, 17)),
          blueShadeColor(ri(1, 5)), blueShadeColor(ri(1, 5))
        ];

        // ── Point grid builder ───────────────────────────────────────────
        function makeGrid(cx, cy, w, h) {
          const pts = [];
          for (let dx = -w; dx <= w; dx++)
            for (let dy = -h; dy <= h; dy++)
              pts.push(pt(cx + dx * grid, cy + dy * grid));
          return pts;
        }

        // ── Individual shape generators ──────────────────────────────────

        function genPolygon(cx, cy, sides, radius, rotation, thick) {
          const lines = [];
          const verts = [];
          for (let i = 0; i < sides; i++) {
            const a = rotation + (i / sides) * Math.PI * 2;
            verts.push(pt(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius));
          }
          for (let i = 0; i < verts.length; i++)
            lines.push(makeLine(verts[i], verts[(i + 1) % verts.length], thick));
          return { lines, verts };
        }

        function genStar(cx, cy, points, r1, r2, rotation) {
          const lines = [];
          const verts = [];
          for (let i = 0; i < points * 2; i++) {
            const a = rotation + (i / (points * 2)) * Math.PI * 2;
            const r = i % 2 === 0 ? r1 : r2;
            verts.push(pt(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
          }
          for (let i = 0; i < verts.length; i++)
            lines.push(makeLine(verts[i], verts[(i + 1) % verts.length]));
          return { lines, verts };
        }

        function genSpiral(cx, cy, turns, startR, endR, stepsPerTurn) {
          const lines = [];
          const total = turns * stepsPerTurn;
          const pts = [];
          for (let i = 0; i <= total; i++) {
            const a = (i / stepsPerTurn) * Math.PI * 2;
            const r = startR + (endR - startR) * (i / total);
            pts.push(pt(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
          }
          for (let i = 0; i < pts.length - 1; i++)
            lines.push(makeLine(pts[i], pts[i + 1]));
          return lines;
        }

        function genGrid(cx, cy, cols, rows, sx, sy) {
          const lines = [];
          for (let r = 0; r <= rows; r++)
            for (let c = 0; c < cols; c++) {
              const a = pt(cx + c * sx, cy + r * sy);
              const b = pt(cx + (c + 1) * sx, cy + r * sy);
              lines.push(makeLine(a, b));
            }
          for (let c = 0; c <= cols; c++)
            for (let r = 0; r < rows; r++) {
              const a = pt(cx + c * sx, cy + r * sy);
              const b = pt(cx + c * sx, cy + (r + 1) * sy);
              lines.push(makeLine(a, b));
            }
          return lines;
        }

        function genCircuit(pts) {
          const lines = [];
          const nodes = shuffle(pts.slice()).slice(0, ri(8, 20));
          for (let i = 0; i < nodes.length - 1; i++) {
            const a = nodes[i], b = nodes[i + 1];
            const mid = rand() > 0.5 ? pt(b.x, a.y) : pt(a.x, b.y);
            lines.push(makeLine(a, mid));
            lines.push(makeLine(mid, b));
            if (rand() > 0.7) {
              const c = nodes[ri(0, nodes.length - 1)];
              const mid2 = rand() > 0.5 ? pt(c.x, b.y) : pt(b.x, c.y);
              lines.push(makeLine(b, mid2));
              lines.push(makeLine(mid2, c));
            }
          }
          return lines;
        }

        function genWeb(nodes, density) {
          const lines = [];
          for (let i = 0; i < density; i++) {
            const a = nodes[ri(0, nodes.length - 1)];
            const b = nodes[ri(0, nodes.length - 1)];
            if (a !== b) lines.push(makeLine(a, b));
          }
          return lines;
        }

        function genRadial(cx, cy, spokes, innerR, outerR, doubleSpoke) {
          const lines = [];
          const center = pt(cx, cy);
          for (let i = 0; i < spokes; i++) {
            const a = (i / spokes) * Math.PI * 2;
            const inner = pt(cx + Math.cos(a) * innerR, cy + Math.sin(a) * innerR);
            const outer = pt(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
            lines.push(makeLine(innerR > 0 ? inner : center, outer));
            if (doubleSpoke && rand() > 0.5) {
              const outerB = pt(cx + Math.cos(a) * outerR * rf(1.1, 1.6), cy + Math.sin(a) * outerR * rf(1.1, 1.6));
              lines.push(makeLine(outer, outerB));
            }
          }
          // Concentric rings
          const rings = ri(1, 3);
          for (let r = 0; r < rings; r++) {
            const radius = innerR + (outerR - innerR) * ((r + 1) / (rings + 1));
            const ringPts = [];
            for (let i = 0; i < spokes; i++) {
              const a = (i / spokes) * Math.PI * 2;
              ringPts.push(pt(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius));
            }
            for (let i = 0; i < ringPts.length; i++)
              lines.push(makeLine(ringPts[i], ringPts[(i + 1) % ringPts.length]));
          }
          return lines;
        }

        function genFractalTree(ox, oy, angle, length, depth, branchFactor) {
          if (depth === 0 || length < grid * 0.5) return [];
          const lines = [];
          const ex = ox + Math.cos(angle) * length;
          const ey = oy + Math.sin(angle) * length;
          lines.push(makeLine(pt(ox, oy), pt(ex, ey), Math.max(1, depth)));
          const spread = rf(0.3, 0.7);
          const branches = rand() > 0.4 ? 3 : 2;
          for (let b = 0; b < branches; b++) {
            const da = (b - (branches - 1) / 2) * spread;
            lines.push(...genFractalTree(ex, ey, angle + da, length * rf(0.55, 0.72), depth - 1, branchFactor));
          }
          return lines;
        }

        function genHexGrid(cx, cy, rings) {
          const lines = [];
          const r = grid;
          const hexPts = (hx, hy) => Array.from({ length: 6 }, (_, i) => {
            const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
            return pt(hx + Math.cos(a) * r, hy + Math.sin(a) * r);
          });
          const centers = [{ x: cx, y: cy }];
          for (let ring = 1; ring <= rings; ring++) {
            for (let side = 0; side < 6; side++) {
              for (let step = 0; step < ring; step++) {
                const a = (side / 6) * Math.PI * 2 + Math.PI / 6;
                const b = ((side + 2) / 6) * Math.PI * 2 + Math.PI / 6;
                const hx = cx + Math.cos(a) * r * 1.732 * ring + Math.cos(b) * r * 1.732 * step;
                const hy = cy + Math.sin(a) * r * 1.732 * ring + Math.sin(b) * r * 1.732 * step;
                centers.push({ x: snap(hx), y: snap(hy) });
              }
            }
          }
          for (const c of centers) {
            const vs = hexPts(c.x, c.y);
            for (let i = 0; i < 6; i++)
              lines.push(makeLine(vs[i], vs[(i + 1) % 6]));
          }
          return lines;
        }

        function genLissajous(cx, cy, a, b, delta, steps, scale) {
          const pts = [];
          for (let i = 0; i <= steps; i++) {
            const t = (i / steps) * Math.PI * 2;
            pts.push(pt(cx + Math.cos(a * t + delta) * scale, cy + Math.sin(b * t) * scale));
          }
          const lines = [];
          for (let i = 0; i < pts.length - 1; i++) lines.push(makeLine(pts[i], pts[i + 1]));
          return lines;
        }

        function genCross(cx, cy, arms, armLen, armW) {
          const lines = [];
          for (let arm = 0; arm < arms; arm++) {
            const a = (arm / arms) * Math.PI * 2;
            const perp = a + Math.PI / 2;
            const tip = pt(cx + Math.cos(a) * armLen, cy + Math.sin(a) * armLen);
            const base1 = pt(cx + Math.cos(perp) * armW, cy + Math.sin(perp) * armW);
            const base2 = pt(cx - Math.cos(perp) * armW, cy - Math.sin(perp) * armW);
            lines.push(makeLine(base1, tip));
            lines.push(makeLine(base2, tip));
            lines.push(makeLine(base1, base2));
            if (rand() > 0.5) {
              const crossbar = pt(cx + Math.cos(a) * armLen * 0.6, cy + Math.sin(a) * armLen * 0.6);
              const cb1 = pt(crossbar.x + Math.cos(perp) * armW * 0.7, crossbar.y + Math.sin(perp) * armW * 0.7);
              const cb2 = pt(crossbar.x - Math.cos(perp) * armW * 0.7, crossbar.y - Math.sin(perp) * armW * 0.7);
              lines.push(makeLine(cb1, cb2));
            }
          }
          return lines;
        }

        // ── Compose the composition ──────────────────────────────────────
        const newLines = [];
        const newDots  = [];

        // How many layers / systems to combine
        const numSystems  = ri(3, 7);
        const canvasSpan  = ri(10, 22); // half-width in grid units
        const cx0 = 0, cy0 = 0;

        const systemTypes = [
          "polygon","polygon","star","spiral","radial","radial","hexgrid",
          "circuit","web","tree","lissajous","cross","grid","ring"
        ];

        const usedSystems = [];
        for (let si = 0; si < numSystems; si++) usedSystems.push(rp(systemTypes));

        // Each system gets its own center offset so they overlap / interact
        for (let si = 0; si < usedSystems.length; si++) {
          const stype = usedSystems[si];
          const ox = cx0 + ri(-canvasSpan * 0, canvasSpan * 0) * grid;
          const oy = cy0 + ri(-canvasSpan * 0, canvasSpan * 0) * grid;
          const off = { x: ri(-canvasSpan, canvasSpan) * grid, y: ri(-canvasSpan, canvasSpan) * grid };

          if (stype === "polygon") {
            const sides = ri(3, 12);
            const r = ri(3, canvasSpan) * grid;
            const rot = rf(0, Math.PI * 2);
            const t = ri(1, maxThickness);
            const { lines, verts } = genPolygon(off.x, off.y, sides, r, rot, t);
            newLines.push(...lines);
            // Optionally add inner polygon
            if (rand() > 0.4) {
              const { lines: inner } = genPolygon(off.x, off.y, sides, r * rf(0.3, 0.7), rot + Math.PI / sides, ri(1, t));
              newLines.push(...inner);
              // Connect inner to outer vertices
              const { lines: innerB } = genPolygon(off.x, off.y, sides, r * rf(0.3, 0.7), rot, ri(1, t));
              newLines.push(...innerB);
              if (rand() > 0.5)
                for (let v = 0; v < verts.length; v += ri(1, 3))
                  newLines.push(makeLine(verts[v], pt(off.x, off.y)));
            }
          } else if (stype === "star") {
            const pts = ri(4, 12);
            const r1 = ri(4, canvasSpan) * grid;
            const r2 = r1 * rf(0.25, 0.65);
            const rot = rf(0, Math.PI);
            const { lines, verts } = genStar(off.x, off.y, pts, r1, r2, rot);
            newLines.push(...lines);
            if (rand() > 0.5) {
              const { lines: inner } = genStar(off.x, off.y, pts, r1 * 0.5, r2 * 0.5, rot);
              newLines.push(...inner);
            }
